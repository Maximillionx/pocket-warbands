<title>Pocket Warbands</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column. Top: your warband (banner, live formation board, roster tiles, formations). Then the road (map, choice, scouting, event or market), nemeses, recruiting tent, stash. Sticky action bar at the bottom. Sheets slide up for soldiers, warband, traits and boons. Single committed dusk-tabletop look. */
:root{
  --bg:#12303a; --bg-2:#0d2630; --panel:#1b4351; --panel-2:#22525f; --ink:#f7efdf; --muted:#9dbabe; --line:rgba(247,239,223,.12);
  --gold:#f6b93b; --gold-deep:#b47d14; --gold-ink:#3a2500;
  --ally:#5bb6ff; --foe:#ef6a52; --ok:#7ad69e; --warn:#f2a65a;
  --common:#a9c0c4; --rare:#6fd6a8; --epic:#c89cff; --legend:#ff9f43; --mythic:#ff6ad5;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
html,body{background:var(--bg);}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(120% 60% at 50% -10%, #1d4a57 0%, var(--bg) 60%) fixed, var(--bg);}
.wrap{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:14px 48px;display:flex;flex-direction:column;gap:22px;}
.wrap.has-bar{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px));}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:.01em;text-wrap:balance;}
button{font:inherit;color:inherit;cursor:pointer;}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.num{font-variant-numeric:tabular-nums;}
.muted{color:var(--muted);}
.r-common{color:var(--common);} .r-rare{color:var(--rare);} .r-epic{color:var(--epic);} .r-legendary{color:var(--legend);} .r-mythic{color:var(--mythic);} .r-role{color:var(--ally);}

@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes glow{0%,100%{box-shadow:0 4px 0 var(--gold-deep),0 0 0 0 rgba(246,185,59,0)}50%{box-shadow:0 4px 0 var(--gold-deep),0 0 0 6px rgba(246,185,59,.25)}}
.enter > *{animation:rise .38s var(--ease) both;}
.enter > *:nth-child(2){animation-delay:.04s} .enter > *:nth-child(3){animation-delay:.08s} .enter > *:nth-child(4){animation-delay:.12s} .enter > *:nth-child(5){animation-delay:.16s} .enter > *:nth-child(n+6){animation-delay:.2s}

.pills{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-weight:600;font-size:14px;}
.pill.bump{animation:pop .4s var(--ease);}
.coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe39a,var(--gold) 55%,var(--gold-deep));box-shadow:0 0 0 1.5px #7a520a inset;flex:none;display:inline-block;}
.morale{display:inline-flex;gap:3px;align-items:center;}
.morale i{width:10px;height:14px;background:var(--ally);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%);}
.morale i.off{background:rgba(247,239,223,.18);}

.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;}
.hint{font-size:13px;color:var(--muted);margin:0;}

/* team */
.team{display:flex;flex-direction:column;gap:12px;}
.team-top{display:flex;align-items:center;gap:12px;}
.flag{flex:none;background:none;border:0;padding:0;line-height:0;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25));}
.team-name{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;}
.team-name h1{font-size:25px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.team-name small{display:block;font-size:12px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.team-stats{display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
.boardwrap{border-radius:16px;overflow:hidden;border:2px solid #2a5a3a;background:#4b8440;box-shadow:0 8px 24px rgba(0,0,0,.3);}
#board{display:block;width:100%;height:170px;cursor:pointer;}
.board-cap{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap;}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;}
.fchip{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:rgba(246,185,59,.12);color:var(--gold);border:1px solid rgba(246,185,59,.35);}
.fchip.boon{background:rgba(200,156,255,.12);color:var(--epic);border-color:rgba(200,156,255,.35);}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 6px 10px;border-radius:14px;background:var(--panel);border:1px solid var(--line);min-width:0;transition:transform .12s var(--ease),opacity .2s;}
.tile:active{transform:scale(.96);}
.tile.off{opacity:.6;}
.tile canvas{width:52px;height:52px;border-radius:12px;background:radial-gradient(circle at 50% 70%,#2c6170,#173a46);}
.tile .tn{font-weight:700;font-size:13px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tile .tl{font-size:11px;color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tile .xp{width:78%;flex:none;height:4px;margin-top:3px;}
.tb{position:absolute;top:5px;right:5px;font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:1px 5px;background:var(--bg-2);color:var(--muted);}
.tb.w{color:var(--warn);} .tb.up{background:var(--gold);color:var(--gold-ink);}
.tflags{position:absolute;top:7px;left:7px;display:flex;gap:4px;}
.tflags i{width:8px;height:8px;display:block;}
.tflags .gd{transform:rotate(45deg);border-radius:2px;}
.tflags .gd.common{background:var(--common);} .tflags .gd.rare{background:var(--rare);} .tflags .gd.epic{background:var(--epic);}
.tflags .bd{border-radius:50%;background:var(--gold);}
.fold{border:1px solid var(--line);border-radius:14px;background:rgba(0,0,0,.12);}
.fold summary{list-style:none;cursor:pointer;padding:10px 14px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:10px;}
.fold summary::-webkit-details-marker{display:none;}
.fold summary::after{content:"Show";color:var(--muted);font-weight:600;font-size:12px;}
.fold[open] summary::after{content:"Hide";}
.fold > div{padding:0 12px 12px;}
.forms{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;}
.form{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:rgba(0,0,0,.14);min-width:0;}
.form.on{border-color:rgba(246,185,59,.5);background:linear-gradient(160deg,rgba(246,185,59,.12),rgba(0,0,0,.1));}
.form .fh{display:flex;align-items:center;gap:8px;}
.form b{font-size:14px;flex:1;min-width:0;}
.form.on b{color:var(--gold);}
.pips{display:inline-flex;gap:3px;}
.pips i{width:7px;height:7px;border-radius:50%;background:rgba(247,239,223,.18);}
.pips i.on{background:var(--gold);}
.form .cnt{font-size:11px;color:var(--muted);}
.form p{margin:3px 0 0;font-size:12px;color:var(--muted);line-height:1.35;}
.form.on p{color:var(--ink);}

/* road */
.next{background:linear-gradient(160deg,#3a2a2a 0%,#2a2226 100%);border:1px solid rgba(239,106,82,.35);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;scroll-margin-top:12px;}
.next.boss{border-color:rgba(246,185,59,.55);background:linear-gradient(160deg,#41301f 0%,#2a2226 100%);}
.next.elite{border-color:rgba(239,106,82,.7);background:linear-gradient(160deg,#4a2622 0%,#2a2226 100%);}
.next.road{border-color:var(--line);background:linear-gradient(160deg,#1f3f4a 0%,#172f38 100%);}
.next.event{border-color:rgba(200,156,255,.45);background:linear-gradient(160deg,#2f2a48 0%,#1c2a35 100%);}
.next.market{border-color:rgba(246,185,59,.45);background:linear-gradient(160deg,#3a3320 0%,#1c2a30 100%);}
.next h2{font-size:26px;line-height:1.05;}
.next .meta{color:#e8c9c0;font-size:14px;}
.efs{display:flex;flex-wrap:wrap;gap:5px;}
.efs span{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:2px 7px;background:rgba(239,106,82,.16);color:#ffb7a8;}
.scout{margin:0;font-size:13px;color:#f1dcc0;display:flex;gap:8px;align-items:flex-start;}
.scout::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-top:7px;}
.nemline{margin:0;font-size:13px;font-weight:600;color:#ffb7a8;border-left:3px solid var(--foe);padding-left:8px;}
.powers{display:flex;gap:10px;font-size:13px;font-weight:700;}
.powers span:first-child{color:var(--ally);} .powers span:last-child{color:#ffb7a8;}
.map{display:flex;align-items:center;}
.map .node{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:rgba(0,0,0,.25);border:2px solid rgba(247,239,223,.18);color:var(--muted);flex:none;}
.map .node svg{width:16px;height:16px;}
.map .node .coin{width:12px;height:12px;}
.map .node.done.w{background:var(--ally);border-color:var(--ally);color:#0b2233;}
.map .node.done.l{background:#5a3a36;border-color:var(--foe);color:#ffd2c9;}
.map .node.done.n{background:#3c3a52;border-color:var(--epic);color:#e9dcff;}
.map .node.cur{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 4px rgba(246,185,59,.18);}
.map .node.boss{width:38px;height:38px;border-radius:10px;}
.map .node.boss svg{width:22px;height:22px;}
.map .link{flex:1;height:3px;background:rgba(247,239,223,.15);min-width:8px;}
.map .link.done{background:var(--ally);}
.roads{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.roadc{text-align:left;border-radius:14px;padding:12px;background:rgba(0,0,0,.22);border:1.5px solid var(--line);display:flex;flex-direction:column;gap:5px;min-width:0;transition:transform .12s var(--ease),border-color .2s;}
.roadc:active{transform:scale(.97);}
.roadc .ri{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--bg-2);font-weight:700;font-size:18px;}
.roadc .ri svg{width:20px;height:20px;}
.roadc b{font-size:16px;line-height:1.2;}
.roadc p{margin:0;font-size:12px;color:var(--muted);line-height:1.35;}
.roadc .rw{font-size:12px;font-weight:700;color:var(--gold);}
.roadc .nemline{font-size:12px;}
.roadc.skirmish .ri{color:var(--ink);} .roadc.elite{border-color:rgba(239,106,82,.5);} .roadc.elite .ri{color:var(--foe);}
.roadc.event{border-color:rgba(200,156,255,.4);} .roadc.event .ri{color:var(--epic);} .roadc.market{border-color:rgba(246,185,59,.4);}
.evtext{margin:0;font-size:15px;max-width:62ch;}
.choices{display:flex;flex-direction:column;gap:8px;}
.choice{text-align:left;border-radius:12px;padding:10px 12px;background:var(--panel);border:1.5px solid var(--line);transition:transform .12s var(--ease);}
.choice:active{transform:scale(.98);}
.choice b{display:block;font-size:15px;}
.choice span{font-size:13px;color:var(--muted);}
.choice:disabled{opacity:.45;cursor:not-allowed;}
.outcome{margin:0;font-size:15px;}
.mlist{display:flex;flex-direction:column;}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--line);}
.mrow > div{flex:1;min-width:0;}
.mrow p{margin:2px 0 0;font-size:13px;color:var(--muted);}
.rtag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-left:4px;}
.rtag.common{color:var(--common);} .rtag.rare{color:var(--rare);} .rtag.epic{color:var(--epic);}

.strip{display:flex;flex-wrap:wrap;gap:4px;}
.mini{position:relative;width:38px;height:38px;border-radius:10px;background:rgba(0,0,0,.22);}
.mini.big{width:46px;height:46px;background:rgba(246,185,59,.15);}
.mini.nem{box-shadow:0 0 0 2px var(--foe);background:rgba(239,106,82,.18);}
.mini canvas{width:100%;height:100%;display:block;}
.mini b{position:absolute;right:-3px;bottom:-3px;min-width:16px;height:16px;border-radius:8px;background:var(--bg-2);border:1px solid var(--line);font-size:10px;display:grid;place-items:center;padding:0 3px;}

.btn{font-family:var(--display);font-size:20px;letter-spacing:.02em;background:var(--gold);color:var(--gold-ink);border:0;border-radius:14px;padding:12px 18px;box-shadow:0 4px 0 var(--gold-deep);transition:transform .08s, box-shadow .08s, background .2s;}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-deep);}
.btn:disabled{background:#5c6f73;color:#c9d4d5;box-shadow:0 4px 0 #3f4f53;cursor:not-allowed;}
.btn.wide{width:100%;}
.btn.pulse{animation:glow 1.4s ease-in-out infinite;}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none;font-size:16px;padding:9px 14px;}
.btn.ghost.danger{color:#ffb7a8;border-color:rgba(239,106,82,.4);}
.btn.small{font-size:15px;padding:8px 12px;border-radius:11px;box-shadow:0 3px 0 var(--gold-deep);}

.bar-fixed{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top, rgba(13,38,48,.98) 70%, rgba(13,38,48,0));}
.bar-in{max-width:488px;margin:0 auto;display:flex;align-items:center;gap:12px;}
.bar-in .info{flex:1;min-width:0;font-size:13px;color:var(--muted);line-height:1.3;}
.bar-in .info b{display:block;color:var(--ink);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-in .btn{flex:none;min-width:132px;}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;}
.sec-h h2{font-size:22px;}
.sec-h span{color:var(--muted);font-size:13px;text-align:right;}
.list{display:flex;flex-direction:column;gap:10px;}

.unit{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;transition:opacity .25s;}
.unit.off{opacity:.55;}
.port{width:56px;height:56px;border-radius:12px;background:radial-gradient(circle at 50% 70%,#2c6170,#173a46);display:block;}
.uname{font-weight:700;font-size:16px;line-height:1.2;}
.uname em,.pickhead h2 em{font-style:normal;color:var(--gold);}
.usub{color:var(--muted);font-size:13px;margin-top:2px;}
.lv{display:inline-block;}
.lv.pop{animation:pop .45s var(--ease);color:var(--gold);}
.xprow{display:flex;align-items:center;gap:8px;margin-top:8px;}
.xp{flex:1;height:6px;background:var(--bg-2);border-radius:3px;overflow:hidden;display:block;}
.xp i{display:block;height:100%;background:var(--ally);border-radius:3px;transition:width .6s var(--ease);}
.xpn{font-size:11px;color:var(--muted);white-space:nowrap;}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.chip{border:1px solid currentColor;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;line-height:1.5;}
.chip.common{color:var(--common);} .chip.rare{color:var(--rare);} .chip.epic{color:var(--epic);}
.combo{margin-top:6px;font-size:12px;font-weight:700;color:var(--gold);}
.shop .unit{background:#1a3a44;}
.shop-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;color:var(--muted);font-size:13px;}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px;}
.badge.rare{background:rgba(111,214,168,.18);color:var(--rare);}
.badge.new{background:rgba(246,185,59,.18);color:var(--gold);}
.hired{color:var(--muted);font-size:13px;font-weight:600;align-self:center;}
.nemcard{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:center;border-radius:14px;padding:10px 12px;background:linear-gradient(160deg,#3a2526,#26252b);border:1px solid rgba(239,106,82,.45);}
.nemcard canvas{width:48px;height:48px;border-radius:10px;background:rgba(239,106,82,.15);}
.nemcard b{font-size:15px;color:#ffd0c6;}
.nemcard p{margin:2px 0 0;font-size:12px;color:var(--muted);}
.irow{display:flex;justify-content:space-between;gap:10px;border-top:1px dashed var(--line);padding:8px 0;font-size:13px;}
.irow > span:first-child{min-width:0;}
.fallen{color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:4px;}
.fallen div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:4px;}
.foot{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;}

/* battle */
.btop{display:flex;align-items:center;gap:10px;}
.btop .brand{font-family:var(--display);font-size:24px;line-height:1;flex:1;min-width:0;}
.btop .brand small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bhud{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;}
.side{display:flex;flex-direction:column;gap:4px;min-width:0;}
.side.r{text-align:right;}
.side .nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar{height:8px;background:var(--bg-2);border-radius:4px;overflow:hidden;display:flex;}
.bar i{display:block;height:100%;transition:width .25s linear;}
.side.l .bar i{background:var(--ally);} .side.r .bar{justify-content:flex-end;} .side.r .bar i{background:var(--foe);}
.vs{font-family:var(--display);font-size:22px;color:var(--muted);}
.field{border-radius:16px;overflow:hidden;border:3px solid #2a5a3a;background:#4b8440;box-shadow:0 10px 30px rgba(0,0,0,.35);}
.field canvas{display:block;width:100%;height:auto;}
.ctrl{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;}
.speeds{display:flex;gap:6px;}
.speeds button{border:1.5px solid var(--line);background:var(--bg-2);border-radius:10px;padding:7px 12px;font-weight:700;transition:border-color .2s,color .2s;}
.speeds button.on{border-color:var(--gold);color:var(--gold);}
.log{display:flex;flex-direction:column;gap:4px;font-size:13px;min-height:96px;}
.log div{color:var(--muted);animation:rise .3s var(--ease) both;}
.log div.a{color:var(--ink);} .log div.k{color:var(--gold);} .log div.d{color:#f3a596;}

/* results & end */
.banner{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;}
.banner h1{font-size:54px;line-height:.95;}
.banner.win h1{color:var(--gold);text-shadow:0 4px 0 var(--gold-deep);}
.banner.loss h1{color:var(--foe);text-shadow:0 4px 0 #8a2e20;}
.banner p{margin:0;color:var(--muted);max-width:34ch;}
.banner .pills{justify-content:center;margin-top:6px;}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;opacity:0;transform:translateY(4px);transition:opacity .3s, transform .3s var(--ease);}
.tags.show{opacity:1;transform:none;}
.tag{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:2px 7px;background:var(--bg-2);}
.tag.up{background:var(--gold);color:var(--gold-ink);}
.tag.mvp{background:rgba(200,156,255,.2);color:var(--epic);}
.tag.cu{color:var(--ally);} .tag.h{color:var(--ok);}
.tag.w{color:var(--warn);} .tag.s{color:var(--foe);} .tag.k{color:var(--ink);}
.gain{font-weight:700;color:var(--ally);white-space:nowrap;}
.ncards{display:flex;flex-direction:column;gap:8px;}

function wpick(rng, pairs){ const tot = pairs.reduce((a,p)=>a+p[1],0); let r = rng()*tot; for (const p of pairs){ r -= p[1]; if (r<=0) return p[0]; } return pairs[pairs.length-1][0]; }

function formations(clsList){
  const c = {}; clsList.forEach(k=>c[k]=(c[k]||0)+1);
  return Object.entries(FORMS).map(([id,F])=>{ const n=F.count(c); const tier=F.tiers.filter(x=>n>=x).length; return {id, F, n, tier, next:F.tiers[tier]}; });
}
function formGain(baseList, cls){
  const a = formations(baseList), b = formations([...baseList, cls]);
  return b.filter((x,i)=>x.tier>a[i].tier).map(x=>({name:x.F.name, up:a.find(y=>y.id===x.id).tier>0}));
}

}

function audio(){ if (!state || !state.sound || AC===false) return null; if (!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC = false; return null; } } if (AC.state==='suspended') AC.resume(); return AC; }

  hit:()=>noise(0.06,0.05,1500+Math.random()*900), shoot:()=>tone(520,0.08,'triangle',0.025,0,0.5), die:()=>tone(170,0.25,'sine',0.07,0,0.45),
  coin:()=>{ tone(1200,0.08,'square',0.025); tone(1600,0.1,'square',0.025,0.07); }, level:()=>[523,659,784,1047].forEach((f,i)=>tone(f,0.18,'triangle',0.045,i*0.07)),
  win:()=>[392,523,659,784].forEach((f,i)=>tone(f,0.35,'triangle',0.055,i*0.12)), lose:()=>[330,262,196].forEach((f,i)=>tone(f,0.4,'sine',0.055,i*0.18)),
  tap:()=>tone(720,0.04,'sine',0.025), horn:()=>{ tone(220,0.6,'sawtooth',0.03,0,1.01); tone(330,0.6,'sawtooth',0.022,0.05,1.0); },
};
function sfx(n){ if (!state || !state.sound || (B && B.skipping)) return; if (n==='hit'||n==='shoot'){ const now=performance.now(); if (now-lastHitSfx<55) return; lastHitSfx=now; } try{ SFX[n] && SFX[n](); }catch(e){} }

function shade(hex, f){ const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255; return `rgb(${clamp(Math.round(r*f),0,255)},${clamp(Math.round(g*f),0,255)},${clamp(Math.round(b*f),0,255)})`; }

function roadSection(){
  const n = state.node;
  let kind = 'road', inner = '';
  if (!n) inner = roadsHTML();
  else if (n.type==='event'){ kind = 'event'; inner = eventHTML(n); }
  else if (n.type==='market'){ kind = 'market'; inner = marketHTML(n); }
  else { kind = n.type==='boss' ? 'boss' : n.type==='elite' ? 'elite' : ''; inner = fightHTML(); }
  return `<section class="next ${kind}" id="road">${n ? mapStrip() : ''}${inner}</section>`;
}

const RING_VAL = {common:3, rare:5, epic:8, legendary:12};
const RING_PRICE = {common:45, rare:80, epic:140, legendary:230};
const unitRings = u => [...((u && u.spells) || []).filter(Boolean), u && u.ult].filter(id=>id && RINGS[id]);
const ringsOfKind = (kind, rars) => Object.keys(RINGS).filter(id=>RINGS[id].kind===kind && (!rars || rars.includes(RINGS[id].rarity)));
function rollRing(rng, w, kind){
  const r = rng(), rar = r<w[0] ? 'common' : r<w[0]+w[1] ? 'rare' : r<w[0]+w[1]+w[2] ? 'epic' : 'legendary';
  const k = kind || (rng()<0.68 ? 'spell' : 'ult');
  let pool = ringsOfKind(k, [rar]); if (!pool.length) pool = ringsOfKind(k);
  return pick(rng, pool);
}
function rollRingShop(){
  const rng = mulberry32((state.seed + state.battle*389 + state.fights*17 + (state.ringRolls||0)*991) >>> 0);
  const w = state.fights < 4 ? [0.36,0.36,0.2] : [0.3,0.36,0.24];
  const first = state.fights===0 && !state.ringRolls;
  const ids = first ? [rollRing(rng,[0,0.75,0.25],'spell'), rollRing(rng,[0,1,0],'ult'), rollRing(rng,w)] : [rollRing(rng,w,'spell'), rollRing(rng,w), rollRing(rng,w)];
  state.ringShop = ids.map(id=>({id, price:price(RING_PRICE[RINGS[id].rarity]), sold:false}));
}
const ringIcon = (id, sm) => { const rar = id && RINGS[id] ? RINGS[id].rarity : 'empty'; return `<span class="ringi ${sm?'sm':''} ${rar} ${id&&RINGS[id]&&RINGS[id].kind==='ult'?'ult':''}" aria-hidden="true"><i></i></span>`; };

function ringSlotsHTML(u){

    ${have.length ? `<div class="gopts">${have.map(id=>{ const R = RINGS[id]; return `<button class="gopt" data-act="ringequip" data-ring="${id}"><span>${ringIcon(id,true)} <b class="r-${R.rarity}">${esc(R.name)}</b> <span class="muted">${R.kind==='ult'?'Ultimate':'Spell'} · ${esc(R.desc.replace(/^Ultimate: (.)/,(m,c)=>c.toUpperCase()))}</span></span><span class="eq">Equip</span></button>`; }).join('')}</div>` : '<p class="hint">Buy rings from the Ringmaker in camp, or win them from elite fights, sieges and markets.</p>'}</div>`;
}
function equipRing(u, id){
  const idx = (state.rings||[]).indexOf(id); if (!u || idx<0) return;
  const R = RINGS[id];
  if (R.kind==='ult'){ state.rings.splice(idx,1); if (u.ult) state.rings.push(u.ult); u.ult = id; }
  else {
    u.spells = (u.spells && u.spells.length===2) ? u.spells : [u.spells?.[0]||null, u.spells?.[1]||null];
    if (u.spells.includes(id)) return toast(`${u.name} already wears a ${R.name}.`);
    let s = u.spells.findIndex(x=>!x); state.rings.splice(idx,1);
    if (s<0){ s = 1; state.rings.push(u.spells[1]); }
    u.spells[s] = id;
  }
  discover([u], true); save(); sfx('tap'); toast(`${u.name} now wears the ${R.name}.`);
  checkAch();
}
function removeRing(u, key){
  if (!u) return;
  if (key==='u'){ if (u.ult){ state.rings.push(u.ult); u.ult = null; } }
  else { const i = +key; if (u.spells && u.spells[i]){ state.rings.push(u.spells[i]); u.spells[i] = null; } }
  save();
}

/* ring casting in battle */
function zapFx(a, b, col){ if (!B.skipping) B.zaps.push({x1:a.x,y1:a.y-8,x2:b.x,y2:b.y-8,life:0.3,col}); }
function bestCluster(f, r){ const foes = foesOf(f); let best = null, bn = -1; for (const o of foes){ let n = 0; for (const q of foes) if (Math.hypot(q.x-o.x,q.y-o.y) < r) n++; if (n>bn){ bn = n; best = o; } } return best; }
function mostWounded(f, thr){ let best = null, bf = thr; for (const o of B.fs) if (o.alive && o.side===f.side){ const fr = o.hp/o.maxHp; if (fr<bf){ bf = fr; best = o; } } return best; }
function launch(f, t, kind, onHit){ const k = PROJ[kind] || PROJ.orb, d = Math.hypot(t.x-f.x, t.y-f.y); B.ps.push({src:f, tgt:t, kind, arc:k.arc, sx:f.x+6*f.facing, sy:f.y-10, t:0, dur:Math.max(0.12, d/k.v), mult:0, onHit}); }
function castText(f, id){ const R = RINGS[id]; addText(f.x, f.y-40, R.short, RARCOL[R.rarity], R.kind==='ult'?11:8); }
function castSpell(f, id){
  const foes = foesOf(f); if (!foes.length) return false;
  const near = nearestOf(f, foes);
  switch (id){
    case 'spark': zapFx(f, near, '#bfe3ff'); hit(f, near, 1.2, false); break;
    case 'mend': { const t = mostWounded(f, 0.85); if (!t) return false; applyHeal(f, t, t.maxHp*0.2); break; }
    case 'stoneskin': f.shieldT = 3; break;
    case 'haste': f.hasteT = 3; sparks(f.x, f.y-8, '#ffe08a', 6, 0.7); break;
    case 'firebolt': launch(f, near, 'fire', ()=>{ hit(f, near, 1.8, false); for (const o of B.fs) if (o!==near && o.alive && o.side!==f.side && Math.hypot(o.x-near.x,o.y-near.y)<32) hit(f, o, 0.5, false); sparks(near.x, near.y-6, '#ff9f43', 12, 1.3); }); break;
    case 'frost': zapFx(f, near, '#9ad7ff'); near.stun = Math.max(near.stun||0, 2); sparks(near.x, near.y-8, '#d6f1ff', 10, 0.9); break;
    case 'blink': { const w = foes.reduce((a,b)=>b.hp<a.hp?b:a); puff(f.x,f.y); const dir = w.side ? -1 : 1; f.x = clamp(w.x - dir*14, 12, 366); f.y = w.y; f.px = f.x; f.py = f.y; puff(f.x,f.y); hit(f, w, 1.5, false); break; }
    case 'warcry': for (const o of B.fs) if (o.alive && o.side===f.side && Math.hypot(o.x-f.x,o.y-f.y)<90){ o.buffT = 4; o.buffM = Math.max(o.buffM||1, 1.25); } B.shake = Math.min(5, B.shake+1); break;
    case 'chainl': { let from = f, hitSet = new Set(); for (let k=0;k<5;k++){ const cand = B.fs.filter(o=>o.alive && o.side!==f.side && !hitSet.has(o)); if (!cand.length) break; const t = nearestOf(from, cand); if (k && Math.hypot(t.x-from.x,t.y-from.y)>110) break; zapFx(from, t, '#d8c4ff'); hit(f, t, 1.2, false); hitSet.add(t); from = t; } break; }
    case 'vampire': { const before = near.hp; hit(f, near, 2, false); const dealt = Math.max(0, before - Math.max(0, near.hp)); applyHeal(f, f, dealt); zapFx(near, f, '#ff6b81'); break; }
    case 'aegis': for (const o of B.fs) if (o.alive && o.side===f.side && Math.hypot(o.x-f.x,o.y-f.y)<90) o.absorb = Math.max(o.absorb||0, f.maxHp*0.25); break;
    case 'starfire': { const c = bestCluster(f, 34); B.meteors.push({x:c.x, y:c.y, t:0, dur:0.55, r:34, mult:2.5, src:f, stun:0, big:false}); break; }
    case 'hours': { let n = 0; for (const o of foes) if (Math.hypot(o.x-f.x,o.y-f.y)<110){ o.stun = Math.max(o.stun||0, 1.5); n++; } if (!n) return false; B.rings.push({x:f.x, y:f.y, t:0, col:'#c8f0ff', r:110}); hitStop(0.06); break; }
    default: return false;
  }
  f.casts++; B.casts++; castText(f, id); sfx('shoot');
  return true;
}
function castUlt(f){
  const id = f.ult, foes = foesOf(f), allies = B.fs.filter(o=>o.side===f.side);
  switch (id){
    case 'rally': for (const o of allies) if (o.alive){ applyHeal(f, o, o.maxHp*0.25); o.buffT = 5; o.buffM = Math.max(o.buffM||1, 1.3); } break;
    case 'whirl': if (!foes.length) return false; f.whirlT = 3; f.whirlTick = 0; break;
    case 'inferno': { if (!foes.length) return false; const c = bestCluster(f, 70); B.rings.push({x:c.x, y:c.y, t:0, col:'#ff9f43', r:80}); for (const o of foes) if (Math.hypot(o.x-c.x,o.y-c.y)<80){ hit(f, o, 2.2, false); o.burn = {src:f, dps:f.atk*0.35, t:4}; } break; }
    case 'titan': f.titanT = 6; f.hp = f.maxHp; f.ghost = f.hp; break;
    case 'avalanche': if (!foes.length) return false; for (const o of foes){ o.stun = Math.max(o.stun||0, 2.5); sparks(o.x, o.y-8, '#d6f1ff', 5, 0.8); } B.rings.push({x:W/2, y:H/2, t:0, col:'#d6f1ff', r:260}); break;
    case 'meteor': { if (!foes.length) return false; const c = bestCluster(f, 60); B.meteors.push({x:c.x, y:c.y, t:0, dur:0.9, r:60, mult:4.5, src:f, stun:1.5, big:true}); break; }
    case 'phoenixu': { const dead = allies.filter(o=>!o.alive); if (!dead.length) return false; for (const o of dead){ o.alive = true; o.hp = o.maxHp*0.4; o.ghost = o.hp; o.deathT = null; o.flash = 1; sparks(o.x, o.y-8, '#ffb347', 14, 1.2); } addLog(`${f.name} raised ${plural(dead.length,'fallen ally','fallen allies')}!`, 'k'); break; }
    case 'judgement': { if (!foes.length) return false; const top = foes.slice().sort((a,b)=>b.maxHp*b.atk - a.maxHp*a.atk).slice(0,4); for (const o of top){ B.zaps.push({x1:o.x, y1:-10, x2:o.x, y2:o.y-6, life:0.4, col:'#fff3b0'}); hit(f, o, 3.2, false); } break; }
    default: return false;
  }
  f.ultCast = true; B.ults++; castText(f, id);
  B.ultBanner = {text:`${(f.unit ? f.unit.name : f.name).toUpperCase()} · ${RINGS[id].short}`, col:RARCOL[RINGS[id].rarity], t:0, side:f.side};
  if (!f.side) addLog(`${f.name} unleashed ${RINGS[id].short.toLowerCase()}!`, 'k'); else addLog(`${f.name} unleashed ${RINGS[id].short.toLowerCase()}`, 'd');
  hitStop(0.14); punch(f.x, f.y, 0.08); B.shake = Math.min(5, B.shake+3); sfx('horn');
  return true;
}

function animateGold(from, to){

    const rng = mulberry32(state.seed + state.battle*577);
    const keys = Object.keys(EVENTS).filter(k=>!state.recentEvents.includes(k));
    const id = pick(rng, keys.length?keys:Object.keys(EVENTS));
    state.recentEvents = [id, ...state.recentEvents].slice(0,4);
    state.node.event = id; state.node.ctx = EVENTS[id].setup ? EVENTS[id].setup(rng) : {};

  else if (r.type==='market') state.node.stock = rollMarket();

    const cands = enemies.filter(f=>f.alive && !f.nem && f.cls!=='warlord' && f.victims.length>0).sort((a,c)=>c.victims.length-a.victims.length);
    if (cands.length){ const nm = makeNemesis(cands[0], slainIds, rng); state.nemeses.push(nm); sprinkleNemesis(nm.uid);
      cards.push({kind:'nem', title:'A nemesis is born', text:`${nm.full}, a level ${nm.level} ${CLASSES[nm.cls].foe}, struck down ${nm.victims.join(', ')}. They will hunt you.`, cls:nm.cls, foe:true}); }
  }
  const alive = rows.filter(r=>r.status!=='slain').map(r=>state.roster.find(u=>u.id===r.id)).filter(Boolean);
  for (let i=0;i<alive.length;i++) for (let j=i+1;j<alive.length;j++){
    const a = alive[i], c = alive[j], key = a.id<c.id ? `${a.id}-${c.id}` : `${c.id}-${a.id}`;
    state.pairs[key] = (state.pairs[key]||0)+1;
    if (state.pairs[key]>=3 && !a.bond && !c.bond){ a.bond = c.id; c.bond = a.id; chron(a, `Bonded with ${c.name}`); chron(c, `Bonded with ${a.name}`);
      cards.push({kind:'bond', title:`${a.name} and ${c.name} are bonded`, text:'+8% HP and attack when both march. If one falls, the other fights in a fury.', cls:a.cls}); }
  }
  for (const u of slain){
    for (const k of Object.keys(state.pairs)) if (k.split('-').map(Number).includes(u.id)) delete state.pairs[k];
    if (u.bond){ const p = state.roster.find(x=>x.id===u.bond); if (p){ p.bond = null; if (!p.perks.includes('oathbound')) p.perks.push('oathbound'); chron(p, `Swore an oath over ${u.name}'s grave`);
      cards.push({kind:'oath', title:`${p.name} swears an oath`, text:`Grieving ${u.name}, ${p.name} becomes Oathbound: +20% attack, and more against nemeses.`, cls:p.cls}); } }
  }
  if (win){
    const rc = boss ? 0.6 : elite ? 0.4 : 0.08;
    if (rng() < rc){ const rid = rollRing(rng, boss?[0,0.4,0.4]:elite?[0.2,0.5,0.25]:[0.6,0.3,0.08]); state.rings.push(rid); cards.push({kind:'loot', title:`Found: ${RINGS[rid].name}`, text:`${RINGS[rid].desc} Equip it from a soldier's card.`, ring:rid}); }
    const chance = (boss||elite) ? 1 : 0.3*(hasBoon('quartermaster')?2:1);
    if (rng() < chance){ const id = rollItem(rng, boss?[0,0.6,0.4]:elite?[0.35,0.5,0.15]:[0.65,0.3,0.05]); gainItem(id); cards.push({kind:'loot', title:`Found: ${ITEMS[id].name}`, text:`${ITEMS[id].desc} Equip it from a soldier's card.`, item:id}); }
  }
  const drilled = [];
  state.roster.forEach(u=>{
    if (fought.has(u.id)) return;
    if (u.wounded>0){ u.wounded--; return; }
    if (u.benched){ const g = grantXP(u, hasBoon('drillmaster')?18:6); drilled.push({name:fullName(u), ups:g.ups}); }
  });
  let moraleDelta = 0;
  if (!win){ state.morale--; moraleDelta = -1; }
  else if (boss && state.morale < state.maxMorale){ state.morale++; moraleDelta = 1; }
  if (win && boss) state.boonOffer = rollBoonOffer();
  state.history[b] = {t:type, r: win?'W':'L'};
  const prevB = state.battle;
  if (win || !boss) state.battle++;
  const unlockedNow = state.battle>prevB ? RECRUITABLE.filter(c=>CLASSES[c].unlock===state.battle) : [];
  unlockedNow.forEach(c=>cards.push({kind:'unlock', title:`${CLASSES[c].plural} join the recruiting tent`, text:CLASSES[c].role, cls:c}));
  state.gold += gold; state.fights++;
  if (!state.mythicSeen && state.fights>=3){ const m = makeMythic(); const sig = PERKS[m.perks[0]];
    cards.push({kind:'mythic', title:'A mythic hero arrives at the tent', text:`${fullName(m)}, a level ${m.level} ${CLASSES[m.cls].label}. ${sig.desc} Hire them for ${m.cost} gold.`, cls:m.cls, pa:pAttrs(m.perks)}); }
  if (win){ state.wins++; state.lossStreak = 0; } else { state.losses++; state.lossStreak++; }
  if (state.morale<=0) state.ended = {won:false, reason:'morale'};
  else if (win && boss && b===FINAL && !state.endless) state.ended = {won:true};
  quest('spells10', B.casts); if (B.fs.some(f=>!f.side && f.ultCast)) quest('ult1');
  if (win) quest('win2'); if (win && elite) quest('elite1'); if (win && boss) quest('siege1'); if (nemSlain) quest('nemesis1');
  quest('kills25', totalKills); quest('levels3', rows.reduce((a,r)=>a+r.ups,0));
  addRenown(win ? (boss ? 8 : 2) : 0);
  const flawless = win && allies.every(f=>f.alive);
  state.results = {win, gold, enemy:B.enemy.name, secs:Math.round(B.t), rows, battle:b, boss, elite, drilled, retry: boss && !win, newMarch: boss && win, cards, moraleDelta};
  state.rolls = 0; rollShop(); state.ringRolls = 0; rollRingShop();
  if (!state.ended){ if (win || !boss) setNextNode(); else { state.node = {type:'boss'}; state.enemy = makeEnemy('boss'); } }
  state.screen = 'results'; B = null; save(); checkAch({flawless, siege: win && boss, ult: allies.some(f=>f.ultCast)}); if (meta.arena.joined) postArena(false); render();
}

function animateResults(){
  const r = state.results, goldEl = document.getElementById('gold');
  const needChoice = () => pendingUnits().length || state.boonOffer;
  if (reduced){
    r.rows.forEach((x,i)=>{ const row = app.querySelector(`[data-row="${i}"]`); if(!row) return; row.querySelector('.xp i').style.width=x.toPct+'%'; row.querySelector('.lv').textContent='Lv '+x.level; row.querySelector('.tags').classList.add('show'); });
    goldEl.textContent = r.gold; if (needChoice()) later(afterChoice, 300); return;
  }
  const t0 = performance.now(); const tick = now => { const k=Math.min(1,(now-t0)/700); goldEl.textContent = Math.round(r.gold*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(tick); };
  later(()=>{ sfx('coin'); requestAnimationFrame(tick); coinFly(document.getElementById('rh1'), document.getElementById('goldpill'), Math.min(12, 4 + Math.round(r.gold/25))); }, 200);
  if (r.win) later(()=>confetti(r.boss?140:80, innerWidth/2, innerHeight*0.18), 120);
  let end = 0;
  r.rows.forEach((x,i)=>{
    const row = app.querySelector(`[data-row="${i}"]`); if(!row) return;
    const bar = row.querySelector('.xp i'), lv = row.querySelector('.lv'), tags = row.querySelector('.tags');
    let t = 350 + i*160;
    for (let k=0;k<x.ups;k++){
      later(()=>{ bar.style.transition='width .42s cubic-bezier(.2,.8,.2,1)'; bar.style.width='100%'; }, t); t += 440;
      later(()=>{ bar.style.transition='none'; bar.style.width='0%'; lv.textContent='Lv '+(x.fromLvl+k+1); lv.classList.remove('pop'); void lv.offsetWidth; lv.classList.add('pop'); sfx('level'); const rc = row.getBoundingClientRect(); confetti(16, rc.left+40, rc.top+20); }, t); t += 60;
    }
    later(()=>{ bar.style.transition='width .5s cubic-bezier(.2,.8,.2,1)'; bar.style.width=x.toPct+'%'; tags.classList.add('show'); }, t);
    end = Math.max(end, t+500);
  });
  if (needChoice()) later(afterChoice, end + 450);
}

/* ---------- end of campaign ---------- */
const bestPerk = perks => (perks||[]).filter(p=>PERKS[p] && !PERKS[p].special).sort((a,b)=>RANK[PERKS[b].rarity]-RANK[PERKS[a].rarity])[0] || null;
function legendCands(){
  const live = state.roster.map(u=>({name:fullName(u), cls:u.cls, level:u.level, kills:u.kills, perk:bestPerk(u.perks), fallen:false}));
  const dead = state.fallen.map(f=>({name:f.name, cls:f.cls, level:f.level, kills:f.kills, perk:bestPerk(f.perks), fallen:true}));
  return [...live, ...dead].sort((a,b)=>(b.kills+b.level*2)-(a.kills+a.level*2)).slice(0,3);
}

/* ---------- dates, renown ---------- */
function dateKey(off=0){ const d = new Date(Date.now() + off*86400000); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function hashStr(s){ let h = 2166136261; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h>>>0; }
function renownLevel(){ let l = 1, r = meta.renown||0; while (r >= 80*l){ r -= 80*l; l++; } return {lvl:l, into:r, need:80*l}; }
function unlocksAt(l){ return [...TEAM_COLORS.filter(c=>c.lvl===l).map(c=>c.name+' colours'), ...EMBLEMS.filter(e=>e.lvl===l).map(e=>e.name+' emblem')]; }
function addRenown(n){
  if (!n) return; const before = renownLevel().lvl; meta.renown = (meta.renown||0) + n; saveMeta();
  const after = renownLevel().lvl;
  if (after > before){ const un = []; for (let l=before+1;l<=after;l++) un.push(...unlocksAt(l)); toast(`Renown level ${after}!${un.length?` Unlocked: ${un.join(', ')}.`:''}`, 'ach'); }
}

const QUESTS = {
  win2:{text:'Win 2 battles', target:2, gold:60, ren:15},
  kills25:{text:'Fell 25 foes', target:25, gold:60, ren:15},
  levels3:{text:'Level up soldiers 3 times', target:3, gold:50, ren:15},
  elite1:{text:'Defeat an elite warband', target:1, gold:80, ren:20},
  rareTrait:{text:'Learn an epic or legendary trait', target:1, gold:60, ren:20},
  hire2:{text:'Hire 2 recruits', target:2, gold:40, ren:10},
  arena1:{text:'Fight a bout in the Arena', target:1, gold:50, ren:15},
  nemesis1:{text:'Slay a nemesis', target:1, gold:120, ren:30},
  roads2:{text:'Visit 2 crossroads or markets', target:2, gold:40, ren:10},
  siege1:{text:'Win a siege', target:1, gold:100, ren:25},
  spells10:{text:'Cast 10 spells in battle', target:10, gold:50, ren:15},
  ult1:{text:'Unleash an ultimate', target:1, gold:70, ren:20},
};
function ensureDaily(){
  const d = dateKey();
  if (!meta.daily || meta.daily.date !== d){ const rng = mulberry32(hashStr(d)); meta.daily = {date:d, quests: shuffle(rng, Object.keys(QUESTS)).slice(0,3).map(id=>({id, prog:0, claimed:false}))}; saveMeta(); }
  return meta.daily;
}
function quest(type, n=1){
  if (!n) return; const dly = ensureDaily(); let done = false;
  for (const q of dly.quests){ const Q = QUESTS[q.id]; if (q.id===type && !q.claimed && q.prog < Q.target){ q.prog = Math.min(Q.target, q.prog+n); if (q.prog >= Q.target) done = true; } }
  saveMeta(); if (done) toast(`Daily quest complete: ${QUESTS[type].text}. Claim it in Daily.`, 'ach');
}
const questsReady = () => ensureDaily().quests.filter(q=>!q.claimed && q.prog >= QUESTS[q.id].target).length;
const chestReady = () => meta.chest.last !== dateKey();
const dailyDot = () => chestReady() || questsReady() > 0;
function claimQuest(i){
  const q = ensureDaily().quests[i]; if (!q || q.claimed || q.prog < QUESTS[q.id].target) return;
  const Q = QUESTS[q.id]; q.claimed = true; state.gold += Q.gold; saveMeta(); save(); sfx('coin'); addRenown(Q.ren);
  toast(`Quest reward: ${Q.gold} gold and ${Q.ren} renown.`, 'ach'); confetti(40, innerWidth/2, innerHeight*0.4);
}
function claimChest(){
  if (!chestReady()) return;
  meta.chest.streak = meta.chest.last === dateKey(-1) ? (meta.chest.streak % 7) + 1 : 1; meta.chest.last = dateKey();
  const day = meta.chest.streak, gold = 40 + day*15; let extra = '';
  state.gold += gold;
  if (day===7){ const id = rollItem(mulberry32(hashStr(dateKey())), [0,0.6,0.4]); gainItem(id); extra = ` and a ${ITEMS[id].name}`; addRenown(25); }
  else addRenown(5);
  saveMeta(); save(); sfx('win'); confetti(70, innerWidth/2, innerHeight*0.35);
  toast(`Day ${day} war chest: ${gold} gold${extra}.`, 'ach'); checkAch();
}
function dailySheetHTML(){
  const dly = ensureDaily(), day = chestReady() ? (meta.chest.last === dateKey(-1) ? (meta.chest.streak % 7) + 1 : 1) : meta.chest.streak;
  return `${closeBtn}
  <div class="pickhead"><div style="flex:none">${bannerSVG(teamHex(), state.banner.emblem, 52)}</div><div><div class="eyebrow">Daily</div><h2>War chest and orders</h2><p>New orders arrive every midnight. Claim the war chest each day to grow your streak.</p></div></div>
  <div class="sh-sec"><h3>War chest · day ${day} of 7</h3>
    <div class="days">${Array.from({length:7},(_,i)=>`<span class="${i < (chestReady()?day-1:day) ? 'got' : i===day-1 && chestReady() ? 'now' : ''}"><b class="num">${i+1}</b><i class="num">${i===6?'Gear':(40+(i+1)*15)+'g'}</i></span>`).join('')}</div>
    <button class="btn wide ${chestReady()?'pulse':''}" data-act="claimchest" ${chestReady()?'':'disabled'}>${chestReady()?`Open today's chest`:'Come back tomorrow'}</button></div>
  <div class="sh-sec"><h3>Daily orders</h3>${dly.quests.map((q,i)=>{ const Q = QUESTS[q.id], done = q.prog >= Q.target;
    return `<div class="qrow ${q.claimed?'claimed':''}"><div><b>${esc(Q.text)}</b><div class="xprow"><div class="xp"><i style="width:${Math.round(100*q.prog/Q.target)}%"></i></div><span class="xpn num">${q.prog}/${Q.target}</span></div><span class="muted num">${Q.gold} gold · ${Q.ren} renown</span></div>
      <button class="btn small" data-act="claimquest" data-i="${i}" ${done&&!q.claimed?'':'disabled'}>${q.claimed?'Claimed':done?'Claim':'In progress'}</button></div>`; }).join('')}</div>`;

function unlockAch(id){ if (!ACH[id] || meta.ach[id]) return; meta.ach[id] = Date.now(); saveMeta(); sfx('level'); toast(`Feat unlocked: ${ACH[id].name}. +${ACH[id].ren} renown`, 'ach'); addRenown(ACH[id].ren); }
function checkAch(ctx={}){
  if (!state) return;
  if (state.wins>0) unlockAch('first_win');
  if (state.gold>=500) unlockAch('rich');
  if (state.roster.some(u=>u.level>=10)) unlockAch('lvl10');
  if (state.roster.some(u=>u.bond)) unlockAch('bond');
  if (state.roster.some(u=>u.perks.some(p=>PERKS[p] && PERKS[p].rarity==='legendary'))) unlockAch('legend');
  if (state.stats.nemSlain>0) unlockAch('revenge');
  if (meta.crowns>0) unlockAch('crown');
  if (RECRUITABLE.every(c=>meta.codex.cls[c])) unlockAch('roll');
  if (meta.arena.wins>=5) unlockAch('arena5');
  if (meta.chest.streak>=7) unlockAch('streak7');
  if (state.roster.some(u=>unitRings(u).some(r=>RINGS[r].rarity==='legendary'))) unlockAch('ringlord');

const fxc = document.createElement('canvas'); fxc.className = 'fxc'; document.body.appendChild(fxc);

        const g = ctx.createRadialGradient(x-2,y-2,1,x,y,7); g.addColorStop(0,'#ffe39a'); g.addColorStop(0.6,'#f6b93b'); g.addColorStop(1,'#b47d14'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x,y,6.5,0,Math.PI*2); ctx.fill();

  applyDrop(d.id, t);
}
function applyDrop(id, t){
  const u = state.roster.find(x=>x.id===id); if (!u || !t){ drawBoard(0); return; }
  if (t.bench){ if (u.benched) return drawBoard(0); u.benched = true; toast(`${u.name} moves to the bench.`); }
  else {
    if (u.wounded){ toast(`${u.name} is wounded and sits out the next battle.`); return drawBoard(0); }
    if (u.benched){
      if (deployed().length >= maxMarch()){
        let near = null, bd = 1e9; for (const h of boardHits){ const d = Math.hypot(h.x-t.x, h.y-t.y); if (d < h.r*1.8 && d < bd){ bd = d; near = h; } }
        const nu = near && state.roster.find(x=>x.id===near.id);
        if (!nu){ toast(`The warband is full. Drop ${u.name} onto a marching soldier to swap them out.`); return drawBoard(0); }
        nu.benched = true; u.row = nu.row; u.ord = nu.ord ?? ordKey(nu); u.benched = false;
        toast(`${u.name} swaps in for ${nu.name}.`); save(); sfx('tap'); return renderCamp(false);
      }
      u.benched = false;
    }
    u.row = t.row; u.ord = t.ord;
  }
  save(); sfx('tap'); renderCamp(false);
}
document.addEventListener('pointerdown', e => {
  if (!state || state.screen!=='camp' || drag || (e.button && e.button!==0)) return;
  if (e.target.id==='board'){
    const p = boardPoint(e); let best = null, bd = 1e9;
    for (const h of boardHits){ const d = Math.hypot(h.x-p.x, h.y-p.y); if (d<h.r && d<bd){ bd = d; best = h; } }
    press = {id: best ? best.id : null, board:true, sx:e.clientX, sy:e.clientY};
    return;
  }
  const tl = e.target.closest && e.target.closest('.tile'); if (!tl) return;
  press = {id:+tl.dataset.id, board:false, sx:e.clientX, sy:e.clientY, touch: e.pointerType!=='mouse'};
  if (press.touch){ const pr = press; pr.timer = setTimeout(()=>{ if (press===pr && !drag) startDrag(pr.id, {clientX:pr.lx ?? pr.sx, clientY:pr.ly ?? pr.sy}); }, 280); }
});
document.addEventListener('pointermove', e => {
  if (drag){ e.preventDefault(); moveDrag(e); return; }
  if (!press) return;
  press.lx = e.clientX; press.ly = e.clientY;
  const d = Math.hypot(e.clientX-press.sx, e.clientY-press.sy);
  if (press.board){ if (press.id!=null && d>6) startDrag(press.id, e); return; }
  if (press.touch){ if (d>10){ clearTimeout(press.timer); press = null; } return; }
  if (d>6) startDrag(press.id, e);
}, {passive:false});
document.addEventListener('pointerup', e => {
  if (press && press.timer) clearTimeout(press.timer);
  if (drag){ endDrag(e, false); press = null; return; }
  if (press && press.board && press.id!=null){ const id = press.id; press = null; openSoldier(id); return; }
  press = null;
});
document.addEventListener('pointercancel', e => { if (press && press.timer) clearTimeout(press.timer); press = null; if (drag) endDrag(e, true); });
document.addEventListener('touchmove', e => { if (drag) e.preventDefault(); }, {passive:false});
document.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('.tile, #board')) e.preventDefault(); });

document.addEventListener('pointerdown', () => { if (!state || !state.sound) return; const a = audio(); if (!a) return; if (a.state==='suspended') a.resume().then(musicFor).catch(()=>{}); else if (!MUS.timer) musicFor(); }, true);
let rsz = 0;
window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(()=>{ if (state.screen==='battle' && B) sizeField(); else if (state.screen==='camp') drawBoard(0); else if (state.screen==='title') startTitleLoop(); if (coachCur) coachPlace(); }, 120); });

state = load();
if (!state) newCampaign();
state.screen = 'title';
if (state.node && (state.node.type==='skirmish'||state.node.type==='elite'||state.node.type==='boss') && !state.enemy) state.enemy = makeEnemy(state.node.type, state.node.nem);
if (!state.node && !state.roads.length && !state.ended) setNextNode();
shownGold = state.gold;
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ if (state.screen==='camp'){ const c = document.getElementById('board'); if (c) c._w = 0; drawBoard(0); } });
})();
</script>
