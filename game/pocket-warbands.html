<title>Pocket Warbands</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column. Campaign map + scouting on top, formations + roster, recruiting tent; a sticky march bar at the bottom. Battle and results take over the column; trait picks slide up as a sheet. Single committed dusk-tabletop look. */
:root{
  --bg:#12303a; --bg-2:#0d2630; --panel:#1b4351; --panel-2:#22525f; --ink:#f7efdf; --muted:#9dbabe; --line:rgba(247,239,223,.12);
  --gold:#f6b93b; --gold-deep:#b47d14; --gold-ink:#3a2500;
  --ally:#5bb6ff; --foe:#ef6a52; --ok:#7ad69e; --warn:#f2a65a;
  --common:#a9c0c4; --rare:#6fd6a8; --epic:#c89cff;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
html,body{background:var(--bg);}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(120% 60% at 50% -10%, #1d4a57 0%, var(--bg) 60%) fixed, var(--bg);}
.wrap{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:14px 48px;display:flex;flex-direction:column;gap:22px;}
.wrap.has-bar{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px));}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:.01em;text-wrap:balance;}
button{font:inherit;color:inherit;cursor:pointer;}
button:focus-visible,.unit:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.num{font-variant-numeric:tabular-nums;}

@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes glow{0%,100%{box-shadow:0 4px 0 var(--gold-deep),0 0 0 0 rgba(246,185,59,.0)}50%{box-shadow:0 4px 0 var(--gold-deep),0 0 0 6px rgba(246,185,59,.25)}}
.enter > *{animation:rise .38s var(--ease) both;}
.enter > *:nth-child(2){animation-delay:.04s} .enter > *:nth-child(3){animation-delay:.08s} .enter > *:nth-child(4){animation-delay:.12s} .enter > *:nth-child(5){animation-delay:.16s} .enter > *:nth-child(n+6){animation-delay:.2s}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.brand{font-family:var(--display);font-size:26px;line-height:1;}
.brand small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:5px;}
.pills{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-weight:600;font-size:14px;}
.pill.bump{animation:pop .4s var(--ease);}
.coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe39a,var(--gold) 55%,var(--gold-deep));box-shadow:0 0 0 1.5px #7a520a inset;flex:none;}

.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;}
.next{background:linear-gradient(160deg,#3a2a2a 0%,#2a2226 100%);border:1px solid rgba(239,106,82,.35);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;}
.next.boss{border-color:rgba(246,185,59,.55);background:linear-gradient(160deg,#41301f 0%,#2a2226 100%);}
.next h2{font-size:26px;line-height:1.05;}
.next .meta{color:#e8c9c0;font-size:14px;}
.efs{display:flex;flex-wrap:wrap;gap:5px;}
.efs span{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:2px 7px;background:rgba(239,106,82,.16);color:#ffb7a8;}
.scout{margin:0;font-size:13px;color:#f1dcc0;display:flex;gap:8px;align-items:flex-start;}
.scout::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-top:7px;}
.map{display:flex;align-items:center;}
.map .node{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:rgba(0,0,0,.25);border:2px solid rgba(247,239,223,.18);color:var(--muted);flex:none;}
.map .node.done.w{background:var(--ally);border-color:var(--ally);color:#0b2233;}
.map .node.done.l{background:#5a3a36;border-color:var(--foe);color:#ffd2c9;}
.map .node.cur{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 4px rgba(246,185,59,.18);}
.map .node.boss{width:38px;height:38px;border-radius:10px;}
.map .node.boss svg{width:22px;height:22px;}
.map .link{flex:1;height:3px;background:rgba(247,239,223,.15);min-width:8px;}
.map .link.done{background:var(--ally);}
.strip{display:flex;flex-wrap:wrap;gap:4px;}
.mini{position:relative;width:38px;height:38px;border-radius:10px;background:rgba(0,0,0,.22);}
.mini.big{width:46px;height:46px;background:rgba(246,185,59,.15);}
.mini canvas{width:100%;height:100%;display:block;}
.mini b{position:absolute;right:-3px;bottom:-3px;min-width:16px;height:16px;border-radius:8px;background:var(--bg-2);border:1px solid var(--line);font-size:10px;display:grid;place-items:center;padding:0 3px;}
.hint{font-size:13px;color:var(--muted);margin:0;}

.btn{font-family:var(--display);font-size:20px;letter-spacing:.02em;background:var(--gold);color:var(--gold-ink);border:0;border-radius:14px;padding:12px 18px;box-shadow:0 4px 0 var(--gold-deep);transition:transform .08s, box-shadow .08s, background .2s;}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-deep);}
.btn:disabled{background:#5c6f73;color:#c9d4d5;box-shadow:0 4px 0 #3f4f53;cursor:not-allowed;}
.btn.wide{width:100%;}
.btn.pulse{animation:glow 1.4s ease-in-out infinite;}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none;font-size:16px;padding:9px 14px;}
.btn.small{font-size:15px;padding:8px 12px;border-radius:11px;box-shadow:0 3px 0 var(--gold-deep);}

.bar-fixed{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top, rgba(13,38,48,.98) 70%, rgba(13,38,48,0));}
.bar-in{max-width:488px;margin:0 auto;display:flex;align-items:center;gap:12px;}
.bar-in .info{flex:1;min-width:0;font-size:13px;color:var(--muted);line-height:1.3;}
.bar-in .info b{display:block;color:var(--ink);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-in .btn{flex:none;min-width:132px;}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;}
.sec-h h2{font-size:22px;}
.sec-h span{color:var(--muted);font-size:13px;text-align:right;}
.list{display:flex;flex-direction:column;gap:10px;}

.forms{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-bottom:14px;}
.form{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:rgba(0,0,0,.14);min-width:0;}
.form.on{border-color:rgba(246,185,59,.5);background:linear-gradient(160deg,rgba(246,185,59,.12),rgba(0,0,0,.1));}
.form .fh{display:flex;align-items:center;gap:8px;}
.form b{font-size:14px;flex:1;min-width:0;}
.form.on b{color:var(--gold);}
.pips{display:inline-flex;gap:3px;}
.pips i{width:7px;height:7px;border-radius:50%;background:rgba(247,239,223,.18);}
.pips i.on{background:var(--gold);}
.form .cnt{font-size:11px;color:var(--muted);}
.form p{margin:3px 0 0;font-size:12px;color:var(--muted);line-height:1.35;}
.form.on p{color:var(--ink);}

.unit{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;transition:opacity .25s, transform .15s, border-color .2s;}
.unit[data-act="card"]{cursor:pointer;}
.unit[data-act="card"]:active{transform:scale(.99);}
.unit.off{opacity:.55;}
.unit.open{border-color:rgba(246,185,59,.4);}
.port{width:56px;height:56px;border-radius:12px;background:radial-gradient(circle at 50% 70%,#2c6170,#173a46);display:block;}
.uname{font-weight:700;font-size:16px;line-height:1.2;}
.uname em{font-style:normal;color:var(--gold);}
.usub{color:var(--muted);font-size:13px;margin-top:2px;}
.lv{display:inline-block;}
.lv.pop{animation:pop .45s var(--ease);color:var(--gold);}
.xprow{display:flex;align-items:center;gap:8px;margin-top:8px;}
.xp{flex:1;height:6px;background:var(--bg-2);border-radius:3px;overflow:hidden;}
.xp i{display:block;height:100%;background:linear-gradient(90deg,#8fd0ff,var(--ally));border-radius:3px;transition:width .6s var(--ease);}
.xpn{font-size:11px;color:var(--muted);white-space:nowrap;}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.chip{border:1px solid currentColor;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;line-height:1.5;}
.chip.common{color:var(--common);} .chip.rare{color:var(--rare);} .chip.epic{color:var(--epic);}
.combo{margin-top:6px;font-size:12px;font-weight:700;color:var(--gold);}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease);grid-column:1/-1;}
.more > div{overflow:hidden;}
.unit.open .more{grid-template-rows:1fr;}
.more ul{list-style:none;margin:2px 0 0;padding:10px 0 0;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:6px;font-size:13px;}
.more li b{font-weight:700;} .more li span{color:var(--muted);}
.more .r-common{color:var(--common);} .more .r-rare{color:var(--rare);} .more .r-epic{color:var(--epic);} .more .r-role{color:var(--ally);}
.tog{border:1.5px solid var(--line);background:var(--bg-2);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;transition:border-color .2s,color .2s;}
.tog.on{border-color:var(--ally);color:var(--ally);}
.tog:disabled{color:var(--warn);border-color:rgba(242,166,90,.4);cursor:default;}

.shop .unit{background:#1a3a44;}
.shop-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;color:var(--muted);font-size:13px;}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px;}
.badge.rare{background:rgba(111,214,168,.18);color:var(--rare);}
.badge.new{background:rgba(246,185,59,.18);color:var(--gold);}
.hired{color:var(--muted);font-size:13px;font-weight:600;align-self:center;}

.fallen{color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:4px;}
.fallen div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:4px;}
.foot{display:flex;justify-content:center;}

/* battle */
.bhud{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;}
.side{display:flex;flex-direction:column;gap:4px;min-width:0;}
.side.r{text-align:right;}
.side .nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar{height:8px;background:var(--bg-2);border-radius:4px;overflow:hidden;display:flex;}
.bar i{display:block;height:100%;transition:width .25s linear;}
.side.l .bar i{background:var(--ally);} .side.r .bar{justify-content:flex-end;} .side.r .bar i{background:var(--foe);}
.vs{font-family:var(--display);font-size:22px;color:var(--muted);}
.field{border-radius:16px;overflow:hidden;border:3px solid #2a5a3a;background:#4b8440;box-shadow:0 10px 30px rgba(0,0,0,.35);}
.field canvas{display:block;width:100%;height:auto;}
.ctrl{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;}
.speeds{display:flex;gap:6px;}
.speeds button{border:1.5px solid var(--line);background:var(--bg-2);border-radius:10px;padding:7px 12px;font-weight:700;transition:border-color .2s,color .2s;}
.speeds button.on{border-color:var(--gold);color:var(--gold);}
.log{display:flex;flex-direction:column;gap:4px;font-size:13px;min-height:96px;}
.log div{color:var(--muted);animation:rise .3s var(--ease) both;}
.log div.a{color:var(--ink);} .log div.k{color:var(--gold);} .log div.d{color:#f3a596;}

/* results */
.banner{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;}
.banner h1{font-size:54px;line-height:.95;}
.banner.win h1{color:var(--gold);text-shadow:0 4px 0 var(--gold-deep);}
.banner.loss h1{color:var(--foe);text-shadow:0 4px 0 #8a2e20;}
.banner p{margin:0;color:var(--muted);max-width:34ch;}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;opacity:0;transform:translateY(4px);transition:opacity .3s, transform .3s var(--ease);}
.tags.show{opacity:1;transform:none;}
.tag{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:2px 7px;background:var(--bg-2);}
.tag.up{background:var(--gold);color:var(--gold-ink);}
.tag.mvp{background:rgba(200,156,255,.2);color:var(--epic);}
.tag.cu{color:var(--ally);} .tag.h{color:var(--ok);}
.tag.w{color:var(--warn);} .tag.s{color:var(--foe);} .tag.k{color:var(--ink);}
.gain{font-weight:700;color:var(--ally);white-space:nowrap;}
.unlock{border:1px solid rgba(246,185,59,.45);border-radius:14px;padding:12px 14px;background:rgba(246,185,59,.08);display:flex;gap:12px;align-items:center;}
.unlock canvas{width:48px;height:48px;flex:none;}
.unlock b{color:var(--gold);}
.unlock p{margin:2px 0 0;font-size:13px;color:var(--muted);}

/* sheet */
.scrim{position:fixed;inset:0;z-index:8;background:rgba(5,15,20,0);transition:background .25s;display:flex;align-items:flex-end;justify-content:center;}
.scrim.open{background:rgba(5,15,20,.6);}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;border-top:1px solid var(--line);padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .32s var(--ease);display:flex;flex-direction:column;gap:14px;}
.scrim.open .sheet{transform:none;}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center;}
.pickhead{display:flex;align-items:center;gap:14px;}
.pickhead canvas{width:72px;height:72px;border-radius:18px;background:radial-gradient(circle at 50% 70%,#2c6170,#173a46);flex:none;}
.pickhead h2{font-size:24px;line-height:1.1;}
.pickhead p{margin:4px 0 0;color:var(--muted);font-size:13px;}
.cards{display:flex;flex-direction:column;gap:10px;}
.cards.swap{animation:rise .3s var(--ease) both;}
.card{text-align:left;border-radius:16px;padding:13px 15px;background:var(--panel);border:2px solid var(--line);display:flex;flex-direction:column;gap:3px;transition:transform .12s var(--ease), border-color .2s;}
.card:active{transform:scale(.97);}
.card.common{border-color:rgba(169,192,196,.45);} .card.rare{border-color:var(--rare);background:linear-gradient(160deg,#1c4a48,var(--panel));} .card.epic{border-color:var(--epic);background:linear-gradient(160deg,#352a52,var(--panel));}
.card .rr{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
.card.common .rr{color:var(--common);} .card.rare .rr{color:var(--rare);} .card.epic .rr{color:var(--epic);}
.card h3{font-size:21px;}
.card p{margin:0;font-size:14px;}
.card .delta{color:var(--ally);font-size:13px;font-weight:600;}
.card .ep{color:var(--muted);font-size:13px;}
.queue{font-size:12px;color:var(--muted);text-align:center;}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:#0a1d24;border:1px solid var(--line);color:var(--ink);padding:10px 14px;border-radius:12px;font-size:14px;max-width:min(440px,calc(100% - 32px));box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:10;transition:opacity .25s, transform .3s var(--ease);}
.toast.show{opacity:1;transform:translate(-50%,0);}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important;}}
</style>

<div id="app" class="wrap"></div>
<div id="bar" class="bar-fixed" hidden></div>
<div id="sheet" class="scrim" hidden><div class="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" role="status"></div>

<script>
(() => {
const app = document.getElementById('app'), barEl = document.getElementById('bar'), sheetEl = document.getElementById('sheet');
const W = 400, H = 280, STEP = 1/30;
const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const pick = (r, arr) => arr[Math.floor(r()*arr.length)];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plural = (n, a, b) => `${n} ${n===1?a:b}`;

/* ---------- classes ---------- */
const CLASSES = {
  footman: {label:'Footman', plural:'Footmen', foe:'Raider', foePl:'Raiders', hp:62, atk:9, range:16, cd:0.9, speed:36, cost:40, tags:['infantry'], unlock:1,
            role:'Steady front-line fighter. Cheap and reliable.'},
  archer:  {label:'Archer', plural:'Archers', foe:'Bowman', foePl:'Bowmen', hp:38, atk:8, range:130, cd:1.25, speed:30, cost:45, tags:['ranged'], proj:'arrow', unlock:1,
            role:'Shoots from the back line.'},
  shield:  {label:'Shieldbearer', plural:'Shieldbearers', foe:'Brute', foePl:'Brutes', hp:115, atk:5.5, range:16, cd:1.15, speed:26, cost:55, armor:0.15, tags:['infantry','armored'], unlock:1,
            role:'Soaks damage at the front. Takes 15% less damage.'},
  spear:   {label:'Spearman', plural:'Spearmen', foe:'Pikeman', foePl:'Pikemen', hp:58, atk:8, range:26, cd:1.0, speed:32, cost:45, tags:['infantry'], vs:{cavalry:2.5}, unlock:1,
            role:'Long reach. Braced pikes deal 2.5x damage to cavalry.'},
  cleric:  {label:'Cleric', plural:'Clerics', foe:'Zealot', foePl:'Zealots', hp:44, atk:4, heal:11, range:80, cd:1.4, speed:30, cost:55, tags:['support'], proj:'holy', unlock:1,
            role:'Heals the most wounded ally. Throws weak holy light when no one needs mending.'},
  knight:  {label:'Knight', plural:'Knights', foe:'Outrider', foePl:'Outriders', hp:95, atk:11, range:18, cd:1.1, speed:62, cost:70, armor:0.1, tags:['cavalry','armored'], charge:2, prefer:'backline', rad:9, unlock:2,
            role:'Fast rider that hunts archers and casters. A hit after a long gallop is a charge for 2x damage.'},
  crossbow:{label:'Crossbowman', plural:'Crossbowmen', foe:'Arbalist', foePl:'Arbalists', hp:44, atk:16, range:115, cd:2.1, speed:26, cost:55, tags:['ranged'], pierce:0.7, proj:'bolt', unlock:3,
            role:'Slow, heavy bolts that ignore 70% of armor.'},
  rogue:   {label:'Rogue', plural:'Rogues', foe:'Cutthroat', foePl:'Cutthroats', hp:40, atk:10, range:14, cd:0.7, speed:48, cost:55, dodge:0.15, crit:0.2, tags:['infantry'], prefer:'weakest', unlock:4,
            role:'Slips past the front to stab the weakest foe. Dodges 15% of attacks, crits often.'},
  mage:    {label:'Hedge Mage', plural:'Hedge Mages', foe:'Hexer', foePl:'Hexers', hp:34, atk:10, range:120, cd:1.8, speed:26, cost:65, splash:0.6, tags:['ranged'], proj:'orb', unlock:6,
            role:'Hurls fire that splashes 60% damage onto every foe near the target.'},
  bard:    {label:'Drummer', plural:'Drummers', foe:'Warpiper', foePl:'Warpipers', hp:42, atk:4, range:60, cd:1.2, speed:30, cost:50, aura:0.18, tags:['support'], proj:'note', unlock:6,
            role:'Allies within earshot attack 18% faster. Several drummers stack.'},
  warlord: {label:'Warlord', plural:'Warlords', foe:'Warlord', foePl:'Warlords', hp:200, atk:11, range:20, cd:1.3, speed:24, cost:0, armor:0.2, cleave:0.5, rad:10, tags:['infantry','armored'], unlock:999,

    trample:0, aura:c.aura||0, auraR:70, auraAtk:0, healMult:1, mending:0, sainted:false, backstab:0, shadowstep:false};

function epithet(u){ let best=null; for (const id of u.perks){ const p=PERKS[id]; if(!best || RANK[p.rarity]>=RANK[best.rarity]) best=p; } return best?best.ep:''; }
function fullName(u){ const e=epithet(u); return e ? `${u.name} ${e}` : u.name; }
function skinOf(id){ return SKINS[Math.abs(id*7)%SKINS.length]; }
const perkFits = (p, cls) => (!p.cls || p.cls.includes(cls)) && !(p.nocls && p.nocls.includes(cls));

function rollPerks(u, rng, n=3){
  const avail = Object.keys(PERKS).filter(id => { const p=PERKS[id]; return perkFits(p, u.cls) && (p.stack || !u.perks.includes(id)); });
  const out = [];
  while (out.length<n && avail.length){
    const r = rng(), epicW = Math.min(0.3, 0.06+0.03*u.level);
    const rar = r<epicW ? 'epic' : r<epicW+0.32 ? 'rare' : 'common';
    let pool = avail.filter(id => PERKS[id].rarity===rar); if(!pool.length) pool = avail;
    const classPool = pool.filter(id => PERKS[id].cls); if (classPool.length && rng()<0.45) pool = classPool;
    const id = pick(rng, pool); out.push(id); avail.splice(avail.indexOf(id),1);
  }
  return out;
}

/* ---------- state ---------- */
const KEY = 'pocket-warbands-v1';
let state = null;
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.v===2) return s;
    if (s && s.v===1){ Object.assign(s, {v:2, fights:s.battle-1, lossStreak:0, history:{}, speed:1, enemy:null, results:null, screen:'camp'}); s.roster.forEach(u=>{u.offer=null;}); return s; }
  }catch(e){}
  return null;
}
function makeUnit(cls, name, extra={}){
  return Object.assign({id:state.nextId++, name, cls, level:1, xp:0, perks:[], kills:0, battles:0, wounded:0, benched:false, pending:0, offer:null}, extra);
}
function usedNames(){ return new Set([...state.roster.map(u=>u.name), ...(state.shop||[]).filter(Boolean).map(o=>o.name)]); }
function freshName(rng){ const used=usedNames(); const free=NAMES.filter(n=>!used.has(n)); return free.length ? pick(rng,free) : pick(rng,NAMES)+' '+(2+Math.floor(rng()*8)); }
const avgLevel = list => list.length ? list.reduce((a,u)=>a+u.level,0)/list.length : 1;

function newCampaign(){
  state = {v:2, gold:90, battle:1, fights:0, wins:0, losses:0, lossStreak:0, history:{}, speed:1, seed:(Math.random()*1e9)|0, nextId:1, rolls:0, roster:[], fallen:[], shop:[], enemy:null, results:null, screen:'camp'};
  state.roster.push(makeUnit('footman','Bram'));
  state.roster.push(makeUnit('archer','Odile',{level:2, xp:9, perks:['steady'], kills:3, battles:2}));
  state.roster.push(makeUnit('shield','Hugo',{battles:1, kills:1, xp:10}));
  state.roster.push(makeUnit('spear','Wren'));
  rollShop(); state.enemy = makeEnemy(); save();
}
function rollShop(){
  const rng = mulberry32(state.seed + state.battle*101 + state.fights*13 + state.rolls*977);
  const floor = Math.max(1, Math.floor(avgLevel(state.roster)*0.65));
  const pool = unlocked(state.battle), fresh = pool.filter(c=>CLASSES[c].unlock===state.battle && state.battle>1);
  state.shop = [];
  for (let i=0;i<3;i++){
    const cls = (i===0 && fresh.length) ? pick(rng, fresh) : pick(rng, pool);
    const rare = rng() < 0.22;
    const o = {cls, name:freshName(rng), level:floor + (rare?1:0), perks:[], rare};
    for (let l=2;l<=o.level;l++){ const p = rollPerks({cls, level:l, perks:o.perks}, rng, 1)[0]; if(p) o.perks.push(p); }
    o.cost = CLASSES[cls].cost + 18*(o.level-1) + (rare?20:0);
    state.shop.push(o);
  }
}
function makeEnemy(){
  const rng = mulberry32((state.seed ^ (state.battle*2654435761) ^ (state.fights*40503)) >>> 0);
  const b = state.battle, boss = isBoss(b), pool = unlocked(b);
  const top = state.roster.slice().sort((x,y)=>y.level-x.level).slice(0,8);
  const curve = 1 + (b-1)*0.28;
  let target = Math.max(1, 0.65*curve + 0.35*avgLevel(top) - 0.6*Math.min(2, state.lossStreak));
  const n = clamp(3 + Math.floor((b-1)*0.6) - (boss?1:0) - (state.lossStreak>=2?1:0), 3, 9);
  const reg = region(b);
  const options = WARBANDS.filter(w => w.fav.some(c=>pool.includes(c)));
  const band = boss ? {name:`${reg.lord}'s Garrison`, fav:['shield','crossbow','spear','cleric']} : pick(rng, options);
  const fav = band.fav.filter(c=>pool.includes(c));
  const mk = (cls, lvl) => { const e = {cls, level:Math.max(1,lvl), perks:[]}; for (let l=2;l<=e.level;l++){ const p = rollPerks({cls, level:l, perks:e.perks}, rng, 1)[0]; if(p) e.perks.push(p); } return e; };
  const units = [];
  if (boss) units.push(mk('warlord', Math.max(1, Math.round(target))));
  let support = 0;
  for (let i=0;i<n;i++){
    let cls = (fav.length && rng()<0.55) ? pick(rng, fav) : pick(rng, pool);
    if ((cls==='cleric'||cls==='bard') && support>=2) cls = pick(rng, ['footman','spear','archer'].filter(c=>pool.includes(c)));
    if (cls==='cleric'||cls==='bard') support++;
    units.push(mk(cls, Math.round(target + (rng()-0.5)*1.2)));
  }
  return {name: band.name, boss, units};
}
const deployed = () => state.roster.filter(u=>!u.benched && !u.wounded).slice(0,8);

function scoutAdvice(e){
  const c = {}; e.units.forEach(u=>c[u.cls]=(c[u.cls]||0)+1);
  const ranged = (c.archer||0)+(c.crossbow||0)+(c.mage||0), armored = (c.shield||0)+(c.knight||0)+(c.warlord||0);
  const tips = [];
  if ((c.knight||0)>=1) tips.push('Their riders will dive your back line. Spearmen brace against cavalry.');
  if (armored>=3) tips.push('Heavy armor ahead. Crossbow bolts punch through it.');
  if (ranged>=3) tips.push('Lots of shooters. Knights and Rogues reach a back line fast.');
  if ((c.cleric||0)>=1) tips.push('Their Zealots heal. Rogues go for the weakest and finish them.');
  if ((c.mage||0)>=1) tips.push('Hexer fire splashes. Sturdy front liners and Clerics soak it best.');
  if ((c.rogue||0)>=2) tips.push('Cutthroats will hunt your weakest. Keep fragile units few, or heal them.');
  if (c.warlord) tips.push('The Warlord cleaves anyone crowded around it. Ranged damage stays clear.');
  return tips.slice(0,2);
}

function shade(hex, f){ const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255; return `rgb(${clamp(Math.round(r*f),0,255)},${clamp(Math.round(g*f),0,255)},${clamp(Math.round(b*f),0,255)})`; }
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function ln(ctx,a,b,c,d){ ctx.beginPath(); ctx.moveTo(a,b); ctx.lineTo(c,d); ctx.stroke(); }
const OUT = '#2a241e';

function drawKnight(ctx, o, color){
  const gal = o.moving ? o.walk*1.6 : 0, bob = o.moving ? Math.sin(gal)*1.4 : 0, lg = o.moving ? Math.sin(gal)*3.2 : 0;
  ctx.strokeStyle='#4a3020'; ctx.lineWidth=2.4; ctx.lineCap='round';
  ln(ctx,-7,4,-7-lg,11); ln(ctx,-4,4,-4+lg,11); ln(ctx,5,4,5+lg,11); ln(ctx,8,4,8-lg,11);
  ctx.strokeStyle='#5a3a24'; ctx.lineWidth=2; ln(ctx,-10,0+bob,-14,5+bob);
  ctx.beginPath(); ctx.ellipse(0,1+bob,10.5,5.2,0,0,Math.PI*2); ctx.fillStyle='#9a6a43'; ctx.fill(); ctx.lineWidth=1.3; ctx.strokeStyle=OUT; ctx.stroke();
  ctx.fillStyle=color; ctx.fillRect(-6,-2+bob,9,6);
  ctx.beginPath(); ctx.moveTo(6,-2+bob); ctx.lineTo(10,-10+bob); ctx.lineTo(15,-8+bob); ctx.lineTo(14,-5+bob); ctx.lineTo(10,-4+bob); ctx.lineTo(9,2+bob); ctx.closePath(); ctx.fillStyle='#9a6a43'; ctx.fill(); ctx.stroke();
  ctx.fillStyle=OUT; ctx.beginPath(); ctx.arc(12.4,-8+bob,0.8,0,Math.PI*2); ctx.fill();
  const rb = bob - 6;
  rr(ctx,-4.5,-9+rb,9,9,3); ctx.fillStyle=color; ctx.fill(); ctx.lineWidth=1.3; ctx.stroke();
  ctx.beginPath(); ctx.arc(0,-13.5+rb,4.6,0,Math.PI*2); ctx.fillStyle='#c4cad3'; ctx.fill(); ctx.stroke();
  ctx.fillStyle=OUT; ctx.fillRect(0.5,-14.2+rb,4,1.1);
  ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(-1,-18+rb); ctx.quadraticCurveTo(-7,-21+rb,-8,-15+rb); ctx.quadraticCurveTo(-4,-18+rb,-1,-17+rb); ctx.fill();
  const thrust = Math.sin((o.swing||0)*Math.PI)*4;
  ctx.strokeStyle='#7a5532'; ctx.lineWidth=2; ln(ctx,-2+thrust,-6+rb,20+thrust,-11+rb);
  ctx.fillStyle='#e7ecf2'; ctx.beginPath(); ctx.moveTo(23+thrust,-11.7+rb); ctx.lineTo(19+thrust,-12.8+rb); ctx.lineTo(19.5+thrust,-9.4+rb); ctx.fill();
}
function drawUnit(ctx, o){
  const color = o.color, dark = shade(color, 0.55);

  for (let i=B.texts.length-1;i>=0;i--){ const t=B.texts[i]; t.life -= dt*Math.min(spd,2); t.age += dt; t.y -= dt*14; if (t.life<=0) B.texts.splice(i,1); }

function deltaLine(u, id){

    const u = makeUnit(o.cls, o.name, {level:o.level, perks:[...o.perks]});
    u.benched = deployed().length >= 8;
    state.roster.push(u); state.shop[i] = null; save(); toast(`${fullName(u)} joined the warband${u.benched?' (benched, warband is full)':''}.`); return renderCamp(false);
  }
  if (act==='reroll'){ if(state.gold<10) return; state.gold-=10; state.rolls++; rollShop(); save(); return renderCamp(false); }
  if (act==='march') return startBattle();
  if (act==='speed'){ state.speed = +b.dataset.s; save(); document.querySelectorAll('[data-act=speed]').forEach(x=>x.classList.toggle('on', +x.dataset.s===state.speed)); return; }
  if (act==='skip') return skip();
  if (act==='picks') return openPicks();
  if (act==='camp'){ state.screen='camp'; save(); return render(); }
  if (act==='choose') return choose(b.dataset.perk);
  if (act==='reset'){ if(!resetArmed){ resetArmed=true; return renderCamp(false); } resetArmed=false; openCards.clear(); shownGold=null; newCampaign(); return render(); }
  if (act==='newgame'){ openCards.clear(); shownGold=null; newCampaign(); return render(); }
}
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; onAct(b); });
document.addEventListener('keydown', e => { if ((e.key==='Enter'||e.key===' ') && e.target.matches('.unit[data-act="card"]')){ e.preventDefault(); onAct(e.target); } });
sheetEl.addEventListener('click', e => { if (e.target===sheetEl) closeSheet(); });
window.addEventListener('resize', () => { if (state.screen==='battle' && B) sizeField(); });

state = load();
if (!state) newCampaign();
if (!state.enemy) state.enemy = makeEnemy();
if (state.screen==='battle') state.screen = 'camp';
shownGold = state.gold;
render();
})();
</script>
