const bossOfMarch = m => BOSS_ORDER[(m-1) % BOSS_ORDER.length];
function bossAbilText(k){ return BOSSES[k].abil.map(a=>`${a[0]}: ${a[1]}`).join(' '); }

function applyBoss(f, k){
  const D = BOSSES[k]; f.bossK = k; f.name = D.name;
  f.maxHp *= D.hp; f.atk *= D.atk; f.armor = Math.max(f.armor, D.armor); f.speed *= D.speed; f.rad = D.rad; f.cd *= D.cd;
  if (D.range){ f.range = D.range; f.ranged = true; f.proj = D.proj; f.cleave = 0; }
  if (D.cleave) f.cleave = D.cleave;
  if (D.regen) f.regen = (f.regen||0) + D.regen;
  if (D.thorns) f.thorns = Math.max(f.thorns||0, D.thorns);
  f.bt = {a:4.5, b:3.5, heads:3, grown:false, summons:0, lunge:0, slam:0};
  f.tags = f.tags.filter(t=>t!=='infantry').concat(['boss']);
}
function summonSkeleton(f){
  const s = fighter({cls:'footman', level:Math.max(1, f.level-2), perks:[]}, f.side, B.rng, null);
  s.name = 'Husk Drone'; s.summon = true; s.undead = true; s.maxHp *= 0.7; s.hp = s.maxHp; s.ghost = s.maxHp; s.skin = '#e6e1d3';
  const a = B.rng()*Math.PI*2; s.x = clamp(f.x + Math.cos(a)*30 - 18, 12, 366); s.y = clamp(f.y + Math.sin(a)*34, 22, 266); s.px = s.x; s.py = s.y; s.facing = -1; s.cdLeft = 0.8;
  B.fs.push(s); B.maxE += s.maxHp; puff(s.x, s.y+4); sparks(s.x, s.y, '#a98cff', 8, 0.8);
  return s;
}
function bossStep(f, dt){
  const D = BOSSES[f.bossK], st = f.bt, foes = foesOf(f); if (!foes.length) return;
  st.a -= dt; st.b -= dt; st.lunge = Math.max(0, st.lunge - dt*3); st.slam = Math.max(0, st.slam - dt*2.5);
  const announce = (txt) => { addText(f.x, f.y-56, txt, D.col, 11); };
  switch (f.bossK){
    case 'troll':
      if (st.a <= 0){ const near = foes.filter(o=>Math.hypot(o.x-f.x,o.y-f.y) < 62); if (near.length){ st.a = 7; st.slam = 1; announce('GROUND SLAM'); B.rings.push({x:f.x, y:f.y+10, t:0, col:'#c9a96a', r:70}); for (const o of near){ hit(f, o, 1.4, false); if (o.alive) o.stun = Math.max(o.stun||0, 1); } B.shake = Math.min(6, B.shake+4); hitStop(0.08); punch(f.x, f.y, 0.07); sfx('die'); } else st.a = 0.6; }
      break;
    case 'hydra':
      if (!st.grown && f.hp < f.maxHp*0.5){ st.grown = true; st.heads = 4; f.atkSpd *= 1.4; announce('REGROWTH'); sparks(f.x, f.y-20, '#9fe0a0', 18, 1.3); addLog(`${D.name} grew another head`, 'd'); }
      if (st.a <= 0){ st.a = 6; st.lunge = 1; announce('ACID VOLLEY'); const tg = foes.slice().sort(()=>B.rng()-0.5).slice(0,3);
        for (const o of tg) launch(f, o, 'venom', ()=>{ hit(f, o, 0.9, false); if (o.alive) o.burn = {src:f, dps:f.atk*0.3, t:3, col:'#8fe36b'}; sparks(o.x, o.y-6, '#8fe36b', 8, 1); }); sfx('shoot'); }
      break;
    case 'golem':
      if (st.a <= 0){ st.a = 8; st.slam = 1; announce('CORE VENT'); const used = [];
        for (let i=0;i<3;i++){ const pool = foes.filter(o=>!used.some(u=>Math.hypot(u.x-o.x,u.y-o.y)<40)); if (!pool.length) break; const c = pool.reduce((b,o)=>{ const n = foes.filter(q=>Math.hypot(q.x-o.x,q.y-o.y)<30).length; return n>b.n?{o,n}:b; }, {o:pool[0], n:-1}).o; used.push(c); B.meteors.push({x:c.x, y:c.y, t:0, dur:0.7+i*0.15, r:30, mult:1.5, src:f, stun:0, big:false, lava:true}); }
        B.shake = Math.min(5, B.shake+2); }
      break;
    case 'kraken':
      if (st.a <= 0){ const far = foes.reduce((a,o)=>Math.hypot(o.x-f.x,o.y-f.y) > Math.hypot(a.x-f.x,a.y-f.y) ? o : a); const d = Math.hypot(far.x-f.x, far.y-f.y);
        if (d > 50){ st.a = 6; st.lunge = 1; announce('TENTACLE GRAB'); B.zaps.push({x1:f.x, y1:f.y, x2:far.x, y2:far.y-6, life:0.35, col:'#d77aa5'}); puff(far.x, far.y); far.x = clamp(f.x + (f.side ? -1 : 1)*(f.rad + far.rad + 2), 12, 366); far.y = clamp(f.y + (B.rng()-0.5)*20, 22, 266); far.px = far.x; far.py = far.y; far.stun = Math.max(far.stun||0, 1.2); hit(f, far, 0.8, false); B.shake = Math.min(5, B.shake+2); } else st.a = 1; }
      break;
    case 'lich':
      if (st.a <= 0){ st.a = 9; const alive = B.fs.filter(o=>o.alive && o.summon && o.side===f.side).length; if (alive < 4){ announce('REBUILD'); summonSkeleton(f); summonSkeleton(f); st.summons += 2; if (st.summons===2) addLog(`${D.name} rebuilt the fallen`, 'd'); } }
      if (st.b <= 0){ st.b = 7; const w = foes.reduce((a,o)=>o.hp<a.hp?o:a); const before = w.hp; zapFx(w, f, '#a98cff'); hit(f, w, 2.2, false); applyHeal(f, f, Math.max(0, before - Math.max(0, w.hp))); announce('SOUL DRAIN'); }
      break;
  }
}

/* drawing: local coords, origin at body centre, feet near +14 */
function drawBoss(ctx, o){
  const k = o.k, t = o.time || 0, a = o.alpha ?? 1, s = o.s, sw = o.swing || 0, fl = o.flash || 0, st = o.st || {};
  ctx.save(); ctx.translate(o.x, o.y); ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(0, 15*s, 24*s, 6*s, 0, 0, Math.PI*2); ctx.fill();
  if (o.deadT != null){ const d = Math.min(1, o.deadT*2); ctx.translate(0, d*6*s); ctx.rotate(-o.facing*0.5*d); }
  ctx.scale(s*o.facing, s); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 1.6; ctx.strokeStyle = OUT;
  const moving = o.moving, bob = moving ? Math.sin(o.walk||0)*1.4 : Math.sin(t*2)*0.6;
  const blob = (x,y,rx,ry,col,rot=0) => { ctx.beginPath(); ctx.ellipse(x,y,rx,ry,rot,0,Math.PI*2); ctx.fillStyle=col; ctx.fill(); ctx.stroke(); };
  if (k==='troll'){
    const step = moving ? Math.sin(o.walk||0)*3 : 0, slam = st.slam||0;
    ctx.fillStyle = '#4a4f5a'; rr(ctx,-11+step,2,7,13,2); ctx.fill(); ctx.stroke(); rr(ctx,4-step,2,7,13,2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#2b2f38'; ctx.fillRect(-12+step,12,9,3); ctx.fillRect(3-step,12,9,3);

const CMDS = {

const CMD_ORDER = ['fireball','mend','frost'];
const CMD_IC = {
  fireball:'<svg viewBox="0 0 24 24"><path d="M12 2.5c1.2 4.2 6 5.6 6 11a6 6 0 0 1-12 0c0-2.6 1.3-4 2.6-5.2.1 2.4 1.3 3.7 2.6 3.7 0-3.6-1.4-5.8.8-9.5z" fill="currentColor"/></svg>',
  mend:'<svg viewBox="0 0 24 24"><path d="M9.5 3h5v6.5H21v5h-6.5V21h-5v-6.5H3v-5h6.5z" fill="currentColor"/></svg>',
  frost:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7M9 3.5l3 2.5 3-2.5M9 20.5l3-2.5 3 2.5"/></svg>',
};
const CMDR = {side:0, facing:1, x:20, y:140, healed:0, kills:0, name:'Your commander', alive:false};
let lastCmds = 0;
const cmdUnlocked = id => !!B && (B.arena || state.battle >= CMDS[id].unlock);
function cmdPower(){ const al = B.fs.filter(f=>!f.side && f.alive); return al.length ? al.reduce((a,f)=>a+f.atk,0)/al.length : 10; }
function cmdStep(dt){
  for (const k in B.cmd) B.cmd[k] = Math.max(0, B.cmd[k]-dt);
  if (B.autoCmd) for (const id of CMD_ORDER) if (B.cmd[id]<=0 && cmdUnlocked(id) && !B.cmdQ.some(q=>q.id===id)){ if (id==='mend' && hpFrac(0)>0.55) continue; const c = bestCluster(CMDR, 46); if (c) B.cmdQ.push({id, x:c.x, y:c.y}); }
  while (B.cmdQ.length){ const c = B.cmdQ.shift(); castCmd(c.id, c.x, c.y); }
}
function useCmd(id){
  if (!B || B.over || B.skipping || !CMDS[id] || !cmdUnlocked(id)) return;
  if (B.cmd[id] > 0){ return; }
  if (CMDS[id].aim){ B.aim = B.aim===id ? null : id; sfx('tap'); updateCmdBar(true); return; }
  B.cmdQ.push({id, x:110, y:140}); B.aim = null; updateCmdBar(true);
}
function aimAt(clientX, clientY){
  const c = document.getElementById('field'); if (!c || !B || !B.aim) return false;
  const r = c.getBoundingClientRect(), x = clamp((clientX - r.left)/r.width*W, 10, W-10), y = clamp((clientY - r.top)/r.height*H, 20, H-10);
  B.cmdQ.push({id:B.aim, x, y}); B.aim = null; updateCmdBar(true); return true;
}
function castCmd(id, x, y){
  if (!cmdUnlocked(id) || B.cmd[id] > 0 || B.over) return;
  B.cmd[id] = CMDS[id].cd; B.cmds++;
  const pw = cmdPower();
  if (id==='fireball'){
    B.ps.push({src:CMDR, tgt:{x, y}, kind:'fire', arc:46, sx:26, sy:40, t:0, dur:0.5, mult:0, onHit:()=>{
      B.rings.push({x, y:y+4, t:0, col:'#ff9f43', r:50});
      for (const o of B.fs) if (o.alive && o.side===1 && Math.hypot(o.x-x, o.y-y) < 46){ const amt = pw*2.4*(o.bossK?0.5:1)*(1-o.armor*0.5); addText(o.x, o.y-22, Math.round(amt), '#ffb347', 11); damage(CMDR, o, amt); if (o.alive) o.burn = {src:CMDR, dps:pw*0.25, t:3}; }
      sparks(x, y, '#ff9f43', 26, 1.8); sparks(x, y, '#ffe08a', 12, 1.2); puff(x, y); B.shake = Math.min(6, B.shake+4); hitStop(0.06); punch(x, y, 0.06); sfx('die');
    }});
    sfx('shoot');
  } else if (id==='mend'){
    for (const o of B.fs) if (o.alive && o.side===0) applyHeal(CMDR, o, o.maxHp*0.22);
    B.rings.push({x:100, y:140, t:0, col:'#7ad69e', r:190}); sfx('level');
  } else if (id==='frost'){
    B.rings.push({x, y, t:0, col:'#d6f1ff', r:70});
    for (const o of B.fs) if (o.alive && o.side===1 && Math.hypot(o.x-x, o.y-y) < 56){ o.stun = Math.max(o.stun||0, 2); sparks(o.x, o.y-8, '#d6f1ff', 6, 0.8); }
    B.shake = Math.min(5, B.shake+2); sfx('hit');
  }
  addText(x, y-34, CMDS[id].name.toUpperCase(), CMDS[id].col, 11);
  addLog(`You cast ${CMDS[id].name}`, 'a');
}
function cmdBarHTML(){
  return `<div class="cmdbar">${CMD_ORDER.map(id=>{ const C = CMDS[id], ok = B.arena || state.battle >= C.unlock;
    return `<button class="cmdb" data-act="cmd" data-id="${id}" id="cmd-${id}" style="--cc:${C.col}" ${ok?'':'disabled'} aria-label="${esc(C.name)}. ${esc(C.desc)}"><span class="cmi">${CMD_IC[id]}<i class="cmcd"></i></span><b>${ok?esc(C.name):`Jump ${C.unlock}`}</b></button>`; }).join('')}</div>
    ${state.fights<2 && !B.arena ? '<p class="cmdhint" id="cmdhint">Tap Fireball, then tap the battlefield to aim.</p>' : '<p class="cmdhint" id="cmdhint"></p>'}`;
}
let cmdKey = '';
function updateCmdBar(force){
  if (!B || !B.cmd) return;
  let key = B.aim || '';
  for (const id of CMD_ORDER){ const v = B.cmd[id]; key += id + (v>0 ? Math.ceil(v*10) : 'r'); }
  if (!force && key===cmdKey) return; cmdKey = key;
  for (const id of CMD_ORDER){
    const el = document.getElementById('cmd-'+id); if (!el || el.disabled) continue;
    const v = B.cmd[id], ready = v<=0 && !B.over;
    el.style.setProperty('--p', ready ? 0 : (v/CMDS[id].cd));
    el.classList.toggle('ready', ready); el.classList.toggle('aiming', B.aim===id);
  }
  const h = document.getElementById('cmdhint'); if (h && B.aim) h.textContent = `Tap the battlefield to cast ${CMDS[B.aim].name}. Tap the button again to cancel.`; else if (h) h.textContent = state.fights<2 && !B.arena ? 'Tap Fireball, then tap the battlefield to aim.' : '';
  const c = document.getElementById('field'); if (c) c.classList.toggle('aim', !!B.aim);
}
function drawAim(ctx){

  ctx.font = '13px "Russo One", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.55)';

    case 'lablegend': { const u = state.roster[Math.floor(Math.random()*state.roster.length)]; if (!u) return; const id = rollPerkOfRarity(u, Math.random, 'legendary'); if (id){ u.perks.push(id); discover([u], true); checkAch(); } save(); toast2(`${u.name} learned ${id ? PERKS[id].name : 'nothing new'}.`); return openSheet(labSheetHTML(), 'lab'); }
    case 'labstash': state.rings.push(...Object.keys(RINGS)); state.stash.push(...Object.keys(ITEMS)); save(); toast2('Every ring and piece of gear is in your stash.'); return openSheet(labSheetHTML(), 'lab');

    case 'labheal': state.roster.forEach(u=>u.wounded=0); state.morale = state.maxMorale; save(); toast2('Everyone is patched up and morale is full.'); return openSheet(labSheetHTML(), 'lab');
    case 'lablevel': labRaise(+b.dataset.v); save(); toast2(`Army raised to level ${b.dataset.v}. Promotions are waiting in camp.`); return openSheet(labSheetHTML(), 'lab');
    case 'labboss': { const m = +b.dataset.v; state.ended = null; state.battle = 5*m; state.map = null; setNextNode(); const M = state.map; M.visited = M.nodes.filter(n=>n.r<=4).map(n=>n.id); state.screen = 'camp'; save(); closeSheet(); render(); return toast2(`Sector ${m} assault ready. Deploy when you are.`); }
    case 'labsector': { const m = +b.dataset.v; state.ended = null; state.battle = (m-1)*5+1; state.map = null; state.node = null; state.enemy = null; setNextNode(); state.screen = 'camp'; save(); closeSheet(); render(); return toast2(`Welcome to sector ${m}.`); }
    case 'labwave': { const n = +b.dataset.v; closeSheet(); setTimeout(()=>{ openSheet(opHeroSheet(), 'ophero'); labOpts.startWave = n; }, 60); return; }

    case 'labbosses': openSheet(labGalleryHTML('bosses'), 'gallery'); return setTimeout(startLab, 30);

}

/* ---------- march map ---------- */
function genMap(m){
  const rng = mulberry32((state.seed + m*7777) >>> 0), counts = [m===1 ? 1 : 2, 3, 3, 2, 1], nodes = [];
  for (let r=0;r<5;r++){ const n = counts[r]; for (let c=0;c<n;c++) nodes.push({id:nodes.length, r, c, n, x: n===1 ? 0.5 : 0.2 + c*(0.6/(n-1)) + (rng()-0.5)*0.07, jy:(rng()-0.5)*0.05, type:'skirmish', nem:null, next:[]}); }
  const row = r => nodes.filter(nd=>nd.r===r);
  for (const nd of nodes){
    if (nd.r===4) nd.type = 'boss';
    else if (m===1 && nd.r===0) nd.type = 'skirmish';
    else nd.type = wpick(rng, nd.r===0 ? [['skirmish',3],['elite',1.4],['event',1.6]] : [['skirmish',3],['elite',2],['event',2],['market', nd.r>=2 ? 1.6 : 0.6]]);
  }
  for (let r=0;r<4;r++){ const rw = row(r); if (!rw.some(nd=>nd.type==='skirmish'||nd.type==='elite')) rw[Math.floor(rng()*rw.length)].type = 'skirmish'; }
  let mk = 0; for (const nd of nodes) if (nd.type==='market' && ++mk>1) nd.type = 'event';
  for (let r=0;r<4;r++){
    const a = row(r), b = row(r+1);
    for (const nd of a){
      const rel = a.length===1 ? 0.5 : nd.c/(a.length-1), t = Math.round(rel*(b.length-1));
      nd.next.push(b[t].id);
      if (b.length>1 && rng()<0.6){ const alt = clamp(t + (rng()<0.5 ? -1 : 1), 0, b.length-1); if (!nd.next.includes(b[alt].id)) nd.next.push(b[alt].id); }
    }
    for (const nb of b) if (!a.some(nd=>nd.next.includes(nb.id))){ const rel = b.length===1 ? 0.5 : nb.c/(b.length-1); a[Math.round(rel*(a.length-1))].next.push(nb.id); }
  }
  for (const nd of nodes) if ((nd.type==='skirmish'||nd.type==='elite') && state.nemeses.length && rng() < (nd.type==='elite' ? 0.6 : 0.3)) nd.nem = pick(rng, state.nemeses).uid;
  const deco = Array.from({length:26}, () => ({x:rng(), y:rng(), k:rng()<0.6?'tree':'hill', s:0.7+rng()*0.6}));
  return {march:m, nodes, cur:null, visited:[], sel:null, anim:null, deco, river: rng()*0.6+0.2};
}
function ensureMap(){ const m = marchOf(state.battle); if (!state.map || state.map.march !== m) state.map = genMap(m); return state.map; }
function mapAvail(){
  const M = ensureMap(); if (state.node) return [];
  const r = stopOf(state.battle) - 1, cur = M.cur != null ? M.nodes[M.cur] : null;
  if (cur && cur.r === r-1) return cur.next.map(id=>M.nodes[id]);
  return M.nodes.filter(nd=>nd.r===r);
}
function markVisit(nd){ const M = state.map; M.cur = nd.id; if (!M.visited.includes(nd.id)) M.visited.push(nd.id); }
function sprinkleNemesis(uid){
  const M = state.map; if (!M) return; const r = stopOf(state.battle) - 1;
  const fut = M.nodes.filter(nd=>nd.r>=r && nd.r<4 && !nd.nem && (nd.type==='skirmish'||nd.type==='elite') && !M.visited.includes(nd.id));

}
let mapHits = [], mapLayout = null;
function mapPos(nd, w, h){ const pad = 34, top = 30; return {x: nd.x*w, y: h - pad - (nd.r + nd.jy*0) * ((h - pad - top)/4) + nd.jy*40}; }

function drawMap(t=0){
  const c = document.getElementById('mapcv'); if (!c) return;
  const M = ensureMap(), w = c.clientWidth || 360, h = Math.round(clamp(w*1.08, 360, 460));
  if (c._w !== w || !c._ctx){ c.style.height = h+'px'; c._ctx = setupCanvas(c, w, h); c._w = w; }
  const ctx = c._ctx;
  drawMapBg(ctx, M, w, h, t);
  const P = M.nodes.map(nd=>mapPos(nd, w, h)), avail = mapAvail(), availIds = new Set(avail.map(n=>n.id)), vis = new Set(M.visited);
  for (const nd of M.nodes) for (const nid of nd.next){
    const a = P[nd.id], b = P[nid], walked = vis.has(nd.id) && vis.has(nid), open = M.cur===nd.id && availIds.has(nid);
    ctx.save();
    if (walked){ ctx.strokeStyle = teamHex(); ctx.lineWidth = 4; ctx.setLineDash([]); }
    else if (open){ ctx.strokeStyle = '#ffc23d'; ctx.lineWidth = 3; ctx.setLineDash([7,6]); ctx.lineDashOffset = -t*24; }
    else { ctx.strokeStyle = 'rgba(150,175,230,.35)'; ctx.lineWidth = 1.6; ctx.setLineDash([3,6]); }
    const mx = (a.x+b.x)/2 + (b.y-a.y)*0.06, my = (a.y+b.y)/2;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.quadraticCurveTo(mx,my,b.x,b.y); ctx.stroke(); ctx.restore();
  }
  if (M.cur==null && avail.length){ const sx = w/2, sy = h-10; for (const nd of avail){ const b = P[nd.id]; ctx.save(); ctx.strokeStyle = '#ffc23d'; ctx.lineWidth = 3; ctx.setLineDash([7,6]); ctx.lineDashOffset = -t*24; ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(b.x,b.y); ctx.stroke(); ctx.restore(); } }
  mapHits = [];
  for (const nd of M.nodes){
    const p = P[nd.id], boss = nd.type==='boss', r = boss ? 25 : 18, isAv = availIds.has(nd.id), isVis = vis.has(nd.id), sel = M.sel===nd.id;
    const dim = !isAv && !isVis && !(boss);

    if (isAv){ const pul = 0.5+0.5*Math.sin(t*4 + nd.id); ctx.fillStyle = `rgba(255,194,61,${0.18+0.22*pul})`; ctx.beginPath(); ctx.arc(p.x,p.y,r+7+pul*3,0,Math.PI*2); ctx.fill(); }
    ctx.fillStyle = isVis ? '#1a2142' : '#141b3a'; ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2); ctx.fill();
    ctx.lineWidth = sel ? 3.5 : isAv ? 2.5 : 1.5; ctx.strokeStyle = sel ? '#ffc23d' : isAv ? '#ffc23d' : boss ? 'rgba(255,210,122,.7)' : 'rgba(150,175,230,.5)'; ctx.stroke();
    mapIcon(ctx, nd.type, p.x, p.y, r, isVis ? 'rgba(214,226,255,.35)' : MAPCOL[nd.type]);
    if (nd.nem && !isVis){ ctx.fillStyle = '#ef6a52'; ctx.beginPath(); ctx.arc(p.x+r*0.75, p.y-r*0.75, 7, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle = '#5a1f16'; ctx.lineWidth = 1.5; ctx.stroke(); mapIcon(ctx, 'elite', p.x+r*0.75, p.y-r*0.75, 6.5, '#fff'); }
    if (isVis && !boss){ ctx.strokeStyle = 'rgba(127,243,255,.6)'; ctx.lineWidth = 2.5; ln(ctx, p.x+r*0.45, p.y+r*0.45, p.x+r*0.85, p.y+r*0.85); }
    ctx.restore();
    mapHits.push({id:nd.id, x:p.x, y:p.y, r:r+10});
  }
  const reg = region(state.battle); ctx.fillStyle = '#ffd27a'; ctx.font = '13px "Russo One", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const bossP = P[M.nodes.find(n=>n.r===4).id]; ctx.fillText(reg.boss, bossP.x, bossP.y - 34);
  let tok;
  if (M.anim){ const k = clamp((performance.now() - M.anim.t0)/500, 0, 1), e = k*k*(3-2*k), a = M.anim.from!=null ? P[M.anim.from] : {x:w/2, y:h-10}, b = P[M.anim.to]; tok = {x:a.x+(b.x-a.x)*e, y:a.y+(b.y-a.y)*e - Math.sin(Math.PI*k)*18}; }
  else if (M.cur!=null) tok = P[M.cur]; else tok = {x:w/2, y:h-14};
  if (tok){ const bob = Math.sin(t*3)*2; ctx.save(); ctx.translate(tok.x, tok.y - 24 + bob); ctx.fillStyle = 'rgba(255,200,120,.7)'; ctx.beginPath(); ctx.moveTo(-3,7); ctx.lineTo(0,12+Math.sin(t*20)*2); ctx.lineTo(3,7); ctx.closePath(); ctx.fill(); ctx.fillStyle = '#dfe6ef'; ctx.strokeStyle = '#141826'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(0,-10); ctx.lineTo(7,7); ctx.lineTo(0,4); ctx.lineTo(-7,7); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.fillStyle = teamHex(); ctx.beginPath(); ctx.moveTo(0,-5); ctx.lineTo(3,2); ctx.lineTo(-3,2); ctx.closePath(); ctx.fill(); ctx.restore(); }
}

  state.history[b] = {t:type, r: win?'W':'L'};
  const prevB = state.battle;
  if (win || !boss) state.battle++;

}

/* ---------- dates, renown ---------- */
function dateKey(off=0){ const d = new Date(Date.now() + off*86400000); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function hashStr(s){ let h = 2166136261; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h>>>0; }
function renownLevel(){ let l = 1, r = meta.renown||0; while (r >= 80*l){ r -= 80*l; l++; } return {lvl:l, into:r, need:80*l}; }
function unlocksAt(l){ return [...TEAM_COLORS.filter(c=>c.lvl===l).map(c=>c.name+' colours'), ...EMBLEMS.filter(e=>e.lvl===l).map(e=>e.name+' emblem')]; }
function addRenown(n){
  if (!n) return; const before = renownLevel().lvl; meta.renown = (meta.renown||0) + n; saveMeta();
  const after = renownLevel().lvl;
  if (after > before){ const un = []; for (let l=before+1;l<=after;l++) un.push(...unlocksAt(l)); toast(`Renown level ${after}!${un.length?` Unlocked: ${un.join(', ')}.`:''}`, 'ach'); }
}

  saveMeta(); if (done){ meta.daily.fresh = true; saveMeta(); }
}

function unlockAch(id){ if (!ACH[id] || meta.ach[id]) return; meta.ach[id] = Date.now(); saveMeta(); sfx('level'); toast(`Feat unlocked: ${ACH[id].name}. +${ACH[id].ren} renown`, 'ach'); addRenown(ACH[id].ren); }
function checkAch(ctx={}){
  if (!state) return;
  if (state.wins>0) unlockAch('first_win');
  if (state.gold>=500) unlockAch('rich');
  if (state.roster.some(u=>u.level>=10)) unlockAch('lvl10');
  if (state.roster.some(u=>u.bond)) unlockAch('bond');
  if (state.roster.some(u=>u.perks.some(p=>PERKS[p] && PERKS[p].rarity==='legendary'))) unlockAch('legend');
  if (state.stats.nemSlain>0) unlockAch('revenge');
  if (meta.crowns>0) unlockAch('crown');
  if (RECRUITABLE.every(c=>meta.codex.cls[c])) unlockAch('roll');
  if (meta.arena.wins>=5) unlockAch('arena5');
  if (meta.chest.streak>=7) unlockAch('streak7');
  if (state.roster.some(u=>unitRings(u).some(r=>RINGS[r].rarity==='legendary'))) unlockAch('ringlord');
  for (const k of ['flawless','siege','muster','forms3','mythic','ult']) if (ctx[k]) unlockAch(k);
}
function discover(units, own){
  let ch = false;
  for (const u of units){
    if (own && RECRUITABLE.includes(u.cls) && !meta.codex.cls[u.cls]){ meta.codex.cls[u.cls] = 1; ch = true; }
    for (const p of (u.perks||[])) if (PERKS[p] && !meta.codex.perks[p]){ meta.codex.perks[p] = 1; ch = true; }
    for (const r of unitRings(u)) if (!meta.codex.rings[r]){ meta.codex.rings[r] = 1; ch = true; }
  }
  if (ch) saveMeta();
}

/* ---------- arena ---------- */
let arenaDb = null, arenaUid = null, arenaPlayers = [], arenaInit = null, arenaState = 'idle', postBusy = false;
function initArena(){
  if (arenaInit) return arenaInit;
  arenaState = 'loading';
  arenaInit = (async () => {
    try{
      if (!window.claude || !window.claude.use) { arenaState = 'off'; return null; }
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      const uid = user ? await user.id() : null;
      if (!db || !uid){ arenaState = 'off'; return null; }
      arenaDb = db; arenaUid = uid; arenaState = 'on';
      db.collection('arena').orderBy('rating','desc').limit(50).onSnapshot(snap => {
        arenaPlayers = snap.docs.filter(d=>d.exists && d.id!==arenaUid).map(d=>cleanOpp(d.id, d.data())).filter(Boolean);
        if (sheetKind==='arena') refreshArena();
      }, () => {});
      return db;
    }catch(e){ arenaState = 'off'; return null; }
  })();
  arenaInit.then(()=>{ if (sheetKind==='arena') refreshArena(); });
  return arenaInit;
}
function cleanOpp(id, d){
  if (!d || !Array.isArray(d.units)) return null;
  const units = d.units.slice(0,9).map(u=>{
    if (!u || !CLASSES[u.cls] || u.cls==='warlord') return null;
    const level = clamp(Math.round(+u.level||1), 1, 30);
    const perks = (Array.isArray(u.perks)?u.perks:[]).filter(p=>typeof p==='string' && PERKS[p] && perkFits(PERKS[p], u.cls)).slice(0,30);
    const gear = typeof u.gear==='string' && ITEMS[u.gear] && itemFits(u.gear, u.cls) ? u.gear : null;
    const spells = (Array.isArray(u.spells)?u.spells:[]).filter(r=>typeof r==='string' && RINGS[r] && RINGS[r].kind==='spell').slice(0,2), ult = typeof u.ult==='string' && RINGS[u.ult] && RINGS[u.ult].kind==='ult' ? u.ult : null;
    return {cls:u.cls, level, perks, gear, spells, ult, row: ['van','line','rear'].includes(u.row) ? u.row : CLASSES[u.cls].row, ord: typeof u.ord==='number' ? clamp(u.ord,0,1) : null};
  }).filter(Boolean);
  if (!units.length) return null;
  const b = d.banner || {};
  return {id, real:true, name:String(d.name||'A rival warband').slice(0,28), banner:{color:clamp(Math.round(+b.color||0),0,TEAM_COLORS.length-1), emblem:clamp(Math.round(+b.emblem||0),0,EMBLEMS.length-1)},
    units, rating:clamp(Math.round(+d.rating||1000),0,5000), wins:Math.max(0,+d.wins|0), losses:Math.max(0,+d.losses|0), power:teamPower(units)};
}
const BOT_NAMES = ["Sir Pellam's Iron Company","The Thornwood Free Lances","Mother Ash's Pilgrims","The Gilded Wolves","Captain Rook's Irregulars","The Last Lantern","The Barrow Watch"];
function arenaBots(){
  const seed = hashStr(dateKey()) + Math.round(meta.arena.rating/50), rng = mulberry32(seed);
  const dep = deployed(), base = Math.max(1, avgLevel(dep.length ? dep : state.roster)), pool = unlocked(Math.max(state.battle, 6));
  return [0,1,2].map(i=>{
    const lvl = Math.max(1, Math.round(base + (i-1)*0.8)), n = clamp((dep.length||4) + i - 1, 3, 9), units = [];
    for (let k=0;k<n;k++){ const cls = pick(rng, pool); units.push({cls, level:lvl, perks:rollStartPerks(cls, lvl, rng), gear:null, row:CLASSES[cls].row, ord:null}); }
    return {id:'bot'+i, real:false, name:BOT_NAMES[(seed+i)%BOT_NAMES.length], banner:{color:(i+2)%5, emblem:(i+1)%6}, units, rating:meta.arena.rating + (i-1)*60, power:teamPower(units)};
  });
}
function mySnapshot(){
  const dep = deployed();
  return {name:state.name, banner:{color:state.banner.color, emblem:state.banner.emblem}, units:dep.map(u=>({cls:u.cls, level:u.level, perks:u.perks.slice(), gear:u.gear||null, row:u.row, ord:u.ord ?? null, spells:(u.spells||[]).filter(Boolean), ult:u.ult||null})),
    power:teamPower(dep), rating:meta.arena.rating, wins:meta.arena.wins, losses:meta.arena.losses, march:marchOf(Math.min(state.battle,FINAL)), updated:Date.now()};

async function postArena(manual){
  const db = await initArena();
  if (!db){ if (manual) toast('Posting needs you signed in to claude.ai, viewing this page in the app.'); if (sheetKind==='arena') refreshArena(); return false; }
  if (!deployed().length || postBusy) return false;
  postBusy = true;
  try{ await db.doc('arena/'+arenaUid).set(mySnapshot()); meta.arena.joined = true; saveMeta(); if (manual){ toast('Your warband now defends in the Arena.', 'ach'); } return true; }
  catch(e){ if (manual) toast(e && e.code==='invalid_argument' ? 'You can fight here, but only Contributors and up can post a warband.' : e && e.code==='quota_exceeded' ? 'The Arena is full right now.' : 'The Arena could not be reached. Try again soon.'); return false; }
  finally{ postBusy = false; if (sheetKind==='arena') refreshArena(); }
}

function startArena(id){

function finishArena(){
  const win = B.winner===0, e = B.enemy, allies = B.fs.filter(f=>!f.side);
  const old = meta.arena.rating, exp = 1/(1+Math.pow(10,(e.rating-old)/400)), delta = Math.round(32*((win?1:0)-exp));
  meta.arena.rating = Math.max(0, old + delta); if (win) meta.arena.wins++; else meta.arena.losses++;

/* ---------- music ---------- */
const MUS = {timer:0, kind:null, step:0, next:0, gain:null};
function musicOn(kind){
  if (!meta.settings.music || !state.sound) return musicOff();
  const a = AC; if (!a || a.state!=='running') return;
  if (!MUS.gain){ MUS.gain = a.createGain(); MUS.gain.gain.value = 0.5; MUS.gain.connect(a.destination); }
  MUS.kind = kind;
  if (!MUS.timer){ MUS.next = a.currentTime + 0.1; MUS.step = 0; MUS.timer = setInterval(musicTick, 120); }
}
function musicOff(){ clearInterval(MUS.timer); MUS.timer = 0; MUS.kind = null; }
function mtone(freq, t, dur, type, vol){ const a = AC; const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(freq, t); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t+0.012); g.gain.exponentialRampToValueAtTime(0.0001, t+dur); o.connect(g); g.connect(MUS.gain); o.start(t); o.stop(t+dur+0.05); }
function mnoise(t, dur, vol, freq){ const a = AC, n = Math.floor(a.sampleRate*dur), buf = a.createBuffer(1,n,a.sampleRate), d = buf.getChannelData(0); for (let i=0;i<n;i++) d[i] = (Math.random()*2-1)*(1-i/n); const s = a.createBufferSource(); s.buffer = buf; const f = a.createBiquadFilter(); f.type='highpass'; f.frequency.value = freq; const g = a.createGain(); g.gain.value = vol; s.connect(f); f.connect(g); g.connect(MUS.gain); s.start(t); }
function musicTick(){
  const a = AC; if (!a || !MUS.kind) return;
  const battle = MUS.kind==='battle', sp = 60/(battle?132:88)/2, roots = [0,-4,3,-2], pent = [0,3,5,7,10,12,15];
  const hz = n => 220*Math.pow(2, n/12);
  try{
    while (MUS.next < a.currentTime + 0.35){
      const i = MUS.step, t = MUS.next, bar = Math.floor(i/8)%4, root = roots[bar];
      if (i%8===0) mtone(hz(root-24), t, sp*7.5, 'sine', battle?0.07:0.06);
      if (i%4===0) mtone(hz(root-12+7), t, sp*3.5, 'triangle', 0.018);
      const mel = [0,2,4,2,5,4,2,1][(i + bar*3)%8], skip = battle ? false : (i%2===1 && (i*7+bar)%3===0);
      if (!skip) mtone(hz(root + pent[mel] + (battle?12:0)), t, battle?sp*0.9:sp*1.6, battle?'square':'triangle', battle?0.012:0.022);
      if (battle){ if (i%2===0) { const o = a.createOscillator(), g = a.createGain(); o.frequency.setValueAtTime(130,t); o.frequency.exponentialRampToValueAtTime(45,t+0.12); g.gain.setValueAtTime(0.09,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.15); o.connect(g); g.connect(MUS.gain); o.start(t); o.stop(t+0.2); }
        if (i%4===2) mnoise(t, 0.12, 0.05, 1200); else if (i%2===1) mnoise(t, 0.04, 0.02, 6000); }
      MUS.step++; MUS.next += sp;
    }
  }catch(e){ musicOff(); }
}

/* ---------- fx overlay: confetti and coins ---------- */
const fxc = document.createElement('canvas'); fxc.className = 'fxc'; document.body.appendChild(fxc);
let fxParts = [], fxRaf = 0;
function fxLoop(){
  if (fxRaf) return; let last = performance.now();
  const tick = ts => {
    const dt = Math.min(0.05, (ts-last)/1000); last = ts;
    const w = innerWidth, h = innerHeight; if (fxc._w!==w || fxc._h!==h){ fxc._ctx = setupCanvas(fxc, w, h); fxc._w = w; fxc._h = h; }
    const ctx = fxc._ctx; ctx.clearRect(0,0,w,h);
    for (let i=fxParts.length-1;i>=0;i--){
      const p = fxParts[i]; p.t += dt; if (p.t < 0) continue;
      if (p.kind==='coin'){
        const k = Math.min(1, p.t/p.dur), e = k*k*(3-2*k), x = (1-e)*(1-e)*p.x0 + 2*(1-e)*e*p.cx + e*e*p.x1, y = (1-e)*(1-e)*p.y0 + 2*(1-e)*e*p.cy + e*e*p.y1;
        const g = ctx.createRadialGradient(x-2,y-2,1,x,y,7); g.addColorStop(0,'#ffe39a'); g.addColorStop(0.6,'#f6b93b'); g.addColorStop(1,'#b47d14'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x,y,6.5,0,Math.PI*2); ctx.fill();
        if (k>=1){ fxParts.splice(i,1); p.done && p.done(); }
      } else {
        p.vy += 420*dt; p.vx *= 0.99; p.x += p.vx*dt; p.y += p.vy*dt; p.rot += p.vr*dt;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.globalAlpha = clamp((p.life-p.t)*2,0,1); ctx.fillStyle = p.col; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.rot*1.7))); ctx.restore();
        if (p.t > p.life) fxParts.splice(i,1);
      }
    }
    if (fxParts.length) fxRaf = requestAnimationFrame(tick); else { fxRaf = 0; ctx.clearRect(0,0,w,h); }
  };
  fxRaf = requestAnimationFrame(tick);
}
function confetti(n=90, x=innerWidth/2, y=innerHeight*0.25){
  if (reduced) return; const cols = ['#f6b93b','#5bb6ff','#ef6a52','#7ad69e','#c89cff','#ff9f43','#f7efdf'];
  for (let i=0;i<n;i++) fxParts.push({kind:'conf', x, y, vx:(Math.random()-0.5)*560, vy:-Math.random()*520-140, rot:Math.random()*6, vr:(Math.random()-0.5)*14, w:4+Math.random()*4, h:7+Math.random()*6, col:cols[i%cols.length], t:-Math.random()*0.15, life:1.5+Math.random()*0.9});
  fxLoop();
}
function coinFly(fromEl, toEl, n=8){
  if (reduced || !fromEl || !toEl) return; const a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
  for (let i=0;i<n;i++) fxParts.push({kind:'coin', x0:a.left+a.width/2+(Math.random()-0.5)*60, y0:a.top+a.height/2, x1:b.left+b.width/2, y1:b.top+b.height/2, cx:(a.left+b.left)/2+(Math.random()-0.5)*180, cy:Math.min(a.top,b.top)-60-Math.random()*80, t:-i*0.07, dur:0.75, done:()=>{ sfx('tap'); toEl.classList.remove('bump'); void toEl.offsetWidth; toEl.classList.add('bump'); }});
  fxLoop();
}

    case 'codex': sfx('tap'); return openSheet(codexSheetHTML(), 'codex');
    case 'settings': sfx('tap'); return openSheet(settingsSheetHTML(), 'settings');
    case 'setsound': state.sound = !state.sound; save(); if (state.sound){ sfx('tap'); musicFor(); } else musicOff(); return openSheet(settingsSheetHTML(), 'settings');
    case 'setmusic': meta.settings.music = !meta.settings.music; saveMeta(); if (meta.settings.music){ const a = audio(); if (a && a.state==='suspended') a.resume().then(musicFor); else musicFor(); } else musicOff(); return openSheet(settingsSheetHTML(), 'settings');
    case 'setbig': meta.settings.big = !meta.settings.big; saveMeta(); applyA11y(); return openSheet(settingsSheetHTML(), 'settings');
    case 'sethc': meta.settings.hc = !meta.settings.hc; saveMeta(); applyA11y(); return openSheet(settingsSheetHTML(), 'settings');
    case 'setcalm': meta.settings.calm = !meta.settings.calm; saveMeta(); applyA11y(); return openSheet(settingsSheetHTML(), 'settings');
    case 'setrings': meta.settings.rings = !meta.settings.rings; saveMeta(); return openSheet(settingsSheetHTML(), 'settings');
    case 'setshake': meta.settings.shake = !meta.settings.shake; saveMeta(); return openSheet(settingsSheetHTML(), 'settings');
    case 'setspeed': state.speed = +b.dataset.s; save(); return openSheet(settingsSheetHTML(), 'settings');
    case 'replaytut': meta.tut = {}; saveMeta(); closeSheet(); toast('Tips will show again in camp.'); if (state.screen==='camp') later(coachNext, 400); return;
    case 'resetall': if (!resetAllArmed){ resetAllArmed = true; return openSheet(settingsSheetHTML(), 'settings'); } resetAllArmed = false;
      try{ localStorage.removeItem(KEY); localStorage.removeItem(META_KEY); }catch(_){} meta = META_DEF(); state = null; shownGold = null; newCampaign(); state.screen = 'title'; closeSheet(); toast('Everything is erased. A fresh warband awaits.'); return render();
    case 'coachok': if (coachCur){ meta.tut[coachCur.key] = 1; saveMeta(); } coachHide(); return later(coachNext, 250);
    case 'coachskip': COACH.forEach(c=>meta.tut[c.key]=1); saveMeta(); return coachHide();
    case 'speed': state.speed = +b.dataset.s; save(); document.querySelectorAll('[data-act=speed]').forEach(x=>x.classList.toggle('on', +x.dataset.s===state.speed)); return;
    case 'skip': return skip();
    case 'picks': return openPicks();
    case 'picktab': { const u = pendingUnits().find(x=>x.id===+b.dataset.id); if (!u) return; sheetBox.innerHTML = pickSheetHTML(u, false); paintPortraits(sheetBox); sheetId = u.id; sfx('tap'); return; }
    case 'boons': return openBoons();
    case 'boon': return chooseBoon(b.dataset.id);
    case 'choose': return choose(b.dataset.perk);
    case 'camp': state.screen='camp'; save(); return render();
    case 'toend': state.screen='end'; save(); return render();
    case 'sound': state.sound = !state.sound; save(); if (state.sound){ sfx('tap'); musicFor(); } else musicOff(); return renderCamp(false);
    case 'reset': if(!resetArmed){ resetArmed=true; return renderCamp(false); } resetArmed=false; state.ended = {won:false, reason:'abandoned'}; state.screen='end'; save(); return render();
    case 'legend': { if (state.legendChosen) return; const c = legendCands()[+b.dataset.i]; if (!c) return;
      meta.legends.push({name:c.name, cls:c.cls, level:c.level, kills:c.kills, perk:c.perk, march:marchOf(Math.min(state.battle,FINAL)), won:!!(state.ended&&state.ended.won)}); meta.legends = meta.legends.slice(-12); saveMeta();
      state.legendChosen = true; save(); sfx('level'); toast(`${c.name} joins the Hall of Legends.`); return renderEnd(); }
    case 'endless': state.ended = null; state.endless = true; state.legendChosen = false; setNextNode(); state.screen='camp'; save(); return render();
    case 'newgame': shownGold = null; newCampaign(); return render();
  }
}
document.addEventListener('click', e => {
  if (e.target.id==='board') return;
  if (e.target.id==='mapcv'){ const r = e.target.getBoundingClientRect(), x = e.clientX-r.left, y = e.clientY-r.top; let best=null, bd=1e9; for (const h of mapHits){ const d = Math.hypot(h.x-x,h.y-y); if (d<h.r && d<bd){ bd=d; best=h; } } if (best){ if (mapAvail().some(n=>n.id===best.id)) mapSelect(best.id); else toast(best.id===ensureMap().cur ? 'Your warband is here.' : 'That course is not open from here.'); } return; }
  if (performance.now() - dragEndedAt < 450){ e.preventDefault(); return; }
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; onAct(b);
});
document.addEventListener('keydown', e => {
  if (e.key==='Escape' && sheetKind && sheetKind!=='boon') closeSheet();
  if (e.key==='Enter' && e.target.id==='rename-input') onAct({dataset:{act:'rename'}});
  if (e.key==='Enter' && e.target.id==='wb-input') onAct({dataset:{act:'wbname'}});
  hotkey(e);
});
const KEYS_OK = !!(window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches);
function hotkey(e){
  const tg = e.target, k = e.key;
  if (e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented) return;
  if (tg && (tg.tagName==='INPUT' || tg.tagName==='TEXTAREA' || tg.isContentEditable)) return;
  const vis = el => el && !el.disabled && el.offsetParent !== null;
  const click = sel => { for (const one of sel.split(/,\s*/)) for (const el of document.querySelectorAll(one)){ if (vis(el)){ e.preventDefault(); el.classList.add('kpress'); setTimeout(()=>el.classList.remove('kpress'), 160); onAct(el); return true; } } return false; };
  if (sheetKind) return;
  if (state.screen==='battle' && B && !B.over){
    if (k>='1' && k<='3'){ e.preventDefault(); return useCmd(Object.keys(CMDS)[+k-1]); }
    if (k==='s' || k==='S') return click('[data-act="skip"]');
  }
  if (state.screen==='outpost' && OP){
    if (k==='1') return click('#opfire');
    if (k==='2') return click('#oprally');
    if (k==='f' || k==='F') return click('[data-act="opspeed"]');
  }
  if (k===' ' || k==='Enter'){
    if (tg && tg.closest && tg.closest('button,a,summary,[role="switch"]')) return;
    if (state.screen==='results' && document.querySelector('.res-skip,.cascading')){ /* let the cascade skip handler run */ }
    click('#bar .fab, [data-act="picks"], [data-act="boons"], [data-act="toend"], [data-act="opperkopen"], [data-act="opretry"], .rbtns [data-act="camp"], #app > .wrap [data-act="camp"].btn, [data-act="play"]');
  }
}
sheetEl.addEventListener('click', e => { if (e.target===sheetEl && sheetKind!=='boon' && sheetKind!=='opperk') closeSheet(); });
/* ---------- drag and drop ---------- */
const ghost = document.createElement('div'); ghost.className = 'dragghost'; ghost.hidden = true; ghost.innerHTML = '<canvas></canvas>'; document.body.appendChild(ghost);
const benchZone = document.createElement('div'); benchZone.className = 'benchzone'; benchZone.hidden = true; benchZone.textContent = 'Drop here to bench'; document.body.appendChild(benchZone);
let drag = null, press = null, dragEndedAt = 0;
function boardPoint(e){ const c = document.getElementById('board'); if (!c) return null; const r = c.getBoundingClientRect(); const x = e.clientX-r.left, y = e.clientY-r.top; return {x, y, w:r.width, h:r.height, inside: x>=0 && y>=0 && x<=r.width && y<=r.height}; }
function dropTarget(e){
  if (!benchZone.hidden && e.clientY >= benchZone.getBoundingClientRect().top) return {bench:true};
  const p = boardPoint(e); if (!p || !p.inside) return null;
  const f = p.x/p.w, row = f<0.34 ? 'rear' : f<0.66 ? 'line' : 'van';
  return {row, ord: clamp((p.y-BOARD_TOP)/Math.max(1, p.h-BOARD_PAD-BOARD_TOP), 0, 1), x:p.x, y:p.y};
}
function startDrag(id, e){
  const u = state.roster.find(x=>x.id===id); if (!u) return;
  drag = {id, target:null};
  const gc = ghost.querySelector('canvas'), ctx = setupCanvas(gc, 64, 64), fx = fxOf(u.perks,u.gear), scl = fx.colossus ? 1.28 : fx.giant ? 1.14 : 1;
  drawUnit(ctx, {cls:u.cls, paint:u.paint, visor:u.visor, color:teamHex(), skin:skinOf(u.id), x:u.cls==='knight'?28:32, y:42, s:(u.cls==='knight'?1.6:2)/scl, facing:1, tier:tierOf(u.perks,u.gear,unitRings(u)), fx, time:0.6});
  ghost.hidden = false; benchZone.hidden = !!u.benched; benchZone.textContent = `Drop here to bench ${u.name}`;
  document.body.classList.add('dragging'); moveDrag(e);
  try{ navigator.vibrate && navigator.vibrate(8); }catch(_){}
  sfx('tap');
}
function moveDrag(e){
  ghost.style.transform = `translate(${e.clientX-32}px, ${e.clientY-80}px)`;
  drag.target = dropTarget(e);
  benchZone.classList.toggle('hot', !!(drag.target && drag.target.bench));
  if (reduced) drawBoard(0);
}
function endDrag(e, cancel){
  const d = drag, t = (!cancel && d) ? dropTarget(e) : null;
  drag = null; ghost.hidden = true; benchZone.hidden = true; benchZone.classList.remove('hot'); document.body.classList.remove('dragging'); dragEndedAt = performance.now();
  if (!d) return;
  applyDrop(d.id, t);
}
function applyDrop(id, t){
  const u = state.roster.find(x=>x.id===id); if (!u || !t){ drawBoard(0); return; }
  if (t.bench){ if (u.benched) return drawBoard(0); u.benched = true; toast(`${u.name} moves to the bench.`); }
  else {
    if (u.wounded){ toast(`${u.name} is wounded and sits out the next battle.`); return drawBoard(0); }
    if (u.benched){
      if (deployed().length >= maxMarch()){
        let near = null, bd = 1e9; for (const h of boardHits){ const d = Math.hypot(h.x-t.x, h.y-t.y); if (d < h.r*1.8 && d < bd){ bd = d; near = h; } }
        const nu = near && state.roster.find(x=>x.id===near.id);
        if (!nu){ toast(`The warband is full. Drop ${u.name} onto a deployed soldier to swap them out.`); return drawBoard(0); }
        nu.benched = true; u.row = nu.row; u.ord = nu.ord ?? ordKey(nu); u.benched = false;
        toast(`${u.name} swaps in for ${nu.name}.`); save(); sfx('tap'); return renderCamp(false);
      }
      u.benched = false;
    }
    u.row = t.row; u.ord = t.ord;
  }
  save(); sfx('tap'); renderCamp(false);
}
document.addEventListener('pointerdown', e => {
  if (!state || state.screen!=='camp' || drag || (e.button && e.button!==0)) return;
  if (e.target.id==='board'){
    const p = boardPoint(e); let best = null, bd = 1e9;
    for (const h of boardHits){ const d = Math.hypot(h.x-p.x, h.y-p.y); if (d<h.r && d<bd){ bd = d; best = h; } }
    press = {id: best ? best.id : null, board:true, sx:e.clientX, sy:e.clientY};
    return;
  }
  const tl = e.target.closest && e.target.closest('.tile'); if (!tl) return;
  press = {id:+tl.dataset.id, board:false, sx:e.clientX, sy:e.clientY, touch: e.pointerType!=='mouse'};
  if (press.touch){ const pr = press; pr.timer = setTimeout(()=>{ if (press===pr && !drag) startDrag(pr.id, {clientX:pr.lx ?? pr.sx, clientY:pr.ly ?? pr.sy}); }, 280); }
});
document.addEventListener('pointermove', e => {
  if (drag){ e.preventDefault(); moveDrag(e); return; }
  if (!press) return;
  press.lx = e.clientX; press.ly = e.clientY;
  const d = Math.hypot(e.clientX-press.sx, e.clientY-press.sy);
  if (press.board){ if (press.id!=null && d>6) startDrag(press.id, e); return; }
  if (press.touch){ if (d>10){ clearTimeout(press.timer); press = null; } return; }
  if (d>6) startDrag(press.id, e);
}, {passive:false});
document.addEventListener('pointerup', e => {
  if (press && press.timer) clearTimeout(press.timer);
  if (drag){ endDrag(e, false); press = null; return; }
  if (press && press.board && press.id!=null){ const id = press.id; press = null; openSoldier(id); return; }
  press = null;
});
document.addEventListener('pointercancel', e => { if (press && press.timer) clearTimeout(press.timer); press = null; if (drag) endDrag(e, true); });
document.addEventListener('touchmove', e => { if (drag) e.preventDefault(); }, {passive:false});
document.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('.tile, #board')) e.preventDefault(); });

document.addEventListener('pointerdown', () => { if (!state || !state.sound) return; const a = audio(); if (!a) return; if (a.state==='suspended') a.resume().then(musicFor).catch(()=>{}); else if (!MUS.timer) musicFor(); }, true);
document.addEventListener('pointerdown', e => { if (e.target && e.target.id==='field' && B && B.aim && state.screen==='battle'){ if (aimAt(e.clientX, e.clientY)) e.preventDefault(); } });
let rsz = 0;
window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(()=>{ if (state.screen==='battle' && B) sizeField(); else if (state.screen==='camp') drawBoard(0); else if (state.screen==='title') startTitleLoop(); if (coachCur) coachPlace(); }, 120); });

state = load();
if (!state) newCampaign();
migrateRings(state); if (!state.ringShop) rollRingShop();
state.screen = 'title';
if (state.node && (state.node.type==='skirmish'||state.node.type==='elite'||state.node.type==='boss') && !state.enemy) state.enemy = makeEnemy(state.node.type, state.node.nem);
if (!state.node && !state.roads.length && !state.ended) setNextNode();
shownGold = state.gold;
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ if (state.screen==='camp'){ const c = document.getElementById('board'); if (c) c._w = 0; drawBoard(0); } });
})();
</script>
