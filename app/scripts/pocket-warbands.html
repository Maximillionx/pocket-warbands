<title>Pocket Warbands</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Exo+2:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column. Top: your warband (banner, live formation board, roster tiles, formations). Then the road (map, choice, scouting, event or market), nemeses, recruiting tent, stash. Sticky action bar at the bottom. Sheets slide up for soldiers, warband, traits and boons. Single committed dusk-tabletop look. */
:root{
  --bg:#0b1020; --bg-2:#0a0f1f; --panel:#141c33; --panel-2:#1c2847; --ink:#f7efdf; --muted:#8fa3c7; --line:rgba(247,239,223,.12);
  --gold:#f6b93b; --gold-deep:#b47d14; --gold-ink:#3a2500;
  --ally:#5bb6ff; --foe:#ef6a52; --ok:#7ad69e; --warn:#f2a65a;
  --common:#a9c0c4; --rare:#6fd6a8; --epic:#c89cff; --legend:#ff9f43; --mythic:#ff6ad5;
  --display:"Russo One","Arial Black",system-ui,sans-serif;
  --body:"Exo 2",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
html,body{background:var(--bg);}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(120% 60% at 50% -10%, #1a2550 0%, var(--bg) 60%) fixed, var(--bg);}
.wrap{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:14px 48px;display:flex;flex-direction:column;gap:22px;}
.wrap.has-bar{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px));}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:.01em;text-wrap:balance;}
button{font:inherit;color:inherit;cursor:pointer;}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.num{font-variant-numeric:tabular-nums;}
.muted{color:var(--muted);}
.r-common{color:var(--common);} .r-rare{color:var(--rare);} .r-epic{color:var(--epic);} .r-legendary{color:var(--legend);} .r-mythic{color:var(--mythic);} .r-role{color:var(--ally);}

@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes glow{0%,100%{box-shadow:0 4px 0 var(--gold-deep),0 0 0 0 rgba(246,185,59,0)}50%{box-shadow:0 4px 0 var(--gold-deep),0 0 0 6px rgba(246,185,59,.25)}}
.enter > *{animation:rise .38s var(--ease) both;}
.enter > *:nth-child(2){animation-delay:.04s} .enter > *:nth-child(3){animation-delay:.08s} .enter > *:nth-child(4){animation-delay:.12s} .enter > *:nth-child(5){animation-delay:.16s} .enter > *:nth-child(n+6){animation-delay:.2s}

.pills{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-weight:600;font-size:14px;}
.pill.bump{animation:pop .4s var(--ease);}
.coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe39a,var(--gold) 55%,var(--gold-deep));box-shadow:0 0 0 1.5px #7a520a inset;flex:none;display:inline-block;}
.morale{display:inline-flex;gap:3px;align-items:center;}
.morale i{width:10px;height:14px;background:var(--ally);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%);}
.morale i.off{background:rgba(247,239,223,.18);}

.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;}
.hint{font-size:13px;color:var(--muted);margin:0;}

/* team */
.team{display:flex;flex-direction:column;gap:12px;}
.team-top{display:flex;align-items:center;gap:12px;}
.flag{flex:none;background:none;border:0;padding:0;line-height:0;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25));}
.team-name{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;}
.team-name h1{font-size:25px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.team-name small{display:block;font-size:12px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.team-stats{display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
.boardwrap{border-radius:16px;overflow:hidden;border:2px solid #2a5a3a;background:#4b8440;box-shadow:0 8px 24px rgba(0,0,0,.3);}
#board{display:block;width:100%;height:170px;cursor:pointer;}
.board-cap{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap;}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;}
.fchip{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:rgba(246,185,59,.12);color:var(--gold);border:1px solid rgba(246,185,59,.35);}
.fchip.boon{background:rgba(200,156,255,.12);color:var(--epic);border-color:rgba(200,156,255,.35);}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 6px 10px;border-radius:14px;background:var(--panel);border:1px solid var(--line);min-width:0;transition:transform .12s var(--ease),opacity .2s;}
.tile:active{transform:scale(.96);}
.tile.off{opacity:.6;}
.tile canvas{width:52px;height:52px;border-radius:12px;background:radial-gradient(circle at 50% 70%,#22305a,#101629);}
.tile .tn{font-weight:700;font-size:13px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tile .tl{font-size:11px;color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tile .xp{width:78%;flex:none;height:4px;margin-top:3px;}
.tb{position:absolute;top:5px;right:5px;font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:1px 5px;background:var(--bg-2);color:var(--muted);}
.tb.w{color:var(--warn);} .tb.up{background:var(--gold);color:var(--gold-ink);}
.tflags{position:absolute;top:7px;left:7px;display:flex;gap:4px;}
.tflags i{width:8px;height:8px;display:block;}
.tflags .gd{transform:rotate(45deg);border-radius:2px;}
.tflags .gd.common{background:var(--common);} .tflags .gd.rare{background:var(--rare);} .tflags .gd.epic{background:var(--epic);}
.tflags .bd{border-radius:50%;background:var(--gold);}
.fold{border:1px solid var(--line);border-radius:14px;background:rgba(0,0,0,.12);}
.fold summary{list-style:none;cursor:pointer;padding:10px 14px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:10px;}
.fold summary::-webkit-details-marker{display:none;}
.fold summary::after{content:"Show";color:var(--muted);font-weight:600;font-size:12px;}
.fold[open] summary::after{content:"Hide";}
.fold > div{padding:0 12px 12px;}
.forms{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;}
.form{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:rgba(0,0,0,.14);min-width:0;}
.form.on{border-color:rgba(246,185,59,.5);background:linear-gradient(160deg,rgba(246,185,59,.12),rgba(0,0,0,.1));}
.form .fh{display:flex;align-items:center;gap:8px;}
.form b{font-size:14px;flex:1;min-width:0;}
.form.on b{color:var(--gold);}
.pips{display:inline-flex;gap:3px;}
.pips i{width:7px;height:7px;border-radius:50%;background:rgba(247,239,223,.18);}
.pips i.on{background:var(--gold);}
.form .cnt{font-size:11px;color:var(--muted);}
.form p{margin:3px 0 0;font-size:12px;color:var(--muted);line-height:1.35;}
.form.on p{color:var(--ink);}

/* road */
.next{background:linear-gradient(160deg,#3a2a2a 0%,#2a2226 100%);border:1px solid rgba(239,106,82,.35);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;scroll-margin-top:12px;}
.next.boss{border-color:rgba(246,185,59,.55);background:linear-gradient(160deg,#41301f 0%,#2a2226 100%);}
.next.elite{border-color:rgba(239,106,82,.7);background:linear-gradient(160deg,#4a2622 0%,#2a2226 100%);}
.next.road{border-color:var(--line);background:linear-gradient(160deg,#1f3f4a 0%,#172f38 100%);}
.next.event{border-color:rgba(200,156,255,.45);background:linear-gradient(160deg,#2f2a48 0%,#1c2a35 100%);}
.next.market{border-color:rgba(246,185,59,.45);background:linear-gradient(160deg,#3a3320 0%,#1c2a30 100%);}
.next h2{font-size:26px;line-height:1.05;}
.next .meta{color:#e8c9c0;font-size:14px;}
.efs{display:flex;flex-wrap:wrap;gap:5px;}
.efs span{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:2px 7px;background:rgba(239,106,82,.16);color:#ffb7a8;}
.scout{margin:0;font-size:13px;color:#f1dcc0;display:flex;gap:8px;align-items:flex-start;}
.scout::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-top:7px;}
.nemline{margin:0;font-size:13px;font-weight:600;color:#ffb7a8;border-left:3px solid var(--foe);padding-left:8px;}
.powers{display:flex;gap:10px;font-size:13px;font-weight:700;}
.powers span:first-child{color:var(--ally);} .powers span:last-child{color:#ffb7a8;}
.map{display:flex;align-items:center;}
.map .node{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:rgba(0,0,0,.25);border:2px solid rgba(247,239,223,.18);color:var(--muted);flex:none;}
.map .node svg{width:16px;height:16px;}
.map .node .coin{width:12px;height:12px;}
.map .node.done.w{background:var(--ally);border-color:var(--ally);color:#0b2233;}
.map .node.done.l{background:#5a3a36;border-color:var(--foe);color:#ffd2c9;}
.map .node.done.n{background:#3c3a52;border-color:var(--epic);color:#e9dcff;}
.map .node.cur{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 4px rgba(246,185,59,.18);}
.map .node.boss{width:38px;height:38px;border-radius:10px;}
.map .node.boss svg{width:22px;height:22px;}
.map .link{flex:1;height:3px;background:rgba(247,239,223,.15);min-width:8px;}
.map .link.done{background:var(--ally);}
.roads{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.roadc{text-align:left;border-radius:14px;padding:12px;background:rgba(0,0,0,.22);border:1.5px solid var(--line);display:flex;flex-direction:column;gap:5px;min-width:0;transition:transform .12s var(--ease),border-color .2s;}
.roadc:active{transform:scale(.97);}
.roadc .ri{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--bg-2);font-weight:700;font-size:18px;}
.roadc .ri svg{width:20px;height:20px;}
.roadc b{font-size:16px;line-height:1.2;}
.roadc p{margin:0;font-size:12px;color:var(--muted);line-height:1.35;}
.roadc .rw{font-size:12px;font-weight:700;color:var(--gold);}
.roadc .nemline{font-size:12px;}
.roadc.skirmish .ri{color:var(--ink);} .roadc.elite{border-color:rgba(239,106,82,.5);} .roadc.elite .ri{color:var(--foe);}
.roadc.event{border-color:rgba(200,156,255,.4);} .roadc.event .ri{color:var(--epic);} .roadc.market{border-color:rgba(246,185,59,.4);}
.evtext{margin:0;font-size:15px;max-width:62ch;}
.choices{display:flex;flex-direction:column;gap:8px;}
.choice{text-align:left;border-radius:12px;padding:10px 12px;background:var(--panel);border:1.5px solid var(--line);transition:transform .12s var(--ease);}
.choice:active{transform:scale(.98);}
.choice b{display:block;font-size:15px;}
.choice span{font-size:13px;color:var(--muted);}
.choice:disabled{opacity:.45;cursor:not-allowed;}
.outcome{margin:0;font-size:15px;}
.mlist{display:flex;flex-direction:column;}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--line);}
.mrow > div{flex:1;min-width:0;}
.mrow p{margin:2px 0 0;font-size:13px;color:var(--muted);}
.rtag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-left:4px;}
.rtag.common{color:var(--common);} .rtag.rare{color:var(--rare);} .rtag.epic{color:var(--epic);}

.strip{display:flex;flex-wrap:wrap;gap:4px;}
.mini{position:relative;width:38px;height:38px;border-radius:10px;background:rgba(0,0,0,.22);}
.mini.big{width:46px;height:46px;background:rgba(246,185,59,.15);}
.mini.nem{box-shadow:0 0 0 2px var(--foe);background:rgba(239,106,82,.18);}
.mini canvas{width:100%;height:100%;display:block;}
.mini b{position:absolute;right:-3px;bottom:-3px;min-width:16px;height:16px;border-radius:8px;background:var(--bg-2);border:1px solid var(--line);font-size:10px;display:grid;place-items:center;padding:0 3px;}

.btn{font-family:var(--display);font-size:20px;letter-spacing:.02em;background:var(--gold);color:var(--gold-ink);border:0;border-radius:14px;padding:12px 18px;box-shadow:0 4px 0 var(--gold-deep);transition:transform .08s, box-shadow .08s, background .2s;}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-deep);}
.btn:disabled{background:#5c6f73;color:#c9d4d5;box-shadow:0 4px 0 #3f4f53;cursor:not-allowed;}
.btn.wide{width:100%;}
.btn.pulse{animation:glow 1.4s ease-in-out infinite;}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none;font-size:16px;padding:9px 14px;}
.btn.ghost.danger{color:#ffb7a8;border-color:rgba(239,106,82,.4);}
.btn.small{font-size:15px;padding:8px 12px;border-radius:11px;box-shadow:0 3px 0 var(--gold-deep);}

.bar-fixed{position:fixed;right:max(16px, calc(50vw - 244px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;}
.bar-in{max-width:488px;margin:0 auto;display:flex;align-items:center;gap:12px;}
.bar-in .info{flex:1;min-width:0;font-size:13px;color:var(--muted);line-height:1.3;}
.bar-in .info b{display:block;color:var(--ink);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-in .btn{flex:none;min-width:132px;}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;}
.sec-h h2{font-size:22px;}
.sec-h span{color:var(--muted);font-size:13px;text-align:right;}
.list{display:flex;flex-direction:column;gap:10px;}

.unit{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;transition:opacity .25s;}
.unit.off{opacity:.55;}
.port{width:56px;height:56px;border-radius:12px;background:radial-gradient(circle at 50% 70%,#22305a,#101629);display:block;}
.uname{font-weight:700;font-size:16px;line-height:1.2;}
.uname em,.pickhead h2 em{font-style:normal;color:var(--gold);}
.usub{color:var(--muted);font-size:13px;margin-top:2px;}
.lv{display:inline-block;}
.lv.pop{animation:pop .45s var(--ease);color:var(--gold);}
.xprow{display:flex;align-items:center;gap:8px;margin-top:8px;}
.xp{flex:1;height:6px;background:var(--bg-2);border-radius:3px;overflow:hidden;display:block;}
.xp i{display:block;height:100%;background:var(--ally);border-radius:3px;transition:width .6s var(--ease);}
.xpn{font-size:11px;color:var(--muted);white-space:nowrap;}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.chip{border:1px solid currentColor;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;line-height:1.5;}
.chip.common{color:var(--common);} .chip.rare{color:var(--rare);} .chip.epic{color:var(--epic);}
.combo{margin-top:6px;font-size:12px;font-weight:700;color:var(--gold);}
.shop .unit{background:#1a3a44;}
.shop-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;color:var(--muted);font-size:13px;}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px;}
.badge.rare{background:rgba(111,214,168,.18);color:var(--rare);}
.badge.new{background:rgba(246,185,59,.18);color:var(--gold);}
.hired{color:var(--muted);font-size:13px;font-weight:600;align-self:center;}
.nemcard{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:center;border-radius:14px;padding:10px 12px;background:linear-gradient(160deg,#3a2526,#26252b);border:1px solid rgba(239,106,82,.45);}
.nemcard canvas{width:48px;height:48px;border-radius:10px;background:rgba(239,106,82,.15);}
.nemcard b{font-size:15px;color:#ffd0c6;}
.nemcard p{margin:2px 0 0;font-size:12px;color:var(--muted);}
.irow{display:flex;justify-content:space-between;gap:10px;border-top:1px dashed var(--line);padding:8px 0;font-size:13px;}
.irow > span:first-child{min-width:0;}
.fallen{color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:4px;}
.fallen div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:4px;}
.foot{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;}

/* battle */
.btop{display:flex;align-items:center;gap:10px;}
.btop .brand{font-family:var(--display);font-size:24px;line-height:1;flex:1;min-width:0;}
.btop .brand small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bhud{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;}
.side{display:flex;flex-direction:column;gap:4px;min-width:0;}
.side.r{text-align:right;}
.side .nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar{height:8px;background:var(--bg-2);border-radius:4px;overflow:hidden;display:flex;}
.bar i{display:block;height:100%;transition:width .25s linear;}
.side.l .bar i{background:var(--ally);} .side.r .bar{justify-content:flex-end;} .side.r .bar i{background:var(--foe);}
.vs{font-family:var(--display);font-size:22px;color:var(--muted);}
.field{border-radius:16px;overflow:hidden;border:3px solid #2a5a3a;background:#4b8440;box-shadow:0 10px 30px rgba(0,0,0,.35);}
.field canvas{display:block;width:100%;height:auto;}
.ctrl{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;}
.speeds{display:flex;gap:6px;}
.speeds button{border:1.5px solid var(--line);background:var(--bg-2);border-radius:10px;padding:7px 12px;font-weight:700;transition:border-color .2s,color .2s;}
.speeds button.on{border-color:var(--gold);color:var(--gold);}
.log{display:flex;flex-direction:column;gap:4px;font-size:13px;min-height:96px;}
.log div{color:var(--muted);animation:rise .3s var(--ease) both;}
.log div.a{color:var(--ink);} .log div.k{color:var(--gold);} .log div.d{color:#f3a596;}

/* results & end */
.banner{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;}
.banner h1{font-size:54px;line-height:.95;}
.banner.win h1{color:var(--gold);text-shadow:0 4px 0 var(--gold-deep);}
.banner.loss h1{color:var(--foe);text-shadow:0 4px 0 #8a2e20;}
.banner p{margin:0;color:var(--muted);max-width:34ch;}
.banner .pills{justify-content:center;margin-top:6px;}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;opacity:0;transform:translateY(4px);transition:opacity .3s, transform .3s var(--ease);}
.tags.show{opacity:1;transform:none;}
.tag{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:2px 7px;background:var(--bg-2);}
.tag.up{background:var(--gold);color:var(--gold-ink);}
.tag.mvp{background:rgba(200,156,255,.2);color:var(--epic);}
.tag.cu{color:var(--ally);} .tag.h{color:var(--ok);}
.tag.w{color:var(--warn);} .tag.s{color:var(--foe);} .tag.k{color:var(--ink);}
.gain{font-weight:700;color:var(--ally);white-space:nowrap;}
.ncards{display:flex;flex-direction:column;gap:8px;}

.ncard.rev{border-color:var(--gold);background:linear-gradient(160deg,#3d321b,var(--panel));} .ncard.rev b{color:var(--gold);}
.ncard.bond{border-color:var(--ally);} .ncard.oath{border-color:var(--epic);} .ncard.oath b{color:var(--epic);}
.ncard.loot.common{border-color:rgba(169,192,196,.5);} .ncard.loot.rare{border-color:var(--rare);} .ncard.loot.epic{border-color:var(--epic);}
.ncard.unlock{border-color:rgba(246,185,59,.5);background:rgba(246,185,59,.08);} .ncard.unlock b{color:var(--gold);}
.gem{width:26px;height:26px;flex:none;transform:rotate(45deg);border-radius:6px;margin:0 9px;}
.gem.common{background:var(--common);} .gem.rare{background:var(--rare);} .gem.epic{background:var(--epic);}
.endstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}

.endstats b{display:block;font-family:var(--display);font-size:26px;font-weight:400;}
.endstats span{font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;}

/* sheet */
.scrim{position:fixed;inset:0;z-index:8;background:rgba(5,15,20,0);transition:background .25s;display:flex;align-items:flex-end;justify-content:center;}
.scrim.open{background:rgba(5,15,20,.6);}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;border-top:1px solid var(--line);padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .32s var(--ease);display:flex;flex-direction:column;gap:14px;}
.scrim.open .sheet{transform:none;}
.sh-top{display:flex;justify-content:center;position:relative;min-height:20px;}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center;}
.xbtn{position:absolute;right:0;top:0;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg-2);font-size:20px;line-height:1;display:grid;place-items:center;}
.pickhead{display:flex;align-items:center;gap:14px;}
.pickhead canvas{width:72px;height:72px;border-radius:18px;background:radial-gradient(circle at 50% 70%,#22305a,#101629);flex:none;}
.pickhead > div{min-width:0;flex:1;}
.pickhead h2{font-size:24px;line-height:1.1;}
.pickhead p{margin:4px 0 0;color:var(--muted);font-size:13px;}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.stat{background:var(--bg-2);border-radius:10px;padding:6px 9px;}
.stat span{display:block;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;}
.stat b{font-size:16px;}
.sh-sec{display:flex;flex-direction:column;gap:8px;}
.sh-sec h3{font-family:var(--body);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;}
.seg{display:flex;background:var(--bg-2);border-radius:12px;padding:3px;gap:3px;}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 4px;font-weight:700;font-size:13px;color:var(--muted);transition:background .15s,color .15s;}
.seg button.on{background:var(--panel-2);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ally);}
.seg button:disabled{opacity:.45;cursor:not-allowed;}
.tlist,.chron{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px;}
.tlist li span{color:var(--muted);}
.chron li{color:var(--muted);padding-left:12px;position:relative;}
.chron li::before{content:"";position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--gold);}
.gearbox{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:12px;padding:10px;}
.gearbox > div{flex:1;min-width:0;font-size:13px;}
.gopts{display:flex;flex-direction:column;gap:6px;}
.gopt{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:1px dashed var(--line);border-radius:10px;padding:8px 10px;background:transparent;font-size:13px;}
.gopt > span:first-child{min-width:0;}
.gopt .eq{font-weight:700;color:var(--gold);white-space:nowrap;}
.rename{display:flex;gap:8px;}
.rename input{flex:1;min-width:0;background:var(--bg-2);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--ink);font:inherit;}
.swatches,.emblems{display:flex;gap:10px;flex-wrap:wrap;}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 2px transparent;}
.sw.on{box-shadow:0 0 0 2px var(--ink);}
.em{width:46px;height:46px;border-radius:12px;background:var(--bg-2);border:1.5px solid var(--line);color:var(--muted);display:grid;place-items:center;}
.em svg{width:26px;height:26px;}
.em.on{border-color:var(--ally);color:var(--ally);}
.cards{display:flex;flex-direction:column;gap:10px;}
.cards.swap{animation:rise .3s var(--ease) both;}
.card{text-align:left;border-radius:16px;padding:13px 15px;background:var(--panel);border:2px solid var(--line);display:flex;flex-direction:column;gap:3px;transition:transform .12s var(--ease), border-color .2s;}
.card:active{transform:scale(.97);}
.card.common{border-color:rgba(169,192,196,.45);} .card.rare{border-color:var(--rare);background:linear-gradient(160deg,#1c4a48,var(--panel));} .card.epic{border-color:var(--epic);background:linear-gradient(160deg,#352a52,var(--panel));}
.card.boon{border-color:rgba(200,156,255,.55);background:linear-gradient(160deg,#2c2846,var(--panel));}
.card .rr{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
.card.common .rr{color:var(--common);} .card.rare .rr{color:var(--rare);} .card.epic .rr,.card.boon .rr{color:var(--epic);}
.card h3{font-size:21px;}
.card p{margin:0;font-size:14px;}
.card .delta{color:var(--ally);font-size:13px;font-weight:600;}
.card .ep{color:var(--muted);font-size:13px;}
.queue{font-size:12px;color:var(--muted);text-align:center;}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:#0a1d24;border:1px solid var(--line);color:var(--ink);padding:10px 14px;border-radius:12px;font-size:14px;max-width:min(440px,calc(100% - 32px));box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:10;transition:opacity .25s, transform .3s var(--ease);}
.toast.show{opacity:1;transform:translate(-50%,0);}
/* drag, rarity */
#board{touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab;}
.tile{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;}
.dragghost{position:fixed;left:0;top:0;z-index:30;width:64px;height:64px;border-radius:18px;background:rgba(13,38,48,.88);border:2px solid var(--gold);box-shadow:0 12px 26px rgba(0,0,0,.45);pointer-events:none;}
.dragghost canvas{width:64px;height:64px;display:block;}
.benchzone{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));text-align:center;font-weight:700;font-size:15px;color:var(--muted);background:rgba(13,38,48,.97);border-top:2px dashed rgba(247,239,223,.25);transition:background .15s,color .15s;}
.benchzone.hot{color:var(--warn);border-top-color:var(--warn);background:#2e2a1f;}
body.dragging,body.dragging *{cursor:grabbing!important;}
.chip.legendary{color:var(--legend);} .chip.mythic{color:var(--mythic);}
.rtag.legendary{color:var(--legend);} .rtag.mythic{color:var(--mythic);}
.card.legendary{border-color:var(--legend);background:linear-gradient(160deg,#4a3218,var(--panel));} .card.legendary .rr{color:var(--legend);}
.card.mythic{border-color:var(--mythic);background:linear-gradient(160deg,#4a2342,var(--panel));} .card.mythic .rr{color:var(--mythic);}
.tile.t-epic,.unit.t-epic{border-color:rgba(200,156,255,.75);box-shadow:0 0 16px rgba(200,156,255,.18);}
.tile.t-legendary,.unit.t-legendary{border-color:var(--legend);box-shadow:0 0 18px rgba(255,159,67,.28);}
@keyframes shimmer{from{background-position:0 0,0% 0}to{background-position:0 0,300% 0}}
.tile.t-mythic,.unit.t-mythic,.shop .unit.t-mythic{border:2px solid transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(90deg,#ff6ad5,#ffb347,#5bb6ff,#7ad69e,#ff6ad5) border-box;background-size:100% 100%,300% 100%;animation:shimmer 5s linear infinite;box-shadow:0 0 22px rgba(255,106,213,.25);}
.badge.epic{background:rgba(200,156,255,.18);color:var(--epic);} .badge.legendary{background:rgba(255,159,67,.2);color:var(--legend);} .badge.mythic{background:rgba(255,106,213,.2);color:var(--mythic);}
.ncard.mythic{border-color:var(--mythic);background:linear-gradient(160deg,#3f2140,var(--panel));} .ncard.mythic b{color:var(--mythic);}
.rumour{font-size:13px;color:var(--mythic);margin:10px 0 0;}
/* title & hub */
.titlewrap{gap:18px;}
.tart{border-radius:20px;overflow:hidden;border:2px solid rgba(0,0,0,.25);box-shadow:0 14px 34px rgba(0,0,0,.4);}
#titlecv{display:block;width:100%;height:200px;}
.tlogo{text-align:center;margin-top:-6px;}
.tlogo h1{font-size:54px;line-height:.88;color:var(--ink);text-shadow:0 5px 0 rgba(0,0,0,.35);}
.tlogo h1 span{color:var(--gold);text-shadow:0 5px 0 var(--gold-deep);}
.tlogo p{margin:10px auto 0;color:var(--muted);max-width:30ch;font-size:14px;}
.tcta{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;}
.tcta .btn{font-size:24px;padding:15px 18px;}
.hub{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.hubb{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 4px 10px;border-radius:16px;background:var(--panel);border:1px solid var(--line);min-width:0;transition:transform .12s var(--ease);}
.hubb:active{transform:scale(.95);}
.hubb .hi{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--bg-2);color:var(--gold);}
.hubb .hi svg{width:20px;height:20px;}
.hubb b{font-size:13px;} .hubb .hs{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.dot{position:absolute;top:7px;right:9px;width:10px;height:10px;border-radius:50%;background:var(--foe);box-shadow:0 0 0 2px var(--bg);animation:pop 1.6s ease-in-out infinite;}
.renown{background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;}
.renown .rtop{display:flex;justify-content:space-between;font-size:14px;}
.renown .xp i{background:var(--gold);}
.quick{display:flex;gap:6px;flex-wrap:wrap;}
.qb{position:relative;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg-2);border-radius:999px;padding:5px 11px 5px 8px;font-size:13px;font-weight:600;}
.qb svg{width:15px;height:15px;color:var(--gold);}
.qb .dot{top:-2px;right:-2px;width:9px;height:9px;}
/* daily, codex, arena, settings */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.days span{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px;border-radius:10px;background:var(--bg-2);border:1px solid var(--line);}
.days span b{font-size:14px;} .days span i{font-style:normal;font-size:9px;color:var(--muted);}
.days span.got{background:rgba(246,185,59,.16);border-color:rgba(246,185,59,.45);} .days span.got b{color:var(--gold);}
.days span.now{border-color:var(--gold);box-shadow:0 0 0 2px rgba(246,185,59,.25);}
.qrow{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;}
.qrow > div{flex:1;min-width:0;font-size:13px;} .qrow b{font-size:14px;} .qrow .xprow{margin:6px 0 3px;}
.qrow.claimed{opacity:.55;}
.feats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;}
.feat{border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;opacity:.5;position:relative;}
.feat.on{opacity:1;border-color:rgba(246,185,59,.5);background:rgba(246,185,59,.08);}
.feat b{font-size:13px;} .feat.on b{color:var(--gold);} .feat span{font-size:11px;color:var(--muted);line-height:1.3;} .feat i{font-style:normal;font-size:11px;color:var(--gold);position:absolute;top:8px;right:9px;}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;}
.cx{display:grid;grid-template-columns:40px minmax(0,1fr);grid-template-rows:auto auto;column-gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px;}
.cx canvas,.cx .q{grid-row:1/3;width:40px;height:40px;border-radius:10px;background:var(--bg-2);}
.cx .q{display:grid;place-items:center;font-family:var(--display);font-size:20px;color:var(--muted);}
.cx b{font-size:13px;} .cx span{font-size:10px;color:var(--muted);line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.cx.locked{opacity:.55;}
.trar{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;} .trar .rtag{margin:0;}
.alist{display:flex;flex-direction:column;gap:6px;}
.arow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;}
.arow > div{flex:1;min-width:0;} .arow b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} .arow span{font-size:12px;color:var(--muted);}
.arow.bot{background:rgba(0,0,0,.12);}
.lb{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px;font-size:13px;}
.lb li{padding:3px 0;border-bottom:1px dashed var(--line);} .lb li span{display:inline-block;max-width:calc(100% - 60px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;} .lb li b{float:right;} .lb li.me{color:var(--gold);}
.trow{display:flex;align-items:center;gap:12px;border-bottom:1px dashed var(--line);padding:10px 0;}
.trow > div{flex:1;min-width:0;} .trow b{display:block;font-size:15px;} .trow span{font-size:12px;color:var(--muted);}
.switch{width:50px;height:30px;border-radius:15px;border:0;background:#3c4f55;position:relative;flex:none;transition:background .2s;}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--ink);transition:transform .2s var(--ease);}
.switch.on{background:var(--ok);} .switch.on i{transform:translateX(20px);}
/* coach, fx, toasts */
.coach{position:fixed;z-index:35;background:#0a0f1f;border:1.5px solid var(--gold);border-radius:14px;padding:12px 14px;box-shadow:0 12px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:10px;animation:rise .3s var(--ease) both;}
.coach p{margin:0;font-size:14px;}
.coach > div{display:flex;align-items:center;gap:10px;justify-content:space-between;}
.linkbtn{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;padding:4px 0;}
.coachring{position:fixed;z-index:34;border-radius:16px;border:2px solid var(--gold);box-shadow:0 0 0 9999px rgba(5,15,20,.45),0 0 24px rgba(246,185,59,.5);pointer-events:none;transition:all .25s var(--ease);}
.fxc{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40;}
.toast.ach{border-color:var(--gold);background:#2c2410;color:#ffe7b0;font-weight:600;}
/* rings */
.ringi{width:56px;height:56px;border-radius:14px;background:radial-gradient(circle at 50% 40%,#22305a,#101629);display:grid;place-items:center;flex:none;--rc:var(--common);}
.ringi i{width:28px;height:28px;border-radius:50%;border:5px solid var(--rc);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.35),0 0 12px color-mix(in srgb,var(--rc) 45%,transparent);position:relative;}
.ringi i::after{content:"";position:absolute;left:50%;top:-9px;width:10px;height:10px;margin-left:-5px;transform:rotate(45deg);border-radius:2px;background:var(--rc);box-shadow:0 0 0 1.5px #0a0f1f;}
.ringi.ult i{border-style:double;border-width:6px;}
.ringi.sm{width:30px;height:30px;border-radius:9px;display:inline-grid;vertical-align:middle;} .ringi.sm i{width:15px;height:15px;border-width:3px;} .ringi.sm i::after{width:6px;height:6px;top:-5px;margin-left:-3px;}
.ringi.rare{--rc:var(--rare);} .ringi.epic{--rc:var(--epic);} .ringi.legendary{--rc:var(--legend);} .ringi.empty{--rc:rgba(247,239,223,.18);} .ringi.empty i{box-shadow:none;} .ringi.empty i::after{display:none;}
.slot{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;}
.slot > div{flex:1;min-width:0;font-size:13px;} .slot b{display:block;font-size:14px;} .slot span{color:var(--muted);font-size:12px;}
.slot.empty{border-style:dashed;opacity:.7;}
.tflags .rg{border-radius:50%;border:2px solid var(--gold);width:9px;height:9px;}
/* map */
.mapwrap{border-radius:14px;overflow:hidden;border:2px solid #6b5230;box-shadow:inset 0 0 0 2px rgba(255,240,200,.3),0 8px 20px rgba(0,0,0,.35);background:#e2cf9f;}
#mapcv{display:block;width:100%;height:380px;cursor:pointer;touch-action:manipulation;}
#mapsel{display:flex;flex-direction:column;gap:10px;}
.mapchips{display:flex;flex-wrap:wrap;gap:6px;}
.mchip{border:1.5px solid var(--line);background:rgba(0,0,0,.2);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;}
.mchip.elite{border-color:rgba(239,106,82,.5);} .mchip.event{border-color:rgba(200,156,255,.5);} .mchip.market{border-color:rgba(246,185,59,.5);}
.mchip.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);}
.mapdetail{display:flex;align-items:center;gap:12px;border-radius:14px;padding:12px 14px;background:rgba(0,0,0,.25);border:1.5px solid var(--line);animation:rise .25s var(--ease) both;}

.mapdetail b{font-size:17px;} .mapdetail p{margin:0;font-size:13px;color:var(--muted);} .mapdetail .rw{font-size:12px;font-weight:700;color:var(--gold);}
.mapdetail.elite{border-color:rgba(239,106,82,.55);} .mapdetail.event{border-color:rgba(200,156,255,.5);} .mapdetail.market{border-color:rgba(246,185,59,.5);}
@media (max-width:360px){ .roads{grid-template-columns:1fr;} .hub{grid-template-columns:repeat(2,1fr);} }
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important;}}

/* sprint 9: bosses, market tabs, loadout, quests */
.bosscard{display:flex;gap:12px;align-items:center;margin:10px 0 8px;padding:10px;border-radius:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--bc) 22%,transparent),rgba(0,0,0,.2));border:1px solid color-mix(in srgb,var(--bc) 45%,transparent);}
.bosscard canvas{width:84px;height:84px;flex:none;border-radius:14px;background:rgba(0,0,0,.25);}

.bosscard p{margin:3px 0 0;font-size:13px;color:var(--muted);font-style:italic;}
.babil{display:grid;gap:6px;margin-bottom:8px;}
.babil div{display:flex;flex-direction:column;gap:1px;font-size:13px;padding:7px 10px;border-radius:10px;background:rgba(0,0,0,.18);}
.babil b{font-size:13px;} .babil span{color:var(--muted);}
.mini.boss canvas{background:rgba(0,0,0,.25);}
.seg.tabs{margin-bottom:10px;} .seg.tabs button{font-size:14px;padding:9px 4px;}
.tdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);vertical-align:middle;margin-left:3px;box-shadow:0 0 6px rgba(246,185,59,.7);}
.tdot.myth{background:var(--mythic);box-shadow:0 0 6px rgba(255,106,213,.7);}
.statline{display:flex;flex-wrap:wrap;gap:6px;}
.statline span{display:flex;align-items:baseline;gap:5px;background:var(--bg-2);border-radius:999px;padding:5px 11px;}
.statline i{font-style:normal;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;}
.statline b{font-size:14px;}
.seg.pos button.bench.on{box-shadow:inset 0 0 0 1.5px var(--warn);}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.ltile{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 9px;border-radius:14px;background:var(--bg-2);border:1px solid var(--line);color:var(--ink);font-size:11px;line-height:1.2;text-align:center;min-height:86px;transition:border-color .15s,background .15s;}
.ltile b{font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.ltile.empty{border-style:dashed;color:var(--muted);} .ltile.empty b{font-weight:600;}
.ltile.on{border-color:var(--gold);background:rgba(246,185,59,.08);}
.ltile.rare{box-shadow:inset 0 -2px 0 var(--rare);} .ltile.epic{box-shadow:inset 0 -2px 0 var(--epic);} .ltile.legendary{box-shadow:inset 0 -2px 0 var(--legend);}
.ltile .tdot{position:absolute;top:7px;right:7px;margin:0;}
.ltile .ringi.sm{width:34px;height:34px;}
.gslot{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#22305a,#101629);color:var(--rc,var(--muted));--rc:var(--common);}
.gslot svg{width:20px;height:20px;} .gslot.rare{--rc:var(--rare);} .gslot.epic{--rc:var(--epic);} .gslot.legendary{--rc:var(--legend);} .gslot.empty{--rc:rgba(247,239,223,.3);}
.lpick{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:14px;background:rgba(0,0,0,.16);border:1px solid var(--line);}
.lcur{display:flex;gap:10px;align-items:center;} .lcur > div{flex:1;min-width:0;font-size:13px;} .lcur b{display:block;font-size:14px;} .lcur span{color:var(--muted);font-size:12px;}
.traits{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;}
.traits li{display:flex;flex-direction:column;gap:1px;padding:7px 10px 7px 12px;border-left:3px solid var(--line);font-size:13px;}
.traits li span{color:var(--muted);font-size:12px;}
.traits li.rare{border-color:var(--rare);} .traits li.epic{border-color:var(--epic);} .traits li.legendary{border-color:var(--legend);} .traits li.mythic{border-color:var(--mythic);}
.traits li.role b{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;}
.story > div{display:flex;flex-direction:column;gap:10px;}
.linkbtn{background:none;border:0;color:var(--foe);font-size:13px;font-weight:600;padding:4px 0;text-align:left;opacity:.85;}
.chesthero{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:radial-gradient(circle at 18% 50%,rgba(246,185,59,.18),transparent 60%),var(--bg-2);border:1px solid var(--line);}
.chesthero.ready{border-color:rgba(246,185,59,.5);}
.chesthero h2{font-size:22px;line-height:1.1;} .chesthero p{margin:4px 0 0;color:var(--muted);font-size:13px;}
.chestsvg{width:88px;height:70px;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.3));}
.chesthero.ready .chestsvg{animation:chestbob 1.6s ease-in-out infinite;filter:drop-shadow(0 0 14px rgba(246,185,59,.55));}
@keyframes chestbob{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-4px) rotate(-3deg)}60%{transform:translateY(-4px) rotate(3deg)}}
.streak{list-style:none;margin:0;padding:0 4px;display:flex;justify-content:space-between;position:relative;}
.streak::before{content:"";position:absolute;left:22px;right:22px;top:15px;height:3px;border-radius:2px;background:var(--line);}
.streak li{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:1;}
.streak li span{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:2px solid var(--line);font-weight:700;font-size:13px;color:var(--muted);}
.streak li span svg{width:16px;height:16px;}
.streak li em{font-style:normal;font-size:10px;color:var(--muted);}
.streak li.got span{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);}
.streak li.now span{border-color:var(--gold);color:var(--gold);animation:ringpulse 1.6s ease-in-out infinite;}
@keyframes ringpulse{0%,100%{box-shadow:0 0 0 3px rgba(246,185,59,.18)}50%{box-shadow:0 0 0 7px rgba(246,185,59,.06)}}
.streak li.big span{width:36px;height:36px;margin-top:-2px;}
.gemi{display:block;width:13px;height:13px;transform:rotate(45deg);border-radius:3px;background:var(--epic);box-shadow:0 0 8px rgba(200,156,255,.7);}
.qhead{display:flex;justify-content:space-between;align-items:baseline;} .qhead span{font-size:12px;color:var(--muted);}
.qcard{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--panel);border:1px solid var(--line);transition:opacity .2s;}
.qic{width:42px;height:42px;flex:none;border-radius:13px;display:grid;place-items:center;background:var(--bg-2);color:var(--muted);}
.qic svg{width:22px;height:22px;} .qic.sm .chestsvg{width:34px;height:28px;filter:none;animation:none;}
.qbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;} .qbody b{font-size:14px;line-height:1.2;} .qbody > span{font-size:11px;color:var(--muted);}
.qbar{height:6px;border-radius:3px;background:var(--bg-2);overflow:hidden;} .qbar i{display:block;height:100%;border-radius:3px;background:var(--ally);transition:width .4s;}
.qrew{display:flex;flex-direction:column;gap:4px;align-items:flex-end;font-size:13px;font-weight:700;} .qrew span{display:flex;align-items:center;gap:5px;}
.qrew .coin{width:12px;height:12px;} .ren{display:inline-block;width:11px;height:11px;transform:rotate(45deg);border-radius:2px;background:var(--epic);}
.qcard.ready{border-color:rgba(246,185,59,.6);background:linear-gradient(135deg,rgba(246,185,59,.14),transparent 70%),var(--panel);} .qcard.ready .qic{color:var(--gold);background:rgba(246,185,59,.15);} .qcard.ready .qbar i{background:var(--gold);}
.qcard.claimed{opacity:.6;} .qcard.claimed .qic{color:var(--ok);} .qcard.claimed .qbar i{background:var(--ok);}
.qdone{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(122,214,158,.18);color:var(--ok);} .qdone svg{width:16px;height:16px;}
.qbonus{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;border:1px dashed var(--line);font-size:13px;} .qbonus > div{flex:1;display:flex;flex-direction:column;gap:2px;} .qbonus span{color:var(--muted);}
.qbonus.ready{border-style:solid;border-color:rgba(246,185,59,.6);} .qbonus.claimed{opacity:.6;}

/* sprint 10: commander abilities, cascade, floating button */
.cmdbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
.cmdb{display:flex;align-items:center;gap:8px;padding:7px 10px 7px 7px;border-radius:16px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font-size:13px;font-weight:700;text-align:left;transition:transform .1s,border-color .15s,background .15s;--p:1;}
.cmdb b{min-width:0;line-height:1.15;}
.cmi{position:relative;width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--bg-2);color:var(--cc);overflow:hidden;}
.cmi svg{width:22px;height:22px;position:relative;z-index:1;}
.cmcd{position:absolute;inset:0;background:conic-gradient(rgba(5,15,20,.78) calc(var(--p)*360deg), transparent 0);z-index:2;}
.cmdb.ready{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,var(--panel));}
.cmdb.ready .cmi{box-shadow:0 0 12px color-mix(in srgb,var(--cc) 60%,transparent);}
.cmdb.aiming{background:color-mix(in srgb,var(--cc) 30%,var(--panel));transform:scale(1.04);animation:ringpulse 1s ease-in-out infinite;}
.cmdb:disabled{opacity:.4;} .cmdb:disabled .cmi{color:var(--muted);}
.cmdb:active{transform:scale(.97);}
.cmdhint{min-height:16px;margin:6px 0 0;font-size:12px;color:var(--muted);text-align:center;}
#field.aim{cursor:crosshair;}
.fab{display:flex;flex-direction:column;align-items:flex-end;gap:0;padding:10px 20px 11px;border-radius:20px;min-width:148px;box-shadow:0 5px 0 var(--gold-deep),0 10px 26px rgba(0,0,0,.45);}
.fab small{font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.72;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fab b{font-weight:400;font-size:22px;line-height:1.05;}
.wrap.has-bar{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));}
.team.head{padding-bottom:12px;}
.team.army .sec-h{margin-bottom:8px;}
.cz{opacity:0;transform:translateY(12px);transition:opacity .35s ease, transform .35s cubic-bezier(.2,.8,.2,1);}
.cz.in{opacity:1;transform:none;}
.unit.off.cz.in{opacity:.55;}
.rsh{margin:14px 0 8px;} .rsh h2{font-size:18px;}
.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.rmini{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:11px;text-align:center;}
.rmini canvas{width:44px;height:44px;border-radius:12px;background:radial-gradient(circle at 50% 70%,#22305a,#101629);}
.rmini b{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rmini .xp{width:80%;} .rmini span{color:var(--muted);}
.rmini.hurt{border-color:rgba(242,166,90,.5);} .rmini.hurt span{color:var(--warn);}

/* sprint 11: deep-space HUD theme */
[hidden]{display:none !important;}
:root{
  --bg:#0b1020; --bg-2:#070b17; --panel:#121a31; --panel-2:#1a2645; --ink:#e8f0ff; --muted:#8fa3c7; --line:rgba(130,170,255,.16);
  --gold:#ffc23d; --gold-deep:#a8760c; --gold-ink:#2a1800;
  --foe:#ff5e57; --ok:#5ef0a0; --warn:#ffa24c;
  --common:#a9b8d6; --rare:#5ef0c0; --epic:#c79bff; --legend:#ffa24c; --mythic:#ff5fd8;
  --hud:#7ff3ff;
}
body{background:
  radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.7), transparent 60%),
  radial-gradient(1px 1px at 72% 8%, rgba(255,255,255,.55), transparent 60%),
  radial-gradient(1.5px 1.5px at 38% 62%, rgba(255,230,180,.6), transparent 60%),
  radial-gradient(1px 1px at 88% 44%, rgba(255,255,255,.5), transparent 60%),
  radial-gradient(1px 1px at 22% 86%, rgba(200,220,255,.55), transparent 60%),
  radial-gradient(1px 1px at 58% 92%, rgba(255,255,255,.4), transparent 60%),
  radial-gradient(1.5px 1.5px at 94% 76%, rgba(180,220,255,.6), transparent 60%),
  radial-gradient(1px 1px at 5% 50%, rgba(255,255,255,.45), transparent 60%),
  radial-gradient(70% 45% at 85% -5%, rgba(255,95,216,.14), transparent 70%),
  radial-gradient(80% 50% at 0% 10%, rgba(76,201,255,.14), transparent 70%),
  linear-gradient(180deg, #0b1020, #080c18) fixed;
  background-attachment:fixed;}
h1,h2,h3{letter-spacing:.02em;}
.eyebrow,.sh-sec h3,.qhead h3{color:var(--hud);opacity:.85;letter-spacing:.14em;}
.btn{border-radius:10px;letter-spacing:.04em;box-shadow:0 4px 0 var(--gold-deep),0 0 18px rgba(255,194,61,.18);}
.btn:active{box-shadow:0 1px 0 var(--gold-deep);}
.btn.ghost{border-color:rgba(127,243,255,.3);color:var(--ink);}
.btn:disabled{background:#2a3350;color:#7f8db0;box-shadow:0 4px 0 #1a2038;}
.pill{background:rgba(7,11,23,.8);border-color:rgba(127,243,255,.22);}
.coin{border-radius:3px;transform:rotate(45deg) scale(.86);background:linear-gradient(135deg,#fff0b8,var(--gold) 50%,var(--gold-deep));box-shadow:0 0 6px rgba(255,194,61,.6);}
.morale i{background:var(--hud);clip-path:polygon(50% 0,100% 30%,100% 100%,0 100%,0 30%);box-shadow:0 0 6px var(--hud);}
.morale i.off{background:rgba(127,243,255,.15);box-shadow:none;}
.flag{filter:drop-shadow(0 0 10px color-mix(in srgb,var(--ally) 45%,transparent));}
.boardwrap{border:1px solid rgba(127,243,255,.3);background:#1a1f31;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45),inset 0 0 30px rgba(127,243,255,.06);}
.tile,.unit,.qcard,.cmdb,.rmini,.choice,.ltile{border-radius:10px;}
.tile{background:linear-gradient(180deg,#151e38,#10172b);}
.tile canvas,.pickhead canvas,.rmini canvas,.unit .port,.mini,.bosscard canvas{background:radial-gradient(circle at 50% 75%,#25356a,#0e1428) !important;}
.unit{background:linear-gradient(180deg,#141d37,#0f1629);border-color:var(--line);}
.next{border-radius:14px;box-shadow:inset 0 1px 0 rgba(127,243,255,.12),0 10px 30px rgba(0,0,0,.35);
  background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px), linear-gradient(160deg,#2a1830 0%,#141327 100%);}
.next.boss{border-color:rgba(255,194,61,.55);background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px), linear-gradient(160deg,#33240f 0%,#141327 100%);}
.next.elite{border-color:rgba(255,94,87,.65);background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px), linear-gradient(160deg,#3a1420 0%,#141327 100%);}
.next.road{border-color:rgba(127,243,255,.25);background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px), linear-gradient(160deg,#101a3a 0%,#0c1128 100%);}
.next.event{border-color:rgba(199,155,255,.45);background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px), linear-gradient(160deg,#241a48 0%,#0f1430 100%);}
.next.market{border-color:rgba(255,194,61,.45);background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px), linear-gradient(160deg,#2a2412 0%,#101428 100%);}
.next .meta{color:#c9d3f0;}
.scout{color:#cfe0ff;} .scout::before{background:var(--hud);box-shadow:0 0 6px var(--hud);}
.map .node{background:rgba(7,11,23,.6);}
.map .node.done.w{background:var(--ally);color:#06101f;}
.map .node.cur{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,194,61,.18),0 0 12px rgba(255,194,61,.4);}
.mapwrap{border-radius:12px;overflow:hidden;border:1px solid rgba(127,243,255,.3);box-shadow:0 0 24px rgba(76,201,255,.12);}
.field{background:#25223a !important;border-color:rgba(127,243,255,.35) !important;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 28px rgba(76,201,255,.15) !important;}
.sheet{background:linear-gradient(180deg,#121a33,#0b1020) !important;border-top:1px solid rgba(127,243,255,.3);}
.card{border-radius:10px;}
.fab{border-radius:12px;}
.fold{background:rgba(7,11,23,.5);border-radius:10px;}
.seg{background:rgba(7,11,23,.75);} .seg button.on{background:var(--panel-2);}
.banner h1{text-shadow:0 0 24px rgba(255,194,61,.35);}
.banner.loss h1{text-shadow:0 0 24px rgba(255,94,87,.35);}
.tlogo h1{letter-spacing:.04em;text-shadow:0 0 30px rgba(76,201,255,.35);}
.tlogo h1 span{color:var(--gold);}
.tart{border-radius:14px;overflow:hidden;border:1px solid rgba(127,243,255,.3);}
.statline span,.qic,.cmi{background:rgba(7,11,23,.8);}
.toast{background:rgba(10,15,31,.96) !important;border:1px solid rgba(127,243,255,.3);}
.toast.ach{border-color:rgba(255,194,61,.6);}

/* sprint 12: framed portraits, rarity tiles, screen flow */
.shop .unit,.list .unit{background:linear-gradient(180deg,#141d37,#0f1629);}
.shop .unit.t-mythic{background:linear-gradient(#141d37,#141d37) padding-box,linear-gradient(90deg,#ff5fd8,#ffa24c,#4cc9ff,#5ef0a0,#ff5fd8) border-box;}
.fr{position:relative;display:inline-block;width:var(--fs);height:var(--fs);flex:none;--fc:rgba(143,163,199,.45);--fg:transparent;}
.frb{position:absolute;inset:0;background:var(--fc);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);}
.frb canvas{position:absolute;left:2px;top:2px;width:calc(100% - 4px) !important;height:calc(100% - 4px) !important;border-radius:0 !important;clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);background:radial-gradient(circle at 50% 78%, color-mix(in srgb, var(--fc) 38%, #0e1428), #090d1b 78%) !important;display:block;}
.fr::before,.fr::after{content:"";position:absolute;width:11px;height:11px;border-color:var(--fc);border-style:solid;pointer-events:none;}
.fr::before{top:-4px;right:-4px;border-width:2px 2px 0 0;}
.fr::after{bottom:-4px;left:-4px;border-width:0 0 2px 2px;}
.flv{position:absolute;right:-6px;bottom:-6px;min-width:21px;height:19px;padding:0 4px;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:11px;line-height:1;color:#06101f;background:var(--fc);clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px);z-index:2;}
.flv.pop{animation:pop .4s var(--ease);}
.fstar{position:absolute;left:-5px;top:-5px;width:12px;height:12px;background:var(--fc);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);z-index:2;animation:twinkle 1.8s ease-in-out infinite;}
@keyframes twinkle{0%,100%{transform:scale(.8) rotate(0)}50%{transform:scale(1.15) rotate(45deg)}}
.fr.r-common{--fc:rgba(143,163,199,.5);} .fr.r-common .flv{color:#e8f0ff;background:#2a3557;}
.fr.r-rare{--fc:var(--rare);}
.fr.r-epic{--fc:var(--epic);filter:drop-shadow(0 0 6px rgba(199,155,255,.45));}
.fr.r-legendary{--fc:var(--legend);filter:drop-shadow(0 0 8px rgba(255,162,76,.55));}
.fr.r-legendary .frb::after,.fr.r-mythic .frb::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);background-size:250% 100%;animation:sheen 2.6s ease-in-out infinite;mix-blend-mode:overlay;pointer-events:none;}
@keyframes sheen{0%{background-position:120% 0}60%,100%{background-position:-60% 0}}
.fr.r-mythic{--fc:#ff5fd8;filter:drop-shadow(0 0 9px rgba(255,95,216,.55));}
.fr.r-mythic .frb{background:linear-gradient(135deg,#ff5fd8,#ffa24c,#4cc9ff,#5ef0a0,#ff5fd8);background-size:300% 300%;animation:hue 4s linear infinite;}
@keyframes hue{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.unit > .fr{margin:4px 0 0 4px;}
.unit{grid-template-columns:62px minmax(0,1fr) auto;}
.pickhead .fr{margin:4px;}
.tile{padding:12px 6px 10px;gap:4px;border-radius:10px;}
.tile .fr{margin:4px 0 6px;}
.tile .tl b{font-weight:700;}
.tile.rk-rare{border-color:color-mix(in srgb,var(--rare) 40%,transparent);}
.tile.rk-epic{border-color:color-mix(in srgb,var(--epic) 55%,transparent);background:linear-gradient(180deg,#1b1838,#10172b);}
.tile.rk-legendary{border-color:color-mix(in srgb,var(--legend) 70%,transparent);background:linear-gradient(180deg,#2a1e1a,#10172b);box-shadow:0 0 18px rgba(255,162,76,.18),inset 0 1px 0 rgba(255,162,76,.35);}
.tile.rk-mythic{border-color:color-mix(in srgb,var(--mythic) 70%,transparent);background:linear-gradient(180deg,#2a1734,#10172b);box-shadow:0 0 18px rgba(255,95,216,.2),inset 0 1px 0 rgba(255,95,216,.35);}
.tile.off .fr{filter:grayscale(.6) brightness(.8);}
.rmini .fr{margin:3px 0 4px;}
.sfx{position:fixed;inset:0;z-index:60;pointer-events:none;}
.sfx.fade{background:#070b17;animation:sfxout .5s ease forwards;}
.sfx.flash{background:radial-gradient(circle at 50% 30%,rgba(255,240,200,.55),rgba(7,11,23,.85));animation:sfxout .5s ease forwards;}
@keyframes sfxout{from{opacity:1}to{opacity:0}}

function formations(clsList){
  const c = {}; clsList.forEach(k=>c[k]=(c[k]||0)+1);
  return Object.entries(FORMS).map(([id,F])=>{ const n=F.count(c); const tier=F.tiers.filter(x=>n>=x).length; return {id, F, n, tier, next:F.tiers[tier]}; });
}
function formGain(baseList, cls){
  const a = formations(baseList), b = formations([...baseList, cls]);
  return b.filter((x,i)=>x.tier>a[i].tier).map(x=>({name:x.F.name, up:a.find(y=>y.id===x.id).tier>0}));
}

/* ---------- sound ---------- */
let AC = null, lastHitSfx = 0;
function audio(){ if (!state || !state.sound || AC===false) return null; if (!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC = false; return null; } } if (AC.state==='suspended') AC.resume(); return AC; }
function tone(freq, dur, type='sine', vol=0.08, when=0, slide=0){ const a=audio(); if(!a) return; const t=a.currentTime+when; const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.setValueAtTime(freq,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq*slide), t+dur); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.02); }
function noise(dur, vol=0.05, freq=1600){ const a=audio(); if(!a) return; const n=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n); const s=a.createBufferSource(); s.buffer=buf; const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; const g=a.createGain(); g.gain.value=vol; s.connect(f); f.connect(g); g.connect(a.destination); s.start(); }
const SFX = {
  hit:()=>noise(0.06,0.05,1500+Math.random()*900), shoot:()=>tone(1400,0.09,'square',0.016,0,0.3), die:()=>tone(170,0.25,'sine',0.07,0,0.45),
  coin:()=>{ tone(1200,0.08,'square',0.025); tone(1600,0.1,'square',0.025,0.07); }, level:()=>[523,659,784,1047].forEach((f,i)=>tone(f,0.18,'triangle',0.045,i*0.07)),
  win:()=>[392,523,659,784].forEach((f,i)=>tone(f,0.35,'triangle',0.055,i*0.12)), lose:()=>[330,262,196].forEach((f,i)=>tone(f,0.4,'sine',0.055,i*0.18)),
  tap:()=>tone(720,0.04,'sine',0.025), horn:()=>{ tone(110,0.7,'sawtooth',0.03,0,2.2); tone(165,0.7,'sawtooth',0.02,0.05,2.0); },
};
function sfx(n){ if (!state || !state.sound || (B && B.skipping)) return; if (n==='hit'||n==='shoot'){ const now=performance.now(); if (now-lastHitSfx<55) return; lastHitSfx=now; } try{ SFX[n] && SFX[n](); }catch(e){} }

/* ---------- drawing ---------- */
function shade(hex, f){ const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255; return `rgb(${clamp(Math.round(r*f),0,255)},${clamp(Math.round(g*f),0,255)},${clamp(Math.round(b*f),0,255)})`; }
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function ln(ctx,a,b,c,d){ ctx.beginPath(); ctx.moveTo(a,b); ctx.lineTo(c,d); ctx.stroke(); }
const OUT = '#141826';
const NOFX = {};
function star4(ctx, x, y, r, col){ ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x, y-r*2); ctx.lineTo(x+r*0.5, y-r*0.5); ctx.lineTo(x+r*2, y); ctx.lineTo(x+r*0.5, y+r*0.5); ctx.lineTo(x, y+r*2); ctx.lineTo(x-r*0.5, y+r*0.5); ctx.lineTo(x-r*2, y); ctx.lineTo(x-r*0.5, y-r*0.5); ctx.closePath(); ctx.fill(); }
function crown(ctx, cx, cy){ ctx.beginPath(); ctx.moveTo(cx-4.6,cy+3); ctx.lineTo(cx-4.6,cy-1.6); ctx.lineTo(cx-2.3,cy+0.6); ctx.lineTo(cx,cy-2.8); ctx.lineTo(cx+2.3,cy+0.6); ctx.lineTo(cx+4.6,cy-1.6); ctx.lineTo(cx+4.6,cy+3); ctx.closePath(); ctx.fillStyle='#f6c945'; ctx.fill(); ctx.lineWidth=0.8; ctx.strokeStyle=OUT; ctx.stroke(); ctx.fillStyle='#ff6ad5'; ctx.beginPath(); ctx.arc(cx,cy+1.2,0.9,0,Math.PI*2); ctx.fill(); }
function halo(ctx, x, y){ ctx.strokeStyle='#ffe08a'; ctx.lineWidth=1.3; ctx.beginPath(); ctx.ellipse(x,y,4.6,1.5,0,0,Math.PI*2); ctx.stroke(); }
function plume(ctx, x, y){ ctx.strokeStyle='#ff8a3d'; ctx.lineWidth=2.2; ctx.beginPath(); ctx.moveTo(x-1,y); ctx.quadraticCurveTo(x-4,y-9,x-9,y-7); ctx.stroke(); ctx.fillStyle='#ffd27a'; ctx.beginPath(); ctx.arc(x-9,y-7,1.4,0,Math.PI*2); ctx.fill(); }

function tierRing(ctx, tier, s, t, wide){
  const rx = (wide?14:10)*s, ry = (wide?4.6:3.6)*s, cy = 10*s;
  ctx.save();
  if (tier==='epic'){ ctx.strokeStyle='rgba(200,156,255,.9)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.ellipse(0,cy,rx,ry,0,0,Math.PI*2); ctx.stroke(); }
  else {
    const myth = tier==='mythic', g = ctx.createRadialGradient(0,cy,0,0,cy,rx*1.5);
    g.addColorStop(0, myth ? 'rgba(255,106,213,.5)' : 'rgba(255,170,70,.55)'); g.addColorStop(1, 'rgba(255,170,70,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0,cy,rx*1.5,ry*1.7,0,0,Math.PI*2); ctx.fill();
    ctx.lineWidth = myth ? 2 : 1.8; ctx.strokeStyle = myth ? `hsl(${(t*120)%360},95%,68%)` : '#ffb347'; ctx.beginPath(); ctx.ellipse(0,cy,rx,ry,0,0,Math.PI*2); ctx.stroke();
    if (myth){ ctx.strokeStyle='#f6c945'; ctx.lineWidth=1; ctx.beginPath(); ctx.ellipse(0,cy,rx*0.7,ry*0.7,0,0,Math.PI*2); ctx.stroke(); }
  }
  ctx.restore();
}
function tierSparks(ctx, tier, t, top){
  const a0 = ctx.globalAlpha;
  if (tier==='epic'){ for (let i=0;i<2;i++){ const a = t*2.4 + i*Math.PI; star4(ctx, Math.cos(a)*10, -7+Math.sin(a)*3, 1.1, '#e6d6ff'); } }
  else if (tier==='legendary'){ for (let i=0;i<3;i++){ const ph = (t*0.7 + i/3)%1; ctx.globalAlpha = a0*(1-ph); ctx.fillStyle='#ffb347'; ctx.beginPath(); ctx.arc(Math.sin(i*2.3+t*1.7)*7, 6-ph*30, 1.3, 0, Math.PI*2); ctx.fill(); } ctx.globalAlpha = a0; star4(ctx, 0, top-4, 1.2, '#ffd27a'); }
  else if (tier==='mythic'){ for (let i=0;i<4;i++){ const a = t*1.8 + i*Math.PI/2; star4(ctx, Math.cos(a)*12, -9+Math.sin(a)*4, 1.2, `hsl(${(t*120+i*90)%360},95%,74%)`); } }
  ctx.globalAlpha = a0;
}
function bannerPole(ctx, x, y0, y1, col){ ctx.strokeStyle='#8a94a6'; ctx.lineWidth=1.4; ln(ctx,x,y0,x,y1); ctx.globalAlpha*=0.75; ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(x,y1); ctx.lineTo(x-9,y1+1.5); ctx.lineTo(x-9,y1+6); ctx.lineTo(x,y1+7); ctx.closePath(); ctx.fill(); ctx.globalAlpha/=0.75; ctx.fillStyle='#e8f6ff'; ctx.beginPath(); ctx.arc(x,y1,1.3,0,Math.PI*2); ctx.fill(); }
const ARM = '#e3e9f0', ARM2 = '#b9c3cf', SUIT = '#2b3242', VIS = '#141a26';
function visor(ctx, x, y, w, h, glow){ ctx.fillStyle = VIS; rr(ctx, x, y, w, h, Math.min(h/2, 1.6)); ctx.fill(); ctx.fillStyle = glow; ctx.globalAlpha *= 0.9; ctx.fillRect(x+w*0.45, y+h*0.25, w*0.45, Math.max(0.7, h*0.28)); ctx.globalAlpha /= 0.9; }
function drawKnight(ctx, o, color, fx){
  const t = o.time || 0, hov = Math.sin(t*5 + (o.walk||0)*0.3)*1.1, mv = o.moving;
  const by = hov;
  // underglow and thrust
  ctx.fillStyle = color; ctx.globalAlpha *= 0.35; ctx.beginPath(); ctx.ellipse(0, 9, 13, 2.6, 0, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha /= 0.35;
  if (mv){ const fl = 4 + Math.random()*4; ctx.fillStyle = '#ffd27a'; ctx.beginPath(); ctx.moveTo(-14, 0+by); ctx.lineTo(-14-fl, 1.5+by); ctx.lineTo(-14, 3+by); ctx.closePath(); ctx.fill(); ctx.fillStyle = '#fff3c4'; ctx.beginPath(); ctx.moveTo(-14, 0.8+by); ctx.lineTo(-14-fl*0.5, 1.5+by); ctx.lineTo(-14, 2.2+by); ctx.closePath(); ctx.fill(); }
  // bike hull
  ctx.lineWidth = 1.3; ctx.strokeStyle = OUT;
  ctx.fillStyle = '#5b6576'; ctx.beginPath(); ctx.moveTo(-15, -1+by); ctx.lineTo(-6, -4+by); ctx.lineTo(10, -3+by); ctx.lineTo(19, 1+by); ctx.lineTo(10, 4.5+by); ctx.lineTo(-13, 4+by); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(-6, -3.6+by); ctx.lineTo(10, -2.6+by); ctx.lineTo(14, -0.4+by); ctx.lineTo(-5, -0.8+by); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#8fd9ff'; ctx.beginPath(); ctx.moveTo(9, -3+by); ctx.lineTo(13, -6+by); ctx.lineTo(15, -1.5+by); ctx.closePath(); ctx.fill(); ctx.lineWidth = 0.8; ctx.stroke();
  ctx.fillStyle = '#3a4250'; rr(ctx, -16, -2+by, 4, 6, 1.5); ctx.fill(); ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = '#7ff3ff'; ctx.fillRect(15.5, 0.4+by, 2.4, 1.2);
  const rb = by - 3.5;
  if (o.tier==='mythic'){ ctx.fillStyle='#d9a531'; ctx.beginPath(); ctx.moveTo(-3,-9+rb); ctx.lineTo(-14,-2+rb); ctx.lineTo(-10,2+rb); ctx.lineTo(0,-3+rb); ctx.closePath(); ctx.fill(); ctx.lineWidth=0.9; ctx.strokeStyle=OUT; ctx.stroke(); }
  if (fx.banner) bannerPole(ctx, -4, -4+rb, -33+rb, fx.warmaster ? '#ffb347' : color);
  // rider
  ctx.strokeStyle = SUIT; ctx.lineWidth = 2.6; ln(ctx, -1, 0+rb, 4, 6+rb);
  rr(ctx,-4.5,-9+rb,9,9,3); ctx.fillStyle=color; ctx.fill(); ctx.lineWidth=1.3; ctx.strokeStyle=OUT; ctx.stroke();
  ctx.beginPath(); ctx.arc(0,-13.5+rb,4.7,0,Math.PI*2); ctx.fillStyle = fx.gold ? '#e8b84a' : (o.paint || ARM); ctx.fill(); ctx.stroke();
  visor(ctx, -0.5, -15.2+rb, 5.4, 2.6, fx.berserk ? '#ff4b3a' : (o.visor || '#7ff3ff'));
  ctx.fillStyle = color; ctx.fillRect(-4.2, -17.4+rb, 3.2, 1.6);
  if (fx.phoenix) plume(ctx, 1, -17+rb);
  if (o.tier==='mythic') crown(ctx, 0, -20+rb);
  if (fx.halo) halo(ctx, 0, -23+rb);
  const thrust = Math.sin((o.swing||0)*Math.PI)*4;
  ctx.strokeStyle='#4a5260'; ctx.lineWidth=2; ln(ctx,-2+thrust,-6+rb,18+thrust,-10+rb);
  ctx.strokeStyle = fx.gold ? '#ffe08a' : '#bff6ff'; ctx.lineWidth = 2.2; ln(ctx,17+thrust,-9.8+rb,23+thrust,-11+rb);
  ctx.fillStyle = 'rgba(160,240,255,.35)'; ctx.beginPath(); ctx.arc(22+thrust,-10.8+rb,2.6,0,Math.PI*2); ctx.fill();
  if (fx.storm && (((o.time||0)*8)|0)%3!==0){ ctx.strokeStyle='#9ad7ff'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(-9,-16+rb); ctx.lineTo(-6,-13+rb); ctx.lineTo(-9,-10+rb); ctx.moveTo(8,-6+rb); ctx.lineTo(6,-3+rb); ctx.lineTo(9,0+rb); ctx.stroke(); }
}
function traitFx(ctx, o, c, bob, step, tm, alpha, fx, helm){
  if (fx.jets && c!=='knight' && c!=='bard'){ const fl = o.moving ? 2.6 + ((tm*40)%2) : 1; ctx.fillStyle='rgba(255,179,71,.85)'; for (const sx of [-3+step, 3-step]){ ctx.beginPath(); ctx.moveTo(sx-1.3,11.2); ctx.lineTo(sx,11.2+fl); ctx.lineTo(sx+1.3,11.2); ctx.closePath(); ctx.fill(); } }
  if (fx.plates && c!=='knight' && c!=='bard'){ ctx.fillStyle = helm || '#b9c3cf'; ctx.strokeStyle = OUT; ctx.lineWidth = 1; for (const sx of [-1,1]){ ctx.beginPath(); ctx.ellipse(6.4*sx,-5.6+bob,3.4,2.4,0.3*sx,0,Math.PI*2); ctx.fill(); ctx.stroke(); } }
  if (fx.charged){ const p = 0.5+0.5*Math.sin(tm*6); ctx.fillStyle = `rgba(127,243,255,${0.16+0.22*p})`; ctx.beginPath(); ctx.arc(c==='knight'?18:9, c==='knight'?-4:-2+bob, 4.5+p*1.6, 0, Math.PI*2); ctx.fill(); }
  if (fx.laser && (c==='archer'||c==='crossbow'||c==='mage')){ const y0 = (c==='crossbow'?-6:c==='mage'?-8:-2)+bob, x0 = c==='crossbow'?15:c==='mage'?10:18; ctx.strokeStyle='rgba(255,60,60,.5)'; ctx.lineWidth=0.6; ln(ctx, x0, y0, x0+26, y0); ctx.fillStyle='#ff3b3b'; ctx.beginPath(); ctx.arc(x0+26, y0, 1, 0, Math.PI*2); ctx.fill(); }
  if (fx.leech){ const dy = (tm*10)%9; ctx.globalAlpha = alpha*(1-dy/9); ctx.fillStyle='#ff4a5e'; ctx.beginPath(); ctx.arc(c==='knight'?14:8, -2+bob+dy, 1, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = alpha; }
  if (fx.lucky){ const a = tm*1.6; star4(ctx, Math.cos(a)*9, -17+bob+Math.sin(a)*2, 0.85, '#ffe08a'); }
  if (fx.venge){ for (let i=0;i<2;i++){ const ph = (tm*1.4+i*0.5)%1; ctx.globalAlpha = alpha*(1-ph)*0.85; ctx.fillStyle='#c79bff'; ctx.beginPath(); ctx.arc(i?5.5:-5.5, -7+bob-ph*7, 1.7*(1-ph)+0.4, 0, Math.PI*2); ctx.fill(); } ctx.globalAlpha = alpha; }
  if (fx.second){ const p = 0.5+0.5*Math.sin(tm*4); ctx.fillStyle = `rgba(94,240,160,${0.45+0.4*p})`; ctx.fillRect(-1.1,-3.2+bob,2.2,2.2); }
  if (fx.arcs && c==='shield' && ((tm*7)|0)%3===0){ ctx.strokeStyle='#bff6ff'; ctx.lineWidth=0.8; ctx.beginPath(); ctx.moveTo(6,-11+bob); ctx.lineTo(9.5,-7+bob); ctx.lineTo(6.5,-3+bob); ctx.lineTo(10,2+bob); ctx.stroke(); }
  if (fx.skull && c!=='knight'){ ctx.fillStyle='#e8e4d8'; ctx.beginPath(); ctx.arc(-2.8,-2.6+bob,1.5,0,Math.PI*2); ctx.fill(); ctx.fillStyle=OUT; ctx.fillRect(-3.5,-3+bob,0.6,0.6); ctx.fillRect(-2.5,-3+bob,0.6,0.6); }
}
function drawUnit(ctx, o){
  const color = o.color, dark = shade(color, 0.55), fx = o.fx || NOFX, tm = o.time || 0;
  const s = o.s * (o.cls==='warlord' ? 1.55 : 1) * (fx.colossus ? 1.28 : fx.giant ? 1.14 : 1);
  const alpha = o.alpha ?? 1;
  ctx.save(); ctx.translate(o.x, o.y); ctx.globalAlpha = alpha;
  ctx.fillStyle = 'rgba(0,0,0,.32)'; ctx.beginPath(); ctx.ellipse(0, 10*s, (o.cls==='knight'?13:8)*s, 3*s, 0, 0, Math.PI*2); ctx.fill();
  if (o.tier && o.deadT == null) tierRing(ctx, o.tier, s, tm, o.cls==='knight');
  if (o.deadT != null) ctx.rotate(-o.facing * 1.4 * Math.min(1, o.deadT*4));
  ctx.scale(s*o.facing, s);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  let top = -22;
  if (o.cls==='knight'){ drawKnight(ctx, o, color, fx); top = -30; ctx.save(); ctx.translate(0,-6); traitFx(ctx, o, 'knight', 0, 0, tm, alpha, fx, o.paint||null); ctx.restore(); }
  else {
    const c = o.cls, bob = o.moving ? Math.sin(o.walk)*1.1 : 0, step = o.moving ? Math.sin(o.walk)*2.6 : 0, sw = o.swing||0;

function setupCanvas(c, w, h){
  const dpr = Math.min(3, window.devicePixelRatio||1);
  c.width = Math.round(w*dpr); c.height = Math.round(h*dpr);
  const ctx = c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); return ctx;
}

  paintBossPortraits(root);

    const size = c.clientWidth || 56; const ctx = setupCanvas(c, size, size);
    const cls = c.dataset.cls, foe = c.dataset.side==='foe';
    const div = cls==='warlord' ? 40 : cls==='knight' ? 36 : (cls==='mage'||cls==='spear') ? 30 : 26;
    const xo = cls==='knight' ? (foe?0.58:0.42) : cls==='spear' ? (foe?0.6:0.4) : 0.5;
    const fx = {}; (c.dataset.fx||'').split(',').forEach(k=>{ if (k) fx[k]=true; });
    const scl = fx.colossus ? 1.28 : fx.giant ? 1.14 : 1;
    drawUnit(ctx, {cls, paint:c.dataset.paint||null, visor:c.dataset.visor||null, color: foe ? '#ef6a52' : teamHex(), skin:c.dataset.skin||SKINS[0], x:size*xo, y:size*(cls==='mage'||cls==='knight'?0.7:cls==='warlord'?0.66:0.62), s:size/div/scl, facing: foe?-1:1, tier:c.dataset.tier||null, fx, time:0.6});
  });
}

  const r = rng(), rar = r<w[0] ? 'common' : r<w[0]+w[1] ? 'rare' : r<w[0]+w[1]+w[2] ? 'epic' : 'legendary';
  const k = 'spell';
  let pool = ringsOfKind(k, [rar]); if (!pool.length) pool = ringsOfKind(k);
  return pick(rng, pool);
}
function rollRingShop(){
  const rng = mulberry32((state.seed + state.battle*389 + state.fights*17 + (state.ringRolls||0)*991) >>> 0);
  const w = state.fights < 4 ? [0.12,0.48,0.3] : [0.08,0.44,0.34];
  const first = state.fights===0 && !state.ringRolls;
  const ids = first ? [rollRing(rng,[0,0.7,0.3]), rollRing(rng,[0,1,0])] : [rollRing(rng,w), rollRing(rng,w)];
  if (ids[0]===ids[1]) ids[1] = rollRing(rng, w);
  state.ringShop = ids.map(id=>({id, price:price(RING_PRICE[RINGS[id].rarity]), sold:false}));
}
const ringIcon = (id, sm) => { const rar = id && RINGS[id] ? RINGS[id].rarity : 'empty'; return `<span class="ringi ${sm?'sm':''} ${rar} ${id&&RINGS[id]&&RINGS[id].kind==='ult'?'ult':''}" aria-hidden="true"><i></i></span>`; };
function ringCard(o, i){
  const R = RINGS[o.id];
  return `<article class="unit ${R.rarity==='epic'?'t-epic':R.rarity==='legendary'?'t-legendary':''} ${o.sold?'off':''}">
    ${ringIcon(o.id)}
    <div style="min-width:0"><div class="uname">${esc(R.name)}<span class="badge ${R.rarity}">${R.rarity}</span></div>
      <div class="usub">${esc(R.desc)}</div></div>
    <button class="btn small num" data-act="ringbuy" data-i="${i}" ${o.sold||state.gold<o.price?'disabled':''}>${o.sold?'Sold':o.price+'cr'}</button></article>`;
}
function ringShopSection(){
  if (!state.ringShop) rollRingShop();
  return `<section class="shop"><div class="sec-h"><h2>Ringmaker</h2><span>Spells and ultimates</span></div>
    <div class="list">${state.ringShop.map(ringCard).join('')}</div>
    <div class="shop-foot"><span>Each soldier wears 2 spell rings and 1 ultimate signet. Equip from their card.</span><button class="btn ghost num" data-act="ringreroll" ${state.gold<15?'disabled':''}>New stock · 15cr</button></div></section>`;
}
function ringSlotsHTML(u){
  const sp = u.spells || [], have = [...new Set(state.rings||[])];
  const slot = (id, label, key) => id && RINGS[id]
    ? `<div class="slot">${ringIcon(id,true)}<div><b class="r-${RINGS[id].rarity}">${esc(RINGS[id].name)}</b><span>${esc(RINGS[id].desc)}</span></div><button class="btn ghost small" data-act="ringremove" data-slot="${key}">Remove</button></div>`
    : `<div class="slot empty">${ringIcon(null,true)}<div><b>${label}</b><span>Empty</span></div></div>`;
  return `<div class="sh-sec"><h3>Spells and ultimate</h3>
    ${slot(sp[0],'Spell ring 1','0')}${slot(sp[1],'Spell ring 2','1')}${slot(u.ult,'Ultimate signet','u')}
    ${have.length ? `<div class="gopts">${have.map(id=>{ const R = RINGS[id]; return `<button class="gopt" data-act="ringequip" data-ring="${id}"><span>${ringIcon(id,true)} <b class="r-${R.rarity}">${esc(R.name)}</b> <span class="muted">${R.kind==='ult'?'Ultimate':'Spell'} · ${esc(R.desc.replace(/^Ultimate: (.)/,(m,c)=>c.toUpperCase()))}</span></span><span class="eq">Equip</span></button>`; }).join('')}</div>` : '<p class="hint">Buy rings from the Ringmaker in camp, or win them from elite fights, sieges and markets.</p>'}</div>`;
}
function equipRing(u, id, slot){
  const idx = (state.rings||[]).indexOf(id); if (!u || idx<0) return;
  const R = RINGS[id];
  if (R.kind==='ult'){ state.rings.splice(idx,1); if (u.ult) state.rings.push(u.ult); u.ult = id; }
  else {
    u.spells = (u.spells && u.spells.length===2) ? u.spells : [u.spells?.[0]||null, u.spells?.[1]||null];
    let s = slot==='0'||slot==='1' ? +slot : u.spells.findIndex(x=>!x);
    if (u.spells.includes(id) && u.spells[s]!==id) return toast(`${u.name} already wears a ${R.name}.`);
    state.rings.splice(idx,1);
    if (s<0) s = 1;
    if (u.spells[s]) state.rings.push(u.spells[s]);
    u.spells[s] = id;
  }
  discover([u], true); save(); sfx('tap');
  checkAch();
}
function removeRing(u, key){
  if (!u) return;
  if (key==='u'){ if (u.ult){ state.rings.push(u.ult); u.ult = null; } }
  else { const i = +key; if (u.spells && u.spells[i]){ state.rings.push(u.spells[i]); u.spells[i] = null; } }
  save();
}

/* ring casting in battle */
function zapFx(a, b, col){ if (!B.skipping) B.zaps.push({x1:a.x,y1:a.y-8,x2:b.x,y2:b.y-8,life:0.3,col}); }
function bestCluster(f, r){ const foes = foesOf(f); let best = null, bn = -1; for (const o of foes){ let n = 0; for (const q of foes) if (Math.hypot(q.x-o.x,q.y-o.y) < r) n++; if (n>bn){ bn = n; best = o; } } return best; }
function mostWounded(f, thr){ let best = null, bf = thr; for (const o of B.fs) if (o.alive && o.side===f.side){ const fr = o.hp/o.maxHp; if (fr<bf){ bf = fr; best = o; } } return best; }
function launch(f, t, kind, onHit){ const k = PROJ[kind] || PROJ.orb, d = Math.hypot(t.x-f.x, t.y-f.y); B.ps.push({src:f, tgt:t, kind, arc:k.arc, sx:f.x+6*f.facing, sy:f.y-10, t:0, dur:Math.max(0.12, d/k.v), mult:0, onHit}); }
function castText(f, id){ const R = RINGS[id]; addText(f.x, f.y-40, R.short, RARCOL[R.rarity], R.kind==='ult'?11:8); }
function ringStep(f, dt){
  if (f.burn && f.burn.t>0){ f.burn.t -= dt; damage(f.burn.src, f, f.burn.dps*dt); if (!B.skipping && Math.random()<dt*6) sparks(f.x, f.y-6, f.burn.col||'#ff9f43', 1, 0.4); if (!f.alive) return; }
  if (f.stun>0){ f.stun -= dt*(f.bossK?2.5:1); f.moving = false; return 'stunned'; }
  f.hasteT -= dt; f.shieldT -= dt; f.titanT -= dt; if ((f.buffT -= dt) <= 0) f.buffM = 1;
  if (f.whirlT>0){ f.whirlT -= dt; f.whirlTick -= dt; if (f.whirlTick<=0){ f.whirlTick = 0.5; for (const o of B.fs) if (o.alive && o.side!==f.side && Math.hypot(o.x-f.x,o.y-f.y)<36) hit(f, o, 0.8, false); sparks(f.x, f.y-6, '#e7ecf2', 6, 1.2); } }
}
function meteorStep(dt){
  for (let i=B.meteors.length-1;i>=0;i--){
    const m = B.meteors[i]; m.t += dt;
    if (m.t>=m.dur && !m.hit){ m.hit = true;
      for (const o of B.fs) if (o.alive && o.side!==m.src.side && Math.hypot(o.x-m.x,o.y-m.y)<m.r){ hit(m.src, o, m.mult, false); if (m.stun && o.alive) o.stun = Math.max(o.stun||0, m.stun); }
      B.shake = Math.min(6, B.shake + (m.big?6:3)); sparks(m.x, m.y, '#ff9f43', m.big?30:16, m.big?2:1.4); puff(m.x, m.y); if (m.big){ hitStop(0.1); punch(m.x, m.y, 0.1); } }
    if (m.t > m.dur + 0.45) B.meteors.splice(i,1);
  }
  for (let i=B.rings.length-1;i>=0;i--){ B.rings[i].t += dt; if (B.rings[i].t > 0.6) B.rings.splice(i,1); }
}
function drawRingFx(ctx, f, x, y){

    if (m.t < m.dur){ const k = m.t/m.dur, sx = m.x + 70, sy = -30, x = sx + (m.x-sx)*k, y = sy + (m.y-sy)*k, r = m.big ? 11 : 6;

function drawUltBanner(ctx){
